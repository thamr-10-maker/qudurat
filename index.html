  function draw() {
    const rels = rounds[k]; bar(k); pool.innerHTML = ''; bk.innerHTML = ''; fb.textContent = 'اضغط زوجًا، ثم اضغط العلاقة التي تناسبه';
    const items = shuffle(rels.flatMap(r => pickN(PAIRS[r], 2).map(p => ({ p, r }))));
    let sel = null, left = items.length;
    const tiles = items.map(it => { const t = vtile(pairText(it.p)); t.onclick = () => { if (t.disabled) return; FX.play('select'); tiles.forEach(x => x.classList.toggle('sel', x === t)); sel = { t, it }; }; pool.appendChild(t); return t; });

          if (--left === 0) { tick(k); if (k < rounds.length - 1) nextBtn(fb, 'المجموعة التالية ←', () => { k++; draw(); }); } }

/* ---------- direction trap: flip a pair and watch the bridge break ---------- */

  const bar = roundBar(st, rounds.length), stem = h('div', 'pair big'), br = h('div', 'bridge'), fl = h('button', 'chip', '⇄ اقلب الترتيب'), opts = h('div', 'vopts col'), fb = h('div', 'vfb small');

  function show() { const R = rounds[k], p = flipped ? [R.stem[1], R.stem[0]] : R.stem; stem.textContent = pairText(p); br.innerHTML = flipped ? `${REL[R.rel].bridge(...p)}… <b>لا تصح</b>` : `${REL[R.rel].bridge(...p)}`; }

      b.onclick = () => { if (b.disabled) return; b.disabled = true; b.innerHTML = `${pairText(p)}<small>${REL[R.rel].bridge(...p)} ${good ? '✓' : '✗'}</small>`; b.classList.add(good ? 'ok' : 'bad'); FX.play(good ? 'correct' : 'wrong');

/* ---------- slot: tap a word to put it in the blank and read the sentence ---------- */
W.slot = items => (host, ctx) => {
  const st = vstage(host); const tick = ctx.tasks(items.map((it, i) => `املأ الجملة ${ar(i + 1)} بالكلمة المناسبة`));

    shuffle(it.o.map((o, i) => i)).forEach(i => { const [w, note] = it.o[i]; const t = vtile(w); row.appendChild(t);
      t.onclick = () => { if (done) return; FX.play('select'); sent.innerHTML = fillBlank(it.s, w); [...row.children].forEach(x => x.classList.remove('sel')); t.classList.add('sel');
        if (i === 0) { done = true; t.classList.add('ok'); FX.play('correct'); fb.innerHTML = '✓ ' + note; tick(k); if (k < items.length - 1) nextBtn(fb, 'الجملة التالية ←', () => { k++; draw(); }); }
        else { t.classList.add('bad'); fb.innerHTML = '✗ ' + note; } }; });

/* ---------- connectors: build sentences whose parts agree or contrast ---------- */
W.connect = frames => (host, ctx) => {
  const st = vstage(host); const tick = ctx.tasks(['كوّن جملة فيها <b>نتيجة متوقعة</b>', 'كوّن جملة فيها <b>نتيجة عكس المتوقع</b>']);
  const bar = roundBar(st, frames.length), sent = h('div', 'vsent big'), c1 = h('div', 'vopts'), c2 = h('div', 'vopts'), fb = h('div', 'vfb');
  st.append(sent, h('div', 'vlab', 'كلمة الربط:'), c1, h('div', 'vlab', 'النتيجة:'), c2, fb);
  let k = 0, con = null, res = null;
  function upd() {
    const F = frames[k]; sent.innerHTML = `${F.start}، <b class="fill">${con ? con[0] : '…'}</b> <b class="fill">${res ? res[0] : '…'}</b>.`;

    else { FX.play('wrong'); fb.innerHTML = `✗ غير منطقية: «${con[0]}» ${con[1] === 'same' ? 'تحتاج نتيجة متوقعة' : 'تحتاج نتيجة عكس المتوقع'}`; }
  }
  function draw() { const F = frames[k]; bar(k); con = res = null; c1.innerHTML = ''; c2.innerHTML = '';
    F.cons.forEach(c => { const b = h('button', 'chip', c[0]); b.onclick = () => { con = c; [...c1.children].forEach(x => x.classList.toggle('on', x === b)); upd(); }; c1.appendChild(b); });
    F.res.forEach(r => { const b = h('button', 'chip', r[0]); b.onclick = () => { res = r; [...c2.children].forEach(x => x.classList.toggle('on', x === b)); upd(); }; c2.appendChild(b); });
    upd(); if (frames.length > 1 && k < frames.length - 1) nextBtn(fb, 'مثال آخر ←', () => { k++; draw(); }); }
  draw();
};

/* ---------- hunt: tap the word that breaks the meaning ---------- */
function errItem(i, k) { const { text, marks } = parseErr(ERRORS[i]); if (k == null) k = marks.findIndex(m => m.swap); return { text, marks, k }; }
W.hunt = (list, opts = {}) => (host, ctx) => {
  const st = vstage(host); const tick = ctx.tasks(list.map((x, i) => `جد الخطأ في الجملة ${ar(i + 1)}`).concat(opts.tone ? ['حدد اتجاه الجملة (إيجابي/سلبي) قبل البحث'] : []));
  const bar = roundBar(st, list.length), tone = h('div', 'vopts'), sent = h('div', 'vsent big'), fb = h('div', 'vfb small');
  st.append(tone, sent, fb);
  let n = 0;
  function draw() {
    const [i, k, tn] = list[n], E = errItem(i, k); bar(n); fb.textContent = opts.tone ? 'أولًا: هل الفكرة العامة للجملة إيجابية أم سلبية؟' : 'اضغط الكلمة التي تفسد معنى الجملة';

const BANK = {}; // unit id -> questions approved in the bank
function addBank(docs) {
  for (const k of Object.keys(BANK)) delete BANK[k];
  let n = 0;
  for (const d of docs || []) {
    if (!d || !distById(d.unit) || !d.q) continue;
    const cmp = d.kind === 'compare';
    if (!cmp && (!Array.isArray(d.choices) || d.choices.length < 2 || d.answer == null || !d.choices[d.answer])) continue;
    const s = { q: String(d.q), choices: cmp ? CMP : d.choices.map(String), answer: +d.answer, why: String(d.why || ''), level: +d.level || 2, dist: d.unit, qid: 'bank:' + d.id, gen: true, bank: true };
    if (cmp) { s.a = String(d.a || ''); s.b = String(d.b || ''); }
    if (d.passage) s.passage = String(d.passage);
    if (Array.isArray(d.sol) && d.sol.length) s.sol = d.sol.map(String);
    (BANK[d.unit] = BANK[d.unit] || []).push(s); n++;
  }
  return n;
}

/* PLUS[lessonId] adds the full teaching flow around an existing lesson:
   intro → (explanations + quick checks + rule cards) → worked example → solve together → order / fix-it → practice → summary */
const PLUS = {};
const DROPPED = []; // text steps replaced by theory cards (kept for review)
function applyPlus() {
  for (const d of DISTRICTS) for (const l of d.lessons || []) {
    const P = PLUS[l.id]; if (!P || l.paid) continue;
    if (P.flow && l.steps.some(s => s.intro)) { // a lesson written with its own intro: keep its intro, example, practice and summary, swap the teaching for the steps
      const st = l.steps, pick = k => st.find(s => s[k]), qs = st.filter(s => s.q && !s.check), out = [pick('intro')];
      out.push(...P.flow.map(a => ({ act: a })));
      const ex = P.example ? { example: P.example } : pick('example'), gu = P.guided ? { guided: P.guided } : pick('guided');
      if (ex) out.push(ex); if (gu) out.push(gu);
      out.push(...(P.keepQs ? qs.filter((_, i) => P.keepQs.includes(i)) : qs), ...(P.qs || []));
      const sm = P.summary ? { summary: P.summary } : pick('summary'); if (sm) out.push(sm);
      l.steps = out; continue;
    }
    if (l.steps.some(s => s.intro)) continue;
    const teach = l.steps.filter(s => !s.q), qs = l.steps.filter(s => s.q), out = [];
    if (P.intro) out.push({ intro: P.intro });
    const extra = (P.rules || []).map(r => ({ rule: r, after: r.after })).concat((P.checks || []).map(c => Object.assign({ check: true }, c)));
    if (P.flow) out.push(...P.flow.map(a => ({ act: a }))); // a lesson rebuilt as small hands-on steps replaces the old teaching part
    else teach.forEach((t, i) => { (P.explains || []).filter(e => (e.before || 0) === i).forEach(e => out.push({ explain: e }));
      const here = extra.filter(x => (x.after == null ? teach.length - 1 : x.after) === i);
      if (here.some(x => x.rule) && t.tip) { t = Object.assign({}, t); delete t.tip; } // a rule card replaces the paragraph tip
      const plainText = !t.widget && !t.fig && !t.goal; // with theory cards in place, a bare paragraph is just noise
      if (!(P.drop || []).includes(i) && !(P.explains && plainText)) out.push(t);
      else { DROPPED.push([l.id, t.say || '', t.tip || '']); if (t.tip) out.push({ tip: t.tip }); } // a rule written in the tip is kept on its own
      here.forEach(x => out.push(x)); });
    if (!teach.length && !P.flow) { (P.explains || []).forEach(e => out.push({ explain: e })); extra.forEach(x => out.push(x)); }
    if (P.example) out.push({ example: P.example });
    if (P.guided) out.push({ guided: P.guided });
    if (P.order) out.push({ order: P.order });
    if (P.fixit) out.push({ fixit: P.fixit });
    out.push(...(P.keepQs ? qs.filter((_, i) => P.keepQs.includes(i)) : qs), ...(P.qs || []));
    if (P.summary) out.push({ summary: P.summary });
    l.steps = out;
  }
  dropRepeats();
}
/* a worked example or practice question that only repeats what the hands-on steps just did is dropped,
   and practice is filled back up with fresh questions of the same lesson (list made by test/norep.js) */
function dropRepeats() {
  if (typeof NOREP === 'undefined') return;
  const key = s => String((s.example && s.example.q) || (s.guided && s.guided.q) || s.q || '').replace(/<[^>]+>/g, ' ').trim().slice(0, 60);
  for (const d of DISTRICTS) for (const l of d.lessons || []) {
    const N = NOREP[l.id]; if (!N || l.paid) continue;
    const isEx = s => s.example || s.guided || (s.q && !s.check);
    let st = l.steps.filter(s => !(isEx(s) && N.drop.includes(key(s))));
    const fresh = (N.fill || []).map(i => DIAG[l.id] && DIAG[l.id][i]).filter(Boolean).map(q => Object.assign({}, q));
    if (fresh.length) { const at = st.findIndex(s => s.summary); st.splice(at < 0 ? st.length : at, 0, ...fresh); }
    l.steps = st;
  }
}

}

  ban.innerHTML = `<span class="uic big">${d.exam ? ic('exam', 30) : d.sym}</span><div class="uh-body"><small class="eyebrow">${d.exam ? 'تدريب بظروف الاختبار' : `الوحدة ${ar(unitNo(d))} من ${ar(units().length)}`}</small><h2>${d.name}</h2><p>${d.desc}</p>${extra || ''}</div>`;
  return ban;

function showDistrict(d) {
  if (locked(d)) return showPaywall(d);
  screen(d.color);
  hud('', showCity).classList.add('over');
  const wrap = h('div', 'unitpage');
  app.appendChild(wrap);
  if (d.exam) {
    const pool = examPool(false).length;
    const hg = h('div', 'gut'); hg.appendChild(poster('billboard short', d, `<div class="bb-body"><small class="eyebrow">بظروف يوم الاختبار</small><h1>${d.name}</h1><p>وقت واحد للاختبار كله، والإجابات تظهر في النهاية مع تحليل حسب الوحدة. ${ar(pool)} سؤالًا من كل الوحدات.</p></div>`)); wrap.appendChild(hg);
    const list = h('div', 'lessons2 gut'); list.style.setProperty('--pc', posterVar(d));
    d.tests.forEach((t, i) => {
      const best = S.boss['exam-' + t.id];
      const row = h('button', 'lrow test' + (best != null ? ' done' : ''));
      row.innerHTML = `<span class="num">${ar(i + 1)}</span><span class="lbody"><b>${t.title}</b><small>${t.sub}</small></span><span class="lstate">${best != null ? ar(best) + '٪' : ''}</span>`;
      row.onclick = () => { FX.play('whoosh'); playExam(d, t); };
      list.appendChild(row);
    });
    wrap.appendChild(list);
    return;
  }
  const done = lessonsDone(d), total = d.lessons.length;
  const current = d.lessons.findIndex(l => !cleared(l));
  const head = poster('billboard short', d, `<div class="bb-body"><small class="eyebrow">الوحدة ${ar(unitNo(d))} · ${ar(done)} من ${ar(total)} دروس</small><h1>${d.name}</h1><p>${d.desc}</p><div class="bb-act"></div></div>`);
  if (current >= 0) { const go = h('button', 'play-btn', `${ic('play', 18)}<span>${done ? 'تابع' : 'ابدأ'}: ${fmt(d.lessons[current].title)}</span>`); go.onclick = () => { FX.play('whoosh'); playLesson(d, d.lessons[current]); }; head.querySelector('.bb-act').appendChild(go); }
  const hg = h('div', 'gut'); hg.appendChild(head); wrap.appendChild(hg);
  const list = h('div', 'lessons2 gut');
  list.style.setProperty('--pc', posterVar(d));
  d.lessons.forEach((l, i) => {
    const dst = S.done[l.id] ? null : dgState(l.id), planned = dst && dst !== 'green';
    const locked = !dgOn() && current !== -1 && i > current, isDone = !!S.done[l.id], known = dst === 'green';
    const row = h('button', 'lrow' + (locked ? ' locked' : '') + (i === current && !dgOn() ? ' current' : '') + (isDone ? ' done' : '') + (dst ? ' st-' + dst : ''));
    const tag = known ? 'متقن · تتخطاه' : planned ? `في خطتك · ${DG_NAME[dst]}` : i === current && !dgOn() ? 'التالي' : '';
    row.innerHTML = `<span class="num">${ar(i + 1)}</span><span class="lbody"><b>${fmt(l.title)}</b>${tag ? `<small>${tag}</small>` : ''}</span><span class="lstate">${isDone || known ? ic('check', 18) : planned ? `<i class="sdot ${dst}"></i>` : ''}</span>`;
    row.onclick = () => { if (locked) { FX.play('wrong'); toast('أكمل الدرس السابق أولًا'); } else { FX.play('whoosh'); if (dst === 'yellow') dgPractice(d, l); else playLesson(d, l); } };
    list.appendChild(row);
  });
  const bossLocked = current !== -1;
  const bn = h('button', 'lrow test' + (bossLocked ? ' locked' : '') + (current === -1 ? ' current' : ''));
  bn.innerHTML = `<span class="num">${ic('timer', 20)}</span><span class="lbody"><b>اختبار الوحدة</b><small>١٠ أسئلة · دقيقة لكل سؤال</small></span><span class="lstate">${S.boss[d.id] ? ar(S.boss[d.id]) + '٪' : ''}</span>`;
  bn.onclick = () => { if (bossLocked) { FX.play('wrong'); toast('أنهِ كل الدروس لفتح اختبار الوحدة'); } else { FX.play('whoosh'); playBoss(d); } };
  list.appendChild(bn);
  wrap.appendChild(list);
  /* practice for this unit */
  const [sec, row] = rail('تدرّب على الوحدة'); sec.classList.add('flush');
  const t = (icon, title, sub, fn, off) => { const b = h('button', 'ptile', `<span class="pt-ic">${ic(icon, 22)}</span><b>${title}</b><small>${sub}</small>`); if (off) b.disabled = true; b.onclick = fn; row.appendChild(b); };
  if (GEN[d.id]) t('practice', 'تدريب مفتوح', ['', 'سهل', 'متوسط', 'صعب'][S.level[d.id] || 1], () => { FX.play('whoosh'); playEndless(d); });
  t('review', 'أسئلة الدروس', done ? 'من الدروس التي أنهيتها' : 'بعد أول درس', () => { FX.play('whoosh'); playPractice(d); }, done === 0);
  const sums = d.lessons.filter(l => S.done[l.id] && l.steps.some(s => s.summary));
  if (sums.length) t('book', 'الملخصات', `${ar(sums.length)} خلاصة`, () => { FX.play('tap'); showSummaries(d); });
  wrap.appendChild(sec);
}

/* ---------- PLAYER (lessons, practice, unit test, exam) ---------- */
function playLesson(d, lesson, direct) {
  if (lesson.paid || locked(d)) return showPaywall(d); // on the free site a paid lesson is a title only
  if (!direct && !S.done[lesson.id] && dgState(lesson.id) === 'check') return dgGate(d, lesson);
  runPlayer({ d, mode: 'lesson', lesson, steps: lesson.steps.slice(), title: lesson.title }); }
function allQuestions(d, onlyDone) {
  const qs = [];
  for (const l of d.lessons || []) if (!onlyDone || S.done[l.id]) for (const s of l.steps) if (s.q) qs.push(s);
  return qs;
}
function playPractice(d) { runPlayer({ d, mode: 'practice', steps: shuffle(allQuestions(d, true)).slice(0, 8), title: 'أسئلة الدروس' }); }
function examPool(cmpOnly) {
  const qs = [];
  for (const d of DISTRICTS) { if (d.soon || d.exam) continue; for (const s of allQuestions(d, false).concat(d.boss || [], bankOf(d.id))) if (!cmpOnly || (cmpOnly === true ? s.choices === CMP : cmpOnly.includes(d.id))) qs.push(s); }
  return qs;
}
function playExam(d, t) { runPlayer({ d, mode: 'exam', test: t, steps: shuffle(examPool(t.cmpOnly)).slice(0, t.n), title: t.title, total: t.secs }); }
function genFor(dids, level) { const id = pickOne(dids); const B = bankOf(id); if (B.length && Math.random() < 0.3) return Object.assign({}, pickOne(B)); return genQuestion(id, level || S.level[id] || 1); }
function playEndless(d) {
  const ids = d ? [d.id] : Object.keys(GEN).filter(id => DISTRICTS.some(x => x.id === id && !x.soon && !locked(x)));
  runPlayer({ d, mode: 'endless', gen: ids, steps: [genFor(ids)], title: d ? 'تدريب مفتوح · ' + d.name : 'تدريب مفتوح · كل الوحدات' });
}
function playReview() { runPlayer({ d: null, mode: 'review', steps: dueMistakes().slice(0, 12), title: 'مراجعة الأخطاء' }); }
function playPlacement() { return dgIntro(); }
function playPlacementOld() {
  const steps = [];
  for (const id of Object.keys(WEIGHT)) { if (!GEN[id]) continue; const gi = shuffle(GEN[id].map((_, i) => i)); steps.push(genQuestion(id, 1, gi[0]), genQuestion(id, 2, gi[1])); }
  runPlayer({ d: null, mode: 'placement', steps: steps.filter(Boolean), title: 'اختبار تحديد المستوى' });
}
function playBoss(d) { runPlayer({ d, mode: 'boss', steps: shuffle(d.boss.concat(bankOf(d.id))).slice(0, 10), title: 'اختبار الوحدة', timer: 60 }); }

function runPlayer(P) {
  screen(P.d && P.d.color);
  const queue = P.steps.map(s => ({ s, again: false }));
  const exam = P.mode === 'exam' || P.mode === 'placement', endless = P.mode === 'endless';
  const back = () => P.d ? showDistrict(P.d) : showCity();
  let run = 0, miss = 0;
  let idx = 0, mistakes = 0, correct = 0, tick = null, combo = 0, gained = 0, rankUp = null;
  const log = []; // {s, chosen, ok}
  const wrap = h('div', 'player');
  const top = h('div', 'ptop gut');
  const x = h('button', 'xbtn', ic('close', 22)); x.setAttribute('aria-label', 'خروج');
  x.onclick = () => { FX.play('tap'); if (endless && log.length) { idx = queue.length; render(); } else back(); };
  const pbar = h('div', 'pbar', '<i style="width:0%"></i>');
  const comboEl = h('span', 'combo');
  const timerEl = h('span', 'ptimer'); timerEl.hidden = !(P.timer || P.total);
  let totalTick = null;
  if (P.total) {
    let left = P.total;
    const show = () => { timerEl.textContent = ar(Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0')); timerEl.classList.toggle('low', left <= 60); };
    show();
    totalTick = setInterval(() => { left--; show(); if (left <= 0) { clearInterval(totalTick); toast('انتهى الوقت'); idx = queue.length; render(); } }, 1000);
  }
  top.append(x, pbar, comboEl, timerEl);
  const ttl = h('div', 'ptitle gut', `<small>${P.d ? P.d.name : COURSE.section}</small><b>${fmt(P.title)}</b>`);
  /* lesson phases: intro → learn → worked example → solve together → practice → summary */
  const PHASES = [['intro', 'مقدمة'], ['learn', 'الشرح'], ['example', 'مثال محلول'], ['guided', 'نحل معًا'], ['practice', 'تدريب'], ['summary', 'الخلاصة']];
  const phaseOf = s => s.intro ? 'intro' : s.example ? 'example' : (s.guided || s.order || s.fixit) ? 'guided' : s.summary ? 'summary' : (s.q && !s.check) ? 'practice' : 'learn';
  const structured = P.mode === 'lesson' && P.steps.some(s => s.intro || s.explain || s.act || s.example || s.guided || s.summary || s.order || s.fixit);
  const present = structured ? PHASES.filter(([k]) => P.steps.some(s => phaseOf(s) === k)) : [];
  const strip = h('div', 'phases gut');
  function paintPhase(s) { if (!structured) { strip.innerHTML = `<span class="ph on">${fmt(P.title)}</span>`; return; } const cur = phaseOf(s), ci = present.findIndex(p => p[0] === cur);
    strip.innerHTML = `<span class="ph on">${present[ci] ? present[ci][1] : ''}</span>`; }
  const pane = h('div', 'pbody gut');
  let body = pane; // the page being written now (in a lesson every step gets its own page)
  /* lessons are one scroll of linked pages: finished steps stay above exactly as the student left them,
     and nothing below the current page exists yet, so he can look back but never peek ahead */
  const paged = P.mode === 'lesson';
  if (paged) pane.classList.add('paged');
  const edge = h('div', 'lock-edge', `${ic('lock', 14)}<span>أكمل هذه الخطوة لتظهر التالية</span>`);
  const dock = h('div', 'dock');
  const dockIn = h('div', 'dock-in gut');
  dock.appendChild(dockIn);
  wrap.append(top, strip, pane);
  app.append(wrap, dock);
  cleanupFns.push(() => { clearInterval(tick); clearInterval(totalTick); dock.remove(); });

  function progress() { pbar.firstChild.style.width = (endless ? 10 * (log.length % 10) : 100 * idx / queue.length) + '%'; }
  function setDock(state, title, why, label, onClick, enabled = true) {
    dock.className = 'dock' + (state ? ' ' + state : '');
    dockIn.innerHTML = ''; dockIn.classList.remove('withback');
    if (title) { const hd = h('div', 'fb-head'); hd.innerHTML = `<span class="fb-ic">${ic(state === 'ok' ? 'check' : 'cross', 20)}</span>`; hd.appendChild(h('p', 'fb-t', title)); dockIn.appendChild(hd); }
    if (why) { const w = h('p', 'fb-w', fmt(why)); dockIn.appendChild(w); }
    const b = h('button', 'cta', label); b.disabled = !enabled; b.onclick = () => { FX.play('tap'); onClick(); };
    dockIn.appendChild(b);
    return b;
  }
  let stepCleanup = [];
  function render() {
    progress();
    clearInterval(tick); FX.stop();
    stepCleanup.forEach(f => f()); stepCleanup = [];
    if (idx >= queue.length) return finish();
    const { s, again } = queue[idx];
    if (paged) {
      const prev = body !== pane ? body : null;
      if (prev) { prev.classList.add('past'); prev.setAttribute('inert', ''); }
      body = h('div', 'lpage' + (prev ? ' pin' : '')); pane.appendChild(body); pane.appendChild(edge);
      if (prev) requestAnimationFrame(() => { const y = body.getBoundingClientRect().top + window.scrollY - top.offsetHeight - 6; window.scrollTo({ top: y, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); });
      else window.scrollTo(0, 0);
    } else { body.innerHTML = ''; window.scrollTo(0, 0); }
    paintPhase(s);
    if (s.intro) renderIntro(s); else if (s.act) renderAct(s); else if (s.explain) renderExplain(s); else if (s.rule) renderRule(s); else if (s.example) renderExample(s); else if (s.guided) renderGuided(s); else if (s.order) renderOrder(s); else if (s.fixit) renderFixit(s); else if (s.summary) renderSummary(s);
    else if (s.check) renderCheck(s); else if (s.q) renderQuestion(s, again); else renderTeach(s);
  }

  const next = () => { idx++; render(); };
  /* intro: goals + why it matters + an exam question you will be able to solve */
  function renderIntro(s) {
    const I = s.intro, c = h('section', 'intro');
    const li = P.d && P.lesson ? P.d.lessons.indexOf(P.lesson) : -1;
    if (P.d) body.appendChild(poster('billboard lesson', P.d, `<div class="bb-body"><small class="eyebrow">${P.d.name}${li >= 0 ? ` · الدرس ${ar(li + 1)}` : ''}</small><h1>${fmt(P.title)}</h1>${I.why ? `<p>${fmt(I.why)}</p>` : ''}</div>`));
    c.innerHTML = `<small class="eyebrow">ستتعلم</small><ul class="goals">${I.goals.map(g => `<li><span>${fmt(g)}</span></li>`).join('')}</ul>`;
    body.appendChild(c);
    if (false) { const pv = h('div', 'preview'); pv.innerHTML = `<small class="eyebrow">بنهاية الدرس ستحل سؤالًا مثل هذا</small><p class="qtext">${fmt(I.preview.q)}</p>${I.preview.a != null ? `<div class="cmp"><div><small>القيمة الأولى</small><span>${fmt(I.preview.a)}</span></div><div><small>القيمة الثانية</small><span>${fmt(I.preview.b)}</span></div></div>` : ''}<div class="pv-opts">${I.preview.choices.map((x, k) => `<span><i>${LETTERS[k]}</i>${fmt(x)}</span>`).join('')}</div>`; body.appendChild(pv); }
    setDock('', '', '', 'لنبدأ', next);
    if (dgOn() && P.lesson && !S.done[P.lesson.id] && DIAG[P.lesson.id]) {
      const sk = h('button', 'btn skipk', 'أعرف هذا؟ تخطَّه بسؤالين'); sk.onclick = () => { FX.play('tap'); dgSkipTest(P.d, P.lesson); };
      dockIn.appendChild(sk);
    }
  }
  /* a hands-on step: one idea, the student acts first and the name comes after. The lesson file drives it through ctx. */
  function renderAct(s) {
    const A = s.act, c = h('section', 'act');
    c.innerHTML = `<small class="eyebrow">${A.kicker || ''}</small><p class="act-say"></p>`;
    const fig = h('div', 'bfig act-fig'), svg = sv('svg', { viewBox: `0 0 360 ${A.h || 240}`, style: 'direction:ltr' }); fig.appendChild(svg);
    if (A.h === 0) fig.hidden = true; // a step that is only a question has no picture box
    const pick = h('div', 'act-pick'), msg = h('p', 'act-msg');
    c.append(fig, pick, msg); body.appendChild(c);
    const btn = setDock('', '', '', A.cta || 'التالي', next, false);
    const pop = e => { e.classList.remove('pop-in'); void e.offsetWidth; e.classList.add('pop-in'); };
    let finished = false;
    const ctx = {
      svg,
      layer() { const g = sv('g', {}, svg); return buildKit(svg, g); },
      wipe() { svg.innerHTML = ''; },
      say(t) { const e = c.querySelector('.act-say'); e.innerHTML = fmt(t); pop(e); },
      msg(t, cls = '') { msg.className = 'act-msg ' + cls; msg.innerHTML = t ? fmt(t) : ''; if (t) pop(msg); },
      choices(list, fn) { pick.innerHTML = ''; list.forEach(v => { const b = h('button', 'chip act-chip', fmt(String(v))); b.onclick = () => { if (b.disabled) return; fn(v, b); }; pick.appendChild(b); }); },
      clearChoices() { pick.innerHTML = ''; },
      tap(el, fn) { el.style.cursor = 'pointer'; el.addEventListener('click', e => { e.preventDefault(); fn(e); }); },
      ok() { FX.play('correct'); }, no() { FX.play('wrong'); }, tick() { FX.play('select'); },
      later(fn, ms) { const t = setTimeout(fn, ms); stepCleanup.push(() => clearTimeout(t)); },
      done() { if (finished) return; finished = true; btn.disabled = false; FX.play('correct'); },
      /* an equation written token by token: lines = [[ [text, cls], ... , note? ], ...] */
      board(lines, gap = 260) {
        const b = h('div', 'eqb'); let k = 0; const total = lines.reduce((n, l) => n + l.filter(t => typeof t !== 'string').length, 0); gap = Math.min(gap, 2400 / Math.max(1, total));
        lines.forEach(line => { const r = h('div', 'row' + (line.filter(t => typeof t !== 'string').length > 7 ? ' long' : '')); line.forEach(tk => { if (typeof tk === 'string') { r.appendChild(h('small', '', fmt(tk))); return; }
          const sp = h('span', 't ' + (tk[1] || ''), fmt(String(tk[0]))); sp.style.animationDelay = (k++ * gap) + 'ms'; r.appendChild(sp); }); b.appendChild(r); });
        c.insertBefore(b, msg); return b;
      },
    };
    window.__actSkip = () => ctx.done(); // automatic tests only
    A.run(ctx);
  }
  /* theory first: the idea in plain words, an example, why it works, and where you will use it */
  function renderExplain(s) {
    if (s.explain.build) return renderBuild(s.explain);
    const E = s.explain, c = h('section', 'explain');
    const parts = [['الفكرة', `<p class="idea">${fmt(E.idea)}</p>`]];
    if (E.example) parts.push(['مثال', `<div class="exbox">${fmt(E.example)}</div>`]);
    if (E.why) parts.push(['لماذا؟', `<div class="whybox">${fmt(E.why)}</div>`]);
    if (E.uses && E.uses.length) parts.push(['أين ستستخدمها؟', `<ul class="uses">${E.uses.map(u => `<li>${fmt(u)}</li>`).join('')}</ul>`]);
    c.innerHTML = `<h3>${fmt(E.title)}</h3><div class="xdots">${parts.map(() => '<i></i>').join('')}</div><small class="eyebrow xlab"></small><div class="xpart"></div>`;
    body.appendChild(c);
    if (E.fig) E.fig(body);
    if (S.settings.voice) setTimeout(() => FX.say(fmt(E.title + '. ' + E.idea)), 250);
    let k = 0;
    const show = () => {
      c.querySelector('.xlab').textContent = parts[k][0];
      const box = c.querySelector('.xpart'); box.innerHTML = parts[k][1]; box.classList.remove('pop-in'); void box.offsetWidth; box.classList.add('pop-in');
      c.querySelectorAll('.xdots i').forEach((d, i) => d.classList.toggle('on', i <= k));
      const last = k === parts.length - 1;
      setDock('', '', '', last ? 'فهمت، لنجرّب' : 'التالي: ' + parts[k + 1][0], () => { if (last) next(); else { k++; show(); } });
    };
    show();
  }
  /* build-up picture: the idea grows one layer at a time, one short line per layer, then where it is used */
  function renderBuild(E) {
    const B = E.build, frames = B.frames, W = 360, H = B.h || 230;
    const c = h('section', 'buildc');
    c.innerHTML = `<h3>${fmt(E.title)}</h3><div class="xdots">${frames.map(() => '<i></i>').join('')}${E.uses ? '<i></i>' : ''}</div>`;
    const fig = h('div', 'bfig'), svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, style: 'direction:ltr' }); fig.appendChild(svg);
    const say = h('p', 'bsay'); say.setAttribute('aria-live', 'polite');
    c.append(fig, say); body.appendChild(c);
    const layers = [];
    let k = -1;
    const dots = () => c.querySelectorAll('.xdots i').forEach((d, i) => d.classList.toggle('on', i <= k));
    function show(i) {
      while (layers.length > i) layers.pop().remove(); // going back: drop later layers
      for (let j = layers.length; j <= i; j++) {
        const F = frames[j], g = sv('g', { class: 'blayer' }, svg);
        if (F.clear) layers.forEach(l => l.classList.add('gone'));
        F.draw(buildKit(svg, g)); layers.push(g);
        if (j === i) { g.classList.add('bnew'); if (!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) { g.style.opacity = 0; requestAnimationFrame(() => { g.style.opacity = ''; }); } }
      }
      layers.forEach((l, j) => l.classList.toggle('past', j < i && !frames[i].keepBright));
      say.innerHTML = fmt(frames[i].say); say.classList.remove('pop-in'); void say.offsetWidth; say.classList.add('pop-in');
      k = i; dots(); FX.play('tap');
      const last = i === frames.length - 1;
      dockFor(last ? (E.uses ? 'أين ستستخدمها؟' : 'فهمت، لنجرّب') : 'التالي', () => { if (!last) show(i + 1); else if (E.uses) uses(); else next(); }, i > 0 ? () => show(i - 1) : null);
    }
    function uses() {
      k = frames.length; dots();
      fig.classList.add('shrink'); say.innerHTML = '';
      const ul = h('ul', 'uses bu'); ul.innerHTML = E.uses.map(u => `<li>${fmt(u)}</li>`).join(''); c.appendChild(ul);
      dockFor('فهمت، لنجرّب', next, () => { ul.remove(); fig.classList.remove('shrink'); show(frames.length - 1); });
    }
    function dockFor(label, go, back) {
      const cta = setDock('', '', '', label, go);
      if (back) { const b = h('button', 'backbtn', ic('back', 18)); b.setAttribute('aria-label', 'الخطوة السابقة'); b.onclick = () => { FX.play('tap'); back(); }; cta.before(b); dockIn.classList.add('withback'); }
      else dockIn.classList.remove('withback');
    }
    show(0);
  }
  /* a rule as a small structured card, not a paragraph */
  function renderRule(s) {
    if (s.say) body.appendChild(coach(s.say));
    const R = s.rule, c = h('section', 'rule');
    c.innerHTML = `<h3>${fmt(R.title)}</h3><div class="rrows">${R.items.map(([k, v]) => `<div class="rrow"><span class="rk">${fmt(k)}</span><span class="rv2">${fmt(v)}</span></div>`).join('')}</div>${R.note ? `<p class="rnote">${fmt(R.note)}</p>` : ''}`;
    body.appendChild(c);
    if (s.fig) s.fig(body);

    const pct = total ? Math.round(100 * correct / total) : 0;
    if (P.mode === 'placement') {

      stars = pct >= 80 ? 3 : pct >= 55 ? 2 : pct >= 30 ? 1 : 0;

    } else if (endless || P.mode === 'review') {

      rankUp = addXP(5) || rankUp;
    } else if (exam) {
      const key = 'exam-' + P.test.id;
      S.boss[key] = Math.max(S.boss[key] || 0, pct);
      stars = pct >= 90 ? 3 : pct >= 75 ? 2 : pct >= 50 ? 1 : 0;
      headline = `نتيجتك ${ar(pct)}٪`;
      rankUp = addXP(30) || rankUp;
    } else if (P.mode === 'boss') {
      S.boss[P.d.id] = Math.max(S.boss[P.d.id] || 0, pct);
      stars = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0;
      headline = pct >= 70 ? 'أتقنت هذه الوحدة' : 'تحتاج ٧٠٪ لإتقان الوحدة';
      rankUp = addXP(20) || rankUp;
    } else {
      stars = mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1;
      headline = ['حاول مرة أخرى', 'أنهيت الدرس', 'أحسنت', 'ممتاز، بدون أخطاء'][stars];
      if (P.mode === 'lesson') {
        const first = !S.done[P.lesson.id];
        S.done[P.lesson.id] = true;
        S.stars[P.lesson.id] = Math.max(S.stars[P.lesson.id] || 0, stars);

/* step-by-step solution: one step at a time */
function solutionBox(steps, open) {
  const box = h('div', 'solbox'), ol = h('ol'), btn = h('button', 'tool', `${ic('steps', 15)}<span>الحل خطوة بخطوة</span>`);
  let k = 0;
  const more = () => { if (k >= steps.length) return; FX.play('tap'); ol.appendChild(h('li', 'pop-in', fmt(steps[k++]))); btn.innerHTML = k < steps.length ? `${ic('steps', 15)}<span>الخطوة التالية</span>` : `${ic('check', 15)}<span>اكتمل الحل</span>`; btn.disabled = k >= steps.length; };
  btn.onclick = more; box.append(ol, btn);
  if (open) more();
  return box;
}
function weakestTopic() {
  let best = null, low = 2;
  for (const id of Object.keys(WEIGHT)) { const a = topicAcc(id), d = distById(id); if (a != null && d && !d.soon && a < low) { low = a; best = d; } }
  return best;
}

/* ---- small drawing helpers (words in boxes, sentences, pages) ---- */
const box = (K, t, cls, px = 10, py = 6, rx = 12) => {
  const bb = t.getBBox(), y = +t.getAttribute('y');
  const r = sv('rect', { x: bb.x - px, y: bb.y - py, width: bb.width + 2 * px, height: bb.height + 2 * py, rx, class: cls }); K.g.insertBefore(r, t);
  return { l: bb.x - px, r: bb.x + bb.width + px, t: bb.y - py, b: bb.y + bb.height + py, cx: bb.x + bb.width / 2, y };
};
const chip = (K, x, y, s, cls = 's-mute', tcls = 'b-label') => box(K, K.text(x, y, s, tcls), cls);
/* a chip whose right edge sits at `right` */
const chipR = (K, right, y, s, cls = 's-mute', tcls = 'b-label') => { const t = K.text(0, y, s, tcls); t.setAttribute('x', right - 10 - t.getBBox().width / 2); return box(K, t, cls); };
/* a sentence laid out right to left; numbers are blanks of that width; returns each word's box */
function sent(K, y, words, { right = 348, left = 10, gap = 14, lh = 42, hi = {}, cls = 'b-label' } = {}) {
  let x = right, yy = y; const out = [];
  words.forEach((w, i) => {
    if (typeof w === 'number') {
      if (x - w < left) { x = right; yy += lh; }
      K.rect(x - w, yy - 15, w, 30, hi[i] || 'b-slot', 8);
      out.push({ l: x - w, r: x, t: yy - 15, b: yy + 15, cx: x - w / 2, y: yy }); x -= w + gap; return;
    }
    const t = K.text(0, yy, w, cls); const wd = t.getBBox().width;
    if (x - wd < left) { x = right; yy += lh; t.setAttribute('y', yy); }
    t.setAttribute('x', x - wd / 2);
    const g = hi[i] ? box(K, t, hi[i], 5, 4, 8) : (() => { const bb = t.getBBox(); return { l: bb.x, r: bb.x + bb.width, t: bb.y, b: bb.y + bb.height, cx: bb.x + bb.width / 2, y: yy }; })();
    out.push(g); x -= wd + gap;
  });
  return out;
}
/* redraw a word of a sentence on top, highlighted */
const mark = (K, g, s, cls, tcls = 'b-label') => { K.rect(g.l - 5, g.t - 4, g.r - g.l + 10, g.b - g.t + 8, cls, 8); K.text(g.cx, g.y, s, tcls); };
const fill = (K, g, s, cls = 'b-okbox') => { K.rect(g.l, g.t, g.r - g.l, g.b - g.t, cls, 8); K.text(g.cx, g.y, s, 'b-label'); };
const ok = (K, x, y) => K.text(x, y, '✓', 'b-okt');
const no = (K, x, y) => K.text(x, y, '✗', 'b-badt');
/* a row: word → word with a small linking phrase over the arrow */
function rel(K, y, a, b, verb, { cls = 's-mute', cls2 = 's-fill', ax = 290, bx = 70, arrow = 's-line2', flip = false } = {}) {
  const A = chip(K, ax, y, a, cls), B = chip(K, bx, y, b, cls2);
  if (flip) K.arrow(B.r + 6, y, A.l - 6, y, 0, arrow); else K.arrow(A.l - 6, y, B.r + 6, y, 0, arrow);
  if (verb) K.note((A.l + B.r) / 2, y - 16, verb);
  return { A, B };
}
/* a page of text: grey lines, right aligned */
const LW = [.92, .8, .96, .72, .88, .66, .94, .58];
function page(K, x, y, w, n, lh = 18) {
  K.rect(x, y, w, n * lh + 22, 's-paper', 10);
  return Array.from({ length: n }, (_, i) => { const lw = (w - 28) * LW[i % LW.length], L = { x: x + w - 14 - lw, y: y + 14 + i * lh, w: lw }; K.rect(L.x, L.y, L.w, 7, 'b-tl', 3); return L; });
}
const hiLine = (K, L, cls = 'b-hl', from = 0, len = 1) => K.rect(L.x + L.w * (1 - from - len), L.y - 4, L.w * len, 15, cls, 4);
/* two halves of a sentence side by side (right half first) */
function halves(K, rTop, rMain, lTop, lMain) {
  K.rect(196, 24, 150, 64, 's-mute', 14); K.rect(14, 24, 150, 64, 's-mute', 14);
  if (rTop) K.note(271, 42, rTop); if (lTop) K.note(89, 42, lTop);
  K.label(271, 66, rMain); K.label(89, 66, lMain);
  return { R: { l: 196, r: 346, t: 24, b: 88, cx: 271 }, L: { l: 14, r: 164, t: 24, b: 88, cx: 89 } };
}

/* ================= step kit: write a hands-on lesson as a list of small beats =================
   ACT.lesson(id, [ {h, beats:[...]}, ... ], extra) turns each item into one "الخطوة n من N".
   A beat does ONE thing, then the next beat starts by itself:
     { say }                         a short line (what to do / what to notice)
     { draw(K, st, c) }              draw on a fresh layer (st = shared state of the step)
     { ask: {choices, answer, wrong} }   pick one; wrong = 'text' | {value: 'text', '*': 'text'} | fn(v)
     { tap: {targets(st), need, wrongIdx, over, progress, mark} }   deliberate taps, one at a time
     { button: 'نصّ الزر' }           one press (e.g. «قسّم»)
   and after it succeeds: { ok(K, st, c), board: [...rows], msg: 'the name / the idea' }
   The last beat unlocks «التالي». No beat ever moves on by itself while something is asked. */
const ACT = {};
ACT.FR = (a, b) => `<span class="fr frc"><span>${a}</span><span>${b}</span></span>`;
ACT.FRI = (a, b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
ACT.NUM = '<b class="cn">البسط</b>'; ACT.DEN = '<b class="cd">المقام</b>';
ACT.val = (f, st) => typeof f === 'function' ? f(st) : f;
ACT.beats = list => c => {
  const st = {}; let i = -1;
  const go = () => { i++; if (i >= list.length) return c.done(); run(list[i]); };
  function run(b) {
    window.__beat = { b, st }; // read by the automatic tests only
    if (b.say) c.say(ACT.val(b.say, st));
    if (b.msg0 !== undefined) c.msg(ACT.val(b.msg0, st));
    if (b.draw) b.draw(c.layer(), st, c);
    const last = i === list.length - 1;
    const finish = () => {
      if (b.ok) b.ok(c.layer(), st, c);
      if (b.board) c.board(ACT.val(b.board, st));
      c.msg(b.msg ? ACT.val(b.msg, st) : '', b.msg ? 'ok' : '');
      if (last) c.done(); else c.later(go, b.pause != null ? b.pause : (b.msg || b.board ? 1100 : 450));
    };
    if (b.ask) {
      const A = b.ask;
      c.choices(ACT.val(A.choices, st), (v, btn) => {
        if (String(v) === String(ACT.val(A.answer, st))) { c.ok(); c.clearChoices(); return finish(); }
        c.no(); btn.disabled = true; btn.classList.add('nope');
        let w = A.wrong; if (typeof w === 'function') w = w(v, st); else if (w && typeof w === 'object') w = w[v] != null ? w[v] : w['*'];
        if (w) c.msg(w, 'bad');
        if (A.onWrong) A.onWrong(v, c.layer(), st, c);
      });
      return;
    }
    if (b.tap) {
      const T = b.tap, els = T.targets(st), on = new Set(), bad = new Set(T.wrongIdx || []); let locked = false;
      const mark = T.mark || ((el, v) => el.classList.toggle('on', v));
      els.forEach((el, k) => c.tap(el, () => {
        if (locked) return;
        if (bad.has(k)) { c.no(); el.classList.add('nope'); c.msg(ACT.val(T.wrongMsg, st) || 'ليس هذا.', 'bad'); return; }
        c.tick();
        if (T.once) { if (on.has(k)) return; on.add(k); mark(el, true, k, st); }
        else { on.has(k) ? on.delete(k) : on.add(k); mark(el, on.has(k), k, st); }
        st.picked = [...on]; const n = on.size;
        if (n > T.need) return c.msg(T.over || 'أكثر من المطلوب. اضغط على أحد المختار لإلغائه.', 'bad');
        if (n === T.need) { locked = true; c.msg(''); return c.later(finish, 380); }
        c.msg(T.progress ? T.progress(n) : '');
      }));
      return;
    }
    if (b.button) { c.choices([b.button], () => { c.tick(); c.clearChoices(); finish(); }); return; }
    finish();
  }
  go();
};
ACT.lesson = (id, acts, extra) => {
  const N = acts.length;
  if (!PLUS[id]) PLUS[id] = {};
  Object.assign(PLUS[id], { flow: acts.map((a, i) => ({ kicker: `الخطوة ${ar(i + 1)} من ${ar(N)}`, h: a.h != null ? a.h : 230, run: a.run || ACT.beats(a.beats) })) }, extra || {});
};

/* ---------- drawing pieces ---------- */
const ACT_EQ = n => Array.from({ length: n }, (_, i) => [90 - (i + 1) * 360 / n, 90 - i * 360 / n]);
ACT.pizza = (K, cx, cy, r, n, on = []) => { K.circle(cx, cy, r + 7, 'pz-crust'); return ACT_EQ(n).map((sp, i) => K.path(arcPath(cx, cy, r, sp[0], sp[1]), on.includes(i) ? 'pz on' : 'pz')); };
ACT.pizzaNums = (K, cx, cy, r, n) => ACT_EQ(n).forEach((sp, i) => { const [x, y] = polar(cx, cy, r * 0.6, (sp[0] + sp[1]) / 2); K.label(x, y, String(i + 1)); });
/* a strip cut in n equal parts; parts are filled from the right (reading direction) */
ACT.strip = (K, x, y, w, hh, n, on = [], cls = 'st') => { const pw = w / n; const els = Array.from({ length: n }, (_, i) => K.rect(x + w - (i + 1) * pw, y, pw, hh, cls + (on.includes(i) ? ' on' : ''), 0)); K.rect(x, y, w, hh, 'st-edge', 6); return els; };
ACT.range = (a, b) => Array.from({ length: b - a }, (_, i) => a + i);
/* a coloured fraction drawn in the picture: top = taken (orange), bottom = the whole (brown) */
ACT.frac = (K, x, y, n, d, { size = 'act-fnum', pop = false, tagN, tagD } = {}) => {
  K.line(x - 22, y, x + 22, y, 'act-fline');
  if (n != null) K.text(x, y - 24, String(n), `${size} n${pop ? ' act-pop' : ''}`);
  if (d != null) K.text(x, y + 26, String(d), `${size} d${pop ? ' act-pop' : ''}`);
  if (tagN) K.text(x, y - 54, tagN, 's-txt-s act-tag n'); if (tagD) K.text(x, y + 56, tagD, 's-txt-s act-tag d');
};
/* a small tappable card holding a fraction (for "tap every …" beats) */
ACT.cards = (K, items, y = 60, w = 60, hh = 92) => {
  const gap = (360 - items.length * w) / (items.length + 1);
  return items.map(([n, d], k) => { const x = 360 - (k + 1) * (gap + w); const r = K.rect(x, y, w, hh, 'act-card', 14); ACT.frac(K, x + w / 2, y + hh / 2, n, d, { size: 'act-fsm' }); const hit = K.rect(x, y, w, hh, 'act-hit', 14); hit._card = r; return hit; });
};
ACT.cardMark = (el, v) => el._card.classList.toggle('on', v);
/* dots / items in a grid (cookies, dates, people…) */
ACT.dots = (K, x, y, n, cols, gap, r, cls = 'act-dot') => Array.from({ length: n }, (_, i) => K.circle(x - (i % cols) * gap, y + Math.floor(i / cols) * gap, r, cls));
/* a 10 × 10 grid (hundredths / percent) with the first k squares filled */
ACT.grid100 = (K, x, y, s, k) => { for (let i = 0; i < 100; i++) K.rect(x + (9 - i % 10) * s, y + Math.floor(i / 10) * s, s - 1.5, s - 1.5, i < k ? 'st on' : 'st', 2); };
/* word cards (right to left, wrapped in rows); returns tappable hits (mark with ACT.cardMark) */
ACT.words = (K, items, { y = 16, w = 80, h = 44, cols = 4, gy = 12, size = 'act-word' } = {}) => items.map((t, k) => {
  const row = Math.floor(k / cols), inRow = Math.min(cols, items.length - row * cols), col = k % cols, gap = (360 - inRow * w) / (inRow + 1);
  const x = 360 - (col + 1) * (gap + w), yy = y + row * (h + gy); const r = K.rect(x, yy, w, h, 'act-card', 10); K.text(x + w / 2, yy + h / 2 + 1, t, size); const hit = K.rect(x, yy, w, h, 'act-hit', 10); hit._card = r; return hit; });
/* a big analogy pair «أ : ب» */
ACT.pair = (K, a, b, y = 20, cls = 'act-fsm') => { K.rect(70, y, 220, 60, 'act-card on', 14); K.text(180, y + 32, `${a} : ${b}`, cls); };

/* ================= diagnostic questions: only used by the placement test and the lesson checks =================
   D(lesson, [[question, [right, wrong1, wrong2, wrong3], why, [what wrong1 means, what wrong2 means, ...]], ...])
   The "what it means" text names the exact slip, so the report can say *why* the student missed. */
const DIAG = {};
function D(id, list) {
  DIAG[id] = list.map(x => {
    const o = Array.isArray(x) ? { q: x[0], choices: x[1].map(String), answer: 0, why: x[2], m: x[3] || [] } : Object.assign({ answer: 0, m: [] }, x);
    o.miss = {}; let k = 0;
    o.choices.forEach((c, i) => { if (i !== o.answer) { if (o.m[k]) o.miss[c] = o.m[k]; k++; } });

}

/* ================= smart placement test + personal plan =================
   Every lesson is a skill (SKILLS, with its prerequisites) and has its own test questions (DIAG).
   The test keeps, for every skill, how sure we are that the student knows it, and always asks
   the question that teaches us the most. It stops when it is sure about every skill (or after 35).
   Result per lesson:  green = knows it (skip)  ·  yellow = knows it but slow/unsure (practice)
                       red = needs the lesson   ·  check = not sure yet (two questions before the lesson)
   The numbers below were tuned on simulated students before building (see the plan notes). */
const DG_BUDGET = 35, DG_LO = 0.12, DG_HI = 0.88, DG_GREEN = 0.75, DG_RED = 0.2, DG_SPREAD = 0.35;
const DG_LIK = { ok: [0.88, 0.22], wrong: [0.12, 0.62], dk: [0.03, 0.55], timeout: [0.35, 0.40] };
const DG_ANC_OK = 0.45, DG_DESC_BAD = 0.4;
const DG_MIN = { red: 20, check: 3, yellow: 6 }; // rough minutes per plan step

let DGG = null;
function dgGraph() {
  if (DGG) return DGG;
  const ids = Object.keys(SKILLS), kids = {}, unit = {};
  ids.forEach(i => kids[i] = []);
  ids.forEach(i => (SKILLS[i].pre || []).forEach(p => kids[p] && kids[p].push(i)));
  for (const d of DISTRICTS) for (const l of d.lessons || []) unit[l.id] = d.id;
  const clos = (s, rel) => { const out = new Set(), st = [...rel(s)]; while (st.length) { const x = st.pop(); if (!out.has(x)) { out.add(x); st.push(...rel(x)); } } return out; };
  const anc = {}, desc = {};
  ids.forEach(i => { anc[i] = clos(i, x => SKILLS[x].pre || []); desc[i] = clos(i, x => kids[x]); });
  const skills = ids.filter(i => !SKILLS[i].mixed && DIAG[i] && DIAG[i].length);
  return DGG = { anc, desc, unit, skills };
}
const dgLesson = id => { for (const d of DISTRICTS) for (const l of d.lessons || []) if (l.id === id) return { d, l }; return null; };
function dgLimit(id) {
  const s = SKILLS[id] || {}; if (s.t) return s.t;
  if (typeof SKILL_T === 'number') return SKILL_T;
  return (SKILL_T && SKILL_T[id.replace(/\d+$/, '')]) || 60;
}
const dgFast = (t, id) => t < 0.7 * dgLimit(id);
const dgH = p => p <= 0 || p >= 1 ? 0 : -(p * Math.log2(p) + (1 - p) * Math.log2(1 - p));
const dgLg = p => Math.log(p / (1 - p)), dgSg = x => 1 / (1 + Math.exp(-x));

/* ---------- the model ---------- */
function dgNewRun() { return { L: {}, ua: {}, gl: [2, 2], asked: {}, speed: {}, used: {}, n: 0, secs: 0, misses: {}, log: [], t0: Date.now() }; }
function dgP(R, id) {
  const G = dgGraph(), u = G.unit[id], [a, b] = R.ua[u] || [1, 1], [ga, gb] = R.gl;
  const pg = ga / (ga + gb), m = a + b - 2;
  const pu = Math.min(0.95, Math.max(0.05, (a - 1 + 2 * pg) / (m + 2)));   // this unit so far, pulled toward the student overall
  return dgSg(dgLg(pu) + (R.L[id] || 0));
}
const dgAdd = (R, id, lk, lu) => { R.L[id] = (R.L[id] || 0) + Math.log(lk / lu); };
function dgPick(R) {
  const G = dgGraph(), P = {};
  G.skills.forEach(s => P[s] = dgP(R, s));
  const open = G.skills.filter(s => P[s] > DG_LO && P[s] < DG_HI && (R.asked[s] || 0) < 2 && (DIAG[s].length > (R.used[s] || []).length));
  if (!open.length) return null;
  let best = null, bs = -1;
  for (const s of open) {
    let sc = dgH(P[s]);
    for (const x of G.anc[s]) if (P[x] != null) sc += DG_SPREAD * dgH(P[x]);
    for (const x of G.desc[s]) if (P[x] != null) sc += DG_SPREAD * dgH(P[x]);
    sc += Math.random() * 0.05;   // two students never get the exact same test
    if (sc > bs) { bs = sc; best = s; }
  }
  return best;
}
function dgQuestion(id, used) {
  const all = DIAG[id].map((_, i) => i).filter(i => !(used || []).includes(i));
  const pool = all.length ? all : DIAG[id].map((_, i) => i);
  return pool[Math.floor(Math.random() * pool.length)];
}
function dgRecord(R, id, qi, res, secs, chosen) {
  const G = dgGraph(), u = G.unit[id];
  R.n++; R.secs += secs; R.asked[id] = (R.asked[id] || 0) + 1; (R.used[id] = R.used[id] || []).push(qi);
  R.log.push([id, qi, res, Math.round(secs), chosen]);
  const [lk, lu] = DG_LIK[res]; dgAdd(R, id, lk, lu);
  const ua = R.ua[u] || (R.ua[u] = [1, 1]);
  if (res === 'ok') {
    for (const a of G.anc[id]) dgAdd(R, a, 0.88, DG_ANC_OK);
    ua[0]++; R.gl[0]++;
    (R.speed[id] = R.speed[id] || []).push(dgFast(secs, id) ? 1 : 0);
  } else if (res === 'wrong' || res === 'dk') {
    for (const d of G.desc[id]) dgAdd(R, d, DG_DESC_BAD, 0.75);
    ua[1]++; R.gl[1]++;
    if (res === 'wrong' && chosen != null) { const q = DIAG[id][qi], why = q.miss && q.miss[chosen]; if (why) (R.misses[id] = R.misses[id] || []).push(why); }
  } else (R.speed[id] = R.speed[id] || []).push(0);
  /* the predicted score keeps learning from the test too */
  if (u && WEIGHT[u] != null && res !== 'timeout') { const a = S.skill[u] || (S.skill[u] = []); a.push(res === 'ok' ? 1 : 0); if (a.length > 24) a.shift(); }
}
function dgLabels(R) {
  const G = dgGraph(), status = {}, guessed = {};
  for (const s of G.skills) {
    const p = dgP(R, s), sp = R.speed[s];
    if (p >= DG_GREEN) { status[s] = sp && sp.some(v => !v) ? 'yellow' : 'green'; if (!R.asked[s]) guessed[s] = 1; }
    else if (p <= DG_RED) status[s] = 'red';
    else status[s] = 'check';
  }
  /* practice-only lessons follow their unit */
  for (const d of DISTRICTS) for (const l of d.lessons || []) if (SKILLS[l.id] && SKILLS[l.id].mixed) {
    const mates = d.lessons.filter(x => status[x.id]).map(x => status[x.id]);
    status[l.id] = mates.every(x => x === 'green') ? 'green' : 'yellow';
  }
  return { status, guessed };
}
function dgFinish(R) {
  const { status, guessed } = dgLabels(R);
  const prev = S.diag || {};
  S.diag = { v: 1, at: Date.now(), status, guessed, misses: R.misses, used: R.used, n: R.n, secs: Math.round(R.secs), first: prev.first || Object.assign({}, status), history: (prev.history || []).concat([{ at: Date.now(), n: R.n, counts: dgCounts(status) }]).slice(-6), run: null, slips: {} };
  S.placement = { date: Date.now(), pct: Math.round(100 * R.log.filter(x => x[2] === 'ok').length / Math.max(1, R.n)) };
  persist();
}
function dgCounts(status) { const c = { green: 0, yellow: 0, red: 0, check: 0 }; for (const v of Object.values(status || {})) if (c[v] != null) c[v]++; return c; }

/* ---------- state helpers used by the rest of the app ---------- */
const dgOn = () => !!(S.diag && S.diag.status);
const dgState = id => dgOn() ? (S.diag.status[id] || null) : null;
const cleared = l => !!S.done[l.id] || dgState(l.id) === 'green';
function dgSet(id, st) { if (!dgOn()) return; S.diag.status[id] = st; if (st !== 'green' && S.diag.guessed) delete S.diag.guessed[id]; persist(); }
/* the plan: every lesson the student still needs, best order first (prerequisites first, then the most exam points per minute) */
function dgPlan() {
  if (!dgOn()) return [];
  const G = dgGraph(), need = [];
  for (const d of units()) for (const l of d.lessons) { const st = S.diag.status[l.id]; if (st && st !== 'green' && !S.done[l.id]) need.push({ d, l, st }); }
  const ids = new Set(need.map(x => x.l.id)), placed = new Set(), out = [];
  const gap = { red: 1, check: 0.6, yellow: 0.45 };
  const prio = x => (WEIGHT[x.d.id] || 5) * gap[x.st] / DG_MIN[x.st];
  const ready = x => {
    const pre = SKILLS[x.l.id] && SKILLS[x.l.id].mixed ? x.d.lessons.map(m => m.id).filter(m => m !== x.l.id) : [...(G.anc[x.l.id] || [])];
    return pre.every(a => !ids.has(a) || placed.has(a));
  };
  let rest = need;
  while (rest.length) {
    const cand = rest.filter(ready), pool = cand.length ? cand : rest;
    const pick = pool.reduce((a, b) => (prio(b) > prio(a) ? b : a));
    out.push(pick); placed.add(pick.l.id); rest = rest.filter(x => x !== pick);
  }
  return out;
}
const dgGuessed = () => dgOn() ? Object.keys(S.diag.guessed || {}).filter(id => S.diag.status[id] === 'green') : [];
/* next lesson for the home screens: the plan first, otherwise the first lesson not cleared */
function nextLesson() {
  const p = dgPlan()[0]; if (p) return { d: p.d, l: p.l, i: p.d.lessons.indexOf(p.l), st: p.st };
  for (const d of openUnits()) { const i = d.lessons.findIndex(l => !cleared(l)); if (i >= 0) return { d, l: d.lessons[i], i }; }
  return null;
}
/* a wrong answer in a lesson we called "known" twice → we are no longer sure: check it */
function dgSlip(s, ok) {
  if (!dgOn() || !s.qid) return;
  const id = String(s.qid).split(':')[0]; if (dgState(id) !== 'green' || S.done[id]) return;
  const sl = S.diag.slips || (S.diag.slips = {});
  if (ok) { if (sl[id]) sl[id] = Math.max(0, sl[id] - 1); return; }
  sl[id] = (sl[id] || 0) + 1;
  if (sl[id] >= 2) { S.diag.status[id] = 'check'; sl[id] = 0; }
}

/* ---------- screens ---------- */
function dgScreen(title, onExit) {
  screen();
  const wrap = h('div', 'player dg');
  const top = h('div', 'ptop gut');
  const x = h('button', 'xbtn', ic('close', 22)); x.setAttribute('aria-label', 'خروج'); x.onclick = () => { FX.play('tap'); onExit(); };
  const pbar = h('div', 'pbar', '<i style="width:0%"></i>');
  top.append(x, pbar);
  const strip = h('div', 'phases gut', `<span class="ph on">${title}</span>`);
  const body = h('div', 'pbody gut'), dock = h('div', 'dock'), dockIn = h('div', 'dock-in gut');
  dock.appendChild(dockIn); wrap.append(top, strip, body); app.append(wrap, dock);
  return { body, dock, dockIn, strip, bar: v => { pbar.firstChild.style.width = Math.round(100 * v) + '%'; } };
}
/* one question with its own clock. done(result, seconds, chosenText) with result ok / wrong / dk / timeout */
function dgAsk(V, q, limit, done, opt = {}) {
  V.body.innerHTML = ''; window.scrollTo(0, 0);
  window.__dg = { q, id: opt.id }; // read by the automatic tests only

/* open a plan step */
function dgOpen(x) {
  if (x.st === 'check') return dgGate(x.d, x.l);
  if (x.st === 'yellow') return dgPractice(x.d, x.l);
  playLesson(x.d, x.l, true);
}
/* two of three: one slip never decides alone. onEnd(label) with green / yellow / red */
function dgTwoOfThree(V, id, onEnd, title) {
  const res = [];
  const used = (S.diag.used[id] = S.diag.used[id] || []);
  const step = () => {
    const oks = res.filter(r => r[0] === 'ok').length, bad = res.length - oks;
    V.bar(res.length / 3);
    if (oks >= 2 || bad >= 2 || res.length >= 3) {
      let lab = 'red';
      if (oks >= 2) lab = res.filter(r => r[0] === 'ok').every(r => dgFast(r[1], id)) ? 'green' : 'yellow';
      else if (res.some(r => r[0] === 'timeout') && res.filter(r => r[0] === 'wrong' || r[0] === 'dk').length < 2) lab = 'yellow';
      persist(); return onEnd(lab);
    }
    const qi = dgQuestion(id, used), q = DIAG[id][qi]; used.push(qi);
    dgAsk(V, q, dgLimit(id), (r, t) => { res.push([r, t]); step(); }, { kick: title, id });
  };
  step();
}
/* "check" lessons: two questions before the lesson */

/* "yellow" lessons: five timed questions from the lesson itself */
function dgPractice(d, l) {
  const own = shuffle(l.steps.filter(s => s.q && !s.check && Array.isArray(s.choices))).slice(0, 5);
  const qs = own.length >= 4 ? own : own.concat((DIAG[l.id] || []).slice(0, 5 - own.length));
  const V = dgScreen('تمرين بالوقت: ' + l.title, () => showDistrict(d));
  let i = 0, ok = 0, fast = 0;
  const step = () => {
    V.bar(i / qs.length);
    if (i >= qs.length) {
      const lab = ok >= qs.length - 1 && fast >= qs.length - 1 ? 'green' : ok >= qs.length - 2 ? 'yellow' : 'red';
      dgSet(l.id, lab);
      if (lab === 'red') return dgDone(d, 'تحتاج الدرس', `أصبت ${ar(ok)} من ${ar(qs.length)}. أضفنا الدرس كاملًا إلى خطتك.`, { d, l });
      return dgDone(d, lab === 'green' ? 'أتقنته' : 'قريب', lab === 'green' ? `أصبت ${ar(ok)} من ${ar(qs.length)} في الوقت. الدرس متقن.` : `أصبت ${ar(ok)} من ${ar(qs.length)}. أعد التمرين لاحقًا لتصل إلى السرعة المطلوبة.`);
    }
    dgAsk(V, qs[i], dgLimit(l.id), (r, t) => { if (r === 'ok') { ok++; if (dgFast(t, l.id)) fast++; } i++; step(); }, { kick: `${ar(i + 1)} من ${ar(qs.length)}`, last: i === qs.length - 1, id: l.id });
  };
  step();
}
/* lessons we only guessed as known: one quick question each (a miss gets a second chance) */

  function form() {

      else { doc.choices = [0, 1, 2, 3].map(i => $('qf-c' + i).value.trim()); const r = f.querySelector('input[name=qf-ans]:checked'); if (doc.choices.some(c => !c)) return toast('اكتب الخيارات الأربعة'); if (!r) return toast('اختر الإجابة الصحيحة'); doc.answer = +r.value; }

  /* ---------- live data ---------- */
  async function connect() {
    if (Array.isArray(CFG.bank) && CFG.bank.length) { bankDocs = CFG.bank; pushBank(); } // the public site ships its approved questions inside the page
    if (!window.claude || !window.claude.use) return;
    try {
      const user = await window.claude.use('user');
      canEdit = !!(user && await user.canEdit());
      db = await window.claude.use('db');
      if (!db) return;
      const toDocs = snap => snap.docs.map(x => Object.assign({ id: x.id }, x.data()));
      db.collection('bank').onSnapshot(snap => { bankDocs = toDocs(snap); pushBank(); refresh(); }, () => {});
      if (canEdit) db.collection('drafts').orderBy('created', 'desc').onSnapshot(snap => { draftDocs = toDocs(snap); refresh(); }, () => {});
      refresh();
    } catch (e) { /* the academy works fully without the shared bank */ }
  }
  function refresh() {
    if (app.classList.contains('academy') && document.querySelector('.bank')) { if (!document.querySelector('.qform')) showBank(); }
    else if (app.classList.contains('academy') && document.querySelector('.home')) home();
    else if (location.hash === '#bank' && canEdit && !document.querySelector('.bank')) showBank();
  }

    /* used by the test suite only: feed bank rows without a database */
    __dev: { feed(bank, drafts, edit) { bankDocs = bank || []; draftDocs = drafts || []; canEdit = !!edit; db = db || null; pushBank(); refresh(); }, showBank: () => showBank() } };
  if (!SECTIONS.length) { app.innerHTML = '<p class="gut">لا توجد أقسام.</p>'; return; }
  home();
  connect();
})();

/* ================= subscriber accounts (public site only) =================
   The admin creates a username + password and picks each course's end date (admin.html).
   A logged-in student whose access is active can read that course's key; the full course is
   published encrypted (<course id>.enc) and is opened here with the key, replacing the free one. */
(function () {
  const CFG = (window.ACADEMY_CONFIG || {}).auth;
  if (!CFG || !window.supabase || !window.Academy) return; // no accounts: the free site still works
  const sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'leena-auth' } });
  const C = window.AcademyCourses || {};
  const ar = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
  const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const toast = msg => { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = el('div', 'toast', esc(msg)); document.body.appendChild(t); setTimeout(() => t.remove(), 3000); };
  const fmtDate = d => { const [y, m, dd] = String(d).split('-'); return ar(`${+dd}/${+m}/${y}`); };
  const today = () => new Date().toISOString().slice(0, 10);
  const A = window.LeenaAuth = { user: null, access: [], ready: false, openLogin, showAccount, logout, has: id => A.access.some(a => a.course === id && a.expires >= today()) };

  /* ---------- open a course with its key ---------- */
  const b64 = s => Uint8Array.from(atob(s.trim()), c => c.charCodeAt(0));
  async function unlock(id, key) {
    if (C[id] && C[id].COURSE && C[id].COURSE.tier === 'full') return true;
    const res = await fetch(id + '.enc?v=' + CFG.v, { cache: 'no-store' }); if (!res.ok) throw new Error('enc ' + res.status);
    const raw = b64(await res.text()), k = await crypto.subtle.importKey('raw', b64(key), 'AES-GCM', false, ['decrypt']);
    const js = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, k, raw.slice(12)));
    await new Promise((ok, bad) => { const s = document.createElement('script'); s.src = URL.createObjectURL(new Blob([js], { type: 'text/javascript' })); s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
    if (C[id] && C[id].init) C[id].init();
    return true;
  }
  async function load() {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) { A.user = null; A.access = []; return false; }
    const [st, acc, keys] = await Promise.all([
      sb.from('students').select('username,name').eq('user_id', user.id).maybeSingle(),
      sb.from('access').select('course,expires').eq('user_id', user.id),
      sb.from('course_keys').select('course,key'),
    ]);
    A.user = { id: user.id, username: (st.data && st.data.username) || user.email.split('@')[0], name: (st.data && st.data.name) || '' };
    A.access = acc.data || [];
    let opened = 0;
    for (const k of keys.data || []) { if (!C[k.course]) continue; try { await unlock(k.course, k.key); opened++; } catch (e) { console.warn('unlock failed', k.course, e); } }
    return opened;
  }
  async function start() {
    try { const n = await load(); A.ready = true; if (n || A.user) window.Academy.home(); } catch (e) { A.ready = true; console.warn('auth', e); }
  }

  /* ---------- screens ---------- */
  function modal(inner) {
    document.querySelectorAll('.modal.acct').forEach(m => m.remove());
    const m = el('div', 'modal acct'), box = el('div', 'modal-box acct-box'); box.innerHTML = inner;
    const x = el('button', 'xbtn acct-x', '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'); x.setAttribute('aria-label', 'إغلاق'); x.onclick = () => m.remove();
    box.prepend(x); m.appendChild(box); m.onclick = e => { if (e.target === m) m.remove(); };
    document.body.appendChild(m); return { m, box };
  }
  function openLogin() {
    const { m, box } = modal(`<h2>تسجيل الدخول</h2><p class="acct-sub">اكتب اسم المستخدم وكلمة المرور اللذين وصلاك.</p>
      <form class="acct-form"><label>اسم المستخدم<input id="lg-user" autocomplete="username" autocapitalize="none" spellcheck="false" dir="ltr" required></label>
      <label>كلمة المرور<input id="lg-pass" type="password" autocomplete="current-password" dir="ltr" required></label>
      <p class="acct-err" hidden></p><button class="play-btn acct-go" type="submit"><span>دخول</span></button></form>`);
    const f = box.querySelector('form'), err = box.querySelector('.acct-err'), go = box.querySelector('.acct-go');
    setTimeout(() => box.querySelector('#lg-user').focus(), 50);
    f.onsubmit = async e => {
      e.preventDefault(); err.hidden = true; go.disabled = true; go.querySelector('span').textContent = 'جارٍ الدخول…';
      const u = box.querySelector('#lg-user').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, ''), p = box.querySelector('#lg-pass').value;
      const { error } = await sb.auth.signInWithPassword({ email: u + '@leena.academy', password: p });
      if (error) { err.textContent = /invalid/i.test(error.message) ? 'اسم المستخدم أو كلمة المرور غير صحيحة.' : 'تعذّر الدخول الآن. تأكد من الإنترنت وحاول مرة ثانية.'; err.hidden = false; go.disabled = false; go.querySelector('span').textContent = 'دخول'; return; }
      go.querySelector('span').textContent = 'نفتح دوراتك…';
      try { await load(); } catch (e2) { console.warn(e2); }
      m.remove(); toast(A.access.some(a => a.expires >= today()) ? `أهلًا ${A.user.name || A.user.username}، دوراتك مفتوحة` : 'دخلت، لكن لا توجد دورة فعّالة في حسابك');
      window.Academy.home();
    };
  }
  function showAccount() {
    if (!A.user) return openLogin();
    const names = { 'qudurat-quant': 'القدرات: الكمّي', 'qudurat-verbal': 'القدرات: اللفظي' };
    const rows = A.access.length ? A.access.map(a => { const on = a.expires >= today(); return `<li class="${on ? 'on' : 'off'}"><b>${esc(names[a.course] || a.course)}</b><small>${on ? 'مفتوحة حتى ' : 'انتهت في '}${fmtDate(a.expires)}</small></li>`; }).join('') : '<li class="off"><b>لا توجد دورات في حسابك</b></li>';
    const { m, box } = modal(`<h2>حسابي</h2><p class="acct-sub">${esc(A.user.name || '')} · <bdi dir="ltr">${esc(A.user.username)}</bdi></p><ul class="acct-list">${rows}</ul><button class="ghost-btn acct-out"><span>تسجيل الخروج</span></button>`);
    box.querySelector('.acct-out').onclick = () => { m.remove(); logout(); };
  }
  async function logout() { await sb.auth.signOut(); location.reload(); }

  /* the account chip on the academy home */
  window.Academy.accountChip = () => {
    const b = el('button', 'acct-chip' + (A.user ? ' in' : ''), A.user ? `<span class="dot"></span><span>${esc(A.user.name || A.user.username)}</span>` : '<span>دخول المشتركين</span>');
    b.onclick = () => A.user ? showAccount() : openLogin(); return b;
  };
  if (document.querySelector('#app .home')) window.Academy.home(); // the home was drawn before this file ran: draw it again with the chip
  start();
})();

</script>
</body>
</html>
