  .lt .tun-land>.la-sec[data-sec=try]{grid-column:2;grid-row:1;min-height:100svh;padding:24px 0;display:flex;flex-direction:column;justify-content:center}
  .la-sec[data-sec=try] .la-h2{font-size:40px}
  .lt .tun-land>.la-sec:not([data-sec=try]){display:grid;grid-template-columns:minmax(0,1fr) clamp(440px,34vw,560px);column-gap:clamp(60px,7vw,110px);align-items:start;padding:150px 0 0}
  .la-sec:not([data-sec=try])>.la-h2{grid-column:1;grid-row:1 / span 6;font-size:clamp(46px,4.3vw,62px);line-height:1.36}
  .la-sec:not([data-sec=try])>:not(.la-h2){grid-column:2}
  .la-sec:not([data-sec=try])>.la-h2+*{margin-top:14px}
  .la-p{font-size:21px;line-height:2}
  .la-note{font-size:16.5px}
  .la-incl{margin-top:8px}
  .la-incl li{font-size:26px}
  .la-faq{margin-top:10px}
  .la-fq summary{min-height:72px;font-size:20px}
  .la-fq p{font-size:18.5px}
  .la-talk{margin-top:18px}
  .la-foot{padding-top:90px}
  /* the button: a quiet bar along the foot of the screen, what it offers on the right and the button on the left. Solid, so it never sits on top of words */
  .la-dock{padding:14px max(64px,calc(50vw - min(740px,46vw) + 64px));background:#F6F4EE;border-top:1px solid #E4E0D6;display:flex;flex-direction:row-reverse;align-items:center;justify-content:space-between;gap:28px}
  .la-dock>*{max-width:none;margin:0}
  .lt .la-dock a.ld-go{width:340px;max-width:none;height:58px;margin:0;font-size:19px}
  .la-micro{margin:0;min-height:0;font-size:18px;color:#3D4A44}
  body.ld-on .legal{padding-bottom:120px}
  /* a subscriber on a computer finds his way in at the top, not at the very end of the page */
  .lt .tun-land .la-acc-top{display:block;position:absolute;top:22px;left:64px;z-index:2;min-height:44px;padding:0 6px;background:none;border:0;cursor:pointer;font:300 16px/1 Alexandria,var(--f-display);color:#3D4A44;text-decoration:underline;text-underline-offset:5px;text-decoration-color:#C9C4B6;animation:none}
  /* ---- the small rooms (a lesson's door, the account with no subscription): the words large on the right, what to press on the left ---- */
  .lt .tun-door:not(.tun-list){max-width:1100px;padding:90px 64px 70px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);column-gap:clamp(60px,7vw,110px);align-items:center;align-content:center}
  .lt .tun-door:not(.tun-list)>*{grid-column:1 / -1}
  .lt .tun-door:not(.tun-list)>.tun-txt{grid-column:1;margin:0}
  .lt .tun-door:not(.tun-list)>.tun-act{grid-column:2;margin:0;align-self:center}
  .lt .tun-door:not(.tun-list) .tun-h,.lt .tun-door:not(.tun-list) .tun-h.big{font-size:clamp(64px,6vw,92px);line-height:1.3}
  .lt .tun-door:not(.tun-list) .tun-eyebrow,.lt .tun-door:not(.tun-list) .tun-time{font-size:22px}
  .lt .tun-door:not(.tun-list) .tun-p{font-size:23px}
  .lt .tun-door .tun-mark{font-size:20px}
  /* ---- the road: the course's name and the way in on the right, the lessons in two columns on the left ---- */
  .lt .tun-road{max-width:1160px;padding:110px 64px 80px;display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);column-gap:clamp(60px,7vw,110px);align-items:start;align-content:start;overflow:visible}
  .lt .tun-road>.tun-txt{grid-column:1;grid-row:1;position:sticky;top:110px}
  .lt .tun-road .tun-h.big{font-size:88px;line-height:1.25}
  .lt .tun-road .tun-eyebrow{font-size:22px}
  .lt .tun-road>.tun-st{grid-column:2;grid-row:1 / span 3;max-width:none;margin:8px 0 0;display:grid;grid-template-rows:repeat(var(--rows,14),auto);grid-auto-flow:column;grid-template-columns:1fr 1fr;column-gap:56px}
  .lt .tun-road>.tun-st::after{content:"";position:absolute;right:calc(50% + 41px);top:20px;bottom:20px;width:1.5px;background:#E4E0D6}   /* the road's line goes on down the second column */
  .lt .tun-road>.tun-st.odd::after{bottom:74px}
  .lt .tun-road .tun-st li{min-height:54px;font-size:20px}
  .lt .tun-road .tun-st li.here{font-size:24px}
  .lt .tun-road .tun-st li[class~=done],.lt .tun-road .tun-st li[class~=here],.lt .tun-road .tun-st li[class~=open]{cursor:pointer}
  .lt .tun-road>.tun-go{grid-column:1;grid-row:2;position:sticky;top:330px;bottom:auto;left:auto;right:auto;width:100%;max-width:340px;margin:44px 0 0;height:64px;font-size:20px}
  .lt .tun-road>.tun-link.tun-top{top:26px;right:64px}
  .lt .tun-door:not(.tun-list)>.tun-back{top:26px;right:64px}
  .lt .tun-road>.tun-txt .tun-p{font-size:19px}
  .lt .tun-road::after{display:none}
}
}


/* ================= academy shell ================= */
.cover-btn.wide{width:min(52vw,200px)}
.cover-btn.soon{opacity:.55;filter:saturate(.4)}
.cover-btn .cv-body small{font-family:var(--f-body);font-weight:400;font-size:12.5px}
.acad-figs{display:grid;margin-top:22px}
.acad-figs button{text-align:start;padding:4px 14px;border-inline-start:1px solid var(--line)}
.acad-figs button:first-child{border-inline-start:0;padding-inline-start:0}
.note-line{color:var(--ink-2);font-size:13.5px;line-height:1.7;margin:14px 2px}
/* question bank */
.bank{padding-block:2px 60px;display:flex;flex-direction:column;gap:12px}
.seg{display:flex;gap:4px;background:var(--bg-2);border-radius:999px;padding:4px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;white-space:nowrap;padding:9px 12px;border-radius:999px;font-weight:500;font-size:14px;color:var(--ink-2)}
.seg button b{font-weight:600;margin-inline-start:4px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.qlist{display:flex;flex-direction:column}
.qrow{padding:16px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.qrow:first-child{border-top:0}
.qrow .qq{margin:0;font-family:var(--f-display);font-size:17px;line-height:1.7}
.qrow .qch{margin:0;padding-inline-start:20px;color:var(--ink-2);font-size:14.5px}
.qrow .qch li.ok{color:var(--ok);font-weight:600}
.qrow .qcmp,.qrow .qwhy{margin:0;color:var(--ink-2);font-size:14px}
.qact{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.qbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:500}
.qbtn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qbtn.danger{color:var(--bad)}
.qbtn:disabled{opacity:.5}
.qform{display:flex;flex-direction:column;gap:14px}
.tfield{display:flex;flex-direction:column;gap:6px}
.tfield>span{font-size:13.5px;color:var(--ink-2)}
.tfield textarea,.chrow input:not([type=radio]),.tfield select{width:100%;font:inherit;font-size:16px;padding:11px 13px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.tfield textarea:focus,.chrow input:focus{outline:none;border-color:var(--ink-2)}
.chrow{display:flex;align-items:center;gap:10px}
.chrow input[type=radio]{width:22px;height:22px;accent-color:var(--ok);flex:none}
.qform .cta{width:100%;height:52px;font-size:16px}
/* subscriber accounts */
.acct-chip{margin-inline-start:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font:600 13px/1 var(--f-body,inherit);cursor:pointer}
.acct-chip.in .dot{width:8px;height:8px;border-radius:50%;background:#2E9E6A}
.modal.acct{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.acct-box{position:relative;width:min(420px,100%);background:var(--card);color:var(--ink);border-radius:20px;padding:24px 20px 20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.acct-box h2{margin:0 0 4px;font-size:22px}.acct-sub{margin:0 0 14px;color:var(--ink-2);font-size:14px}
.acct-x{position:absolute;top:10px;inset-inline-end:10px}
.acct-form{display:flex;flex-direction:column;gap:12px}.acct-form label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.acct-form input{font:500 17px/1.2 system-ui,sans-serif;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:left}
.acct-err{margin:0;color:#C0392B;font-size:14px}.acct-go{justify-content:center;margin-top:4px}
.acct-list{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:8px}
.acct-list li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line)}
.acct-list li small{color:var(--ink-2)}.acct-list li.off{opacity:.6}.acct-list li.on b::before{content:"● ";color:#2E9E6A}
/* ================= first visit (landing) ================= */
.landing{padding-bottom:30px}
.lp-hero{padding-top:18px;text-align:center}
.lp-hero h1{font-family:var(--f-display);font-weight:600;font-size:clamp(30px,8.4vw,44px);line-height:1.35;margin:6px 0 6px;letter-spacing:0}
.lp-hero h1 em{font-style:normal;color:#F0A35A}
.lp-sub{color:var(--ink-2);margin:0 0 18px;font-size:15.5px}
.lp-try{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px 16px 18px;max-width:440px;margin:0 auto;box-shadow:var(--shadow)}
.lp-ask{margin:0 0 6px;font-family:var(--f-display);font-weight:500;font-size:20px}
.lp-frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 4px;font-style:normal;color:#F0A35A;font-weight:600}
.lp-frac i{font-style:normal;padding:0 4px}.lp-frac i:first-child{border-bottom:2px solid currentColor}
.lp-frac.big{font-family:var(--f-display);font-size:38px}
.lp-stage{display:flex;align-items:center;justify-content:center;gap:22px;margin:8px 0 4px}
.lp-pz{width:min(56vw,210px);height:auto;touch-action:manipulation}
.lp-crust{fill:#C9874A}
.lp-sl{fill:#F6E6CF;stroke:#C9874A;stroke-width:3;cursor:pointer;transition:fill .18s,transform .18s;transform-origin:100px 100px}
.lp-sl:hover{fill:#FBEFDC}.lp-sl:focus{outline:none}.lp-sl:focus-visible{outline:none;stroke:var(--ink);stroke-width:4}
.lp-sl.on{fill:#F0A35A;animation:lp-pop .28s ease-out}
@keyframes lp-pop{50%{transform:scale(1.04)}}
.lp-live{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:74px}
.lp-live small{color:var(--ink-2);font-size:13px}
.lp-msg{min-height:3.4em;margin:8px 4px 0;color:var(--ink-2);font-size:15px;line-height:1.7}
.lp-msg b{color:var(--ink)}.won .lp-msg b{color:var(--ok,#3fbf8f)}
.lp-try.won{border-color:color-mix(in srgb,#3fbf8f 55%,var(--line))}
.lp-next{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.lp-next:empty{display:none}
.lp-next>*{animation:lp-in .35s ease-out both}.lp-next>*:nth-child(2){animation-delay:.08s}
@keyframes lp-in{from{opacity:0;transform:translateY(8px)}}
.lp-cta{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:999px;background:var(--ink);color:var(--bg);font-family:var(--f-display);font-weight:600;font-size:17px}
.lp-ghost{height:48px;border-radius:999px;border:1px solid var(--line);color:var(--ink);font-weight:500;font-size:15.5px}
.lp-sec{margin-top:44px}
.lp-sec h2{font-family:var(--f-display);font-weight:600;font-size:23px;margin:0 0 14px}
.lp-how{display:grid;gap:12px}
.lp-how>div{display:grid;grid-template-columns:52px 1fr;column-gap:14px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.lp-how b{font-family:var(--f-display);font-weight:500;font-size:16.5px;grid-column:2}
.lp-how p{grid-column:2;margin:2px 0 0;color:var(--ink-2);font-size:14.5px;line-height:1.7}
.lp-ic{grid-row:span 2;width:52px;height:52px;border-radius:14px;background:var(--bg-2);position:relative;overflow:hidden}
.lp-ic i{position:absolute;display:block}
.lp-ic.t1 i{width:18px;height:18px;border-radius:50%;background:#F0A35A;top:17px;left:17px;animation:lp-tap 2.2s ease-in-out infinite}
@keyframes lp-tap{0%,60%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(240,163,90,.6)}30%{transform:scale(.8);box-shadow:0 0 0 12px rgba(240,163,90,0)}}
.lp-ic.t2 i{width:26px;height:26px;top:13px;left:13px;border-radius:50%;border:3px solid #e0796b;animation:lp-fix 2.6s ease-in-out infinite}
@keyframes lp-fix{0%,45%{border-color:#e0796b}55%,100%{border-color:#3fbf8f}}
.lp-ic.t3 i{left:14px;width:24px;height:6px;border-radius:3px;background:var(--ink-3);animation:lp-step 2.4s ease-in-out infinite}
.lp-ic.t3 i:nth-child(1){top:13px}.lp-ic.t3 i:nth-child(2){top:23px;animation-delay:.4s}.lp-ic.t3 i:nth-child(3){top:33px;animation-delay:.8s}
@keyframes lp-step{0%,100%{background:var(--ink-3)}30%{background:#F0A35A}}
.lp-courses{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lp-course{position:relative;text-align:start;display:flex;flex-direction:column;gap:2px;padding:16px;min-height:150px;border-radius:20px;overflow:hidden;color:#fff;
  background:linear-gradient(160deg,color-mix(in srgb,var(--pc) 85%,#fff 0%),color-mix(in srgb,var(--pc) 70%,#000))}
.lp-course .glyph{position:absolute;inset-inline-end:-6px;bottom:-14px;font-family:var(--f-display);font-weight:600;font-size:64px;opacity:.18;line-height:1}
.lp-course b{font-family:var(--f-display);font-weight:600;font-size:18px;margin-top:auto}
.lp-course small{opacity:.85;font-size:12.5px}
.lp-free{align-self:flex-start;order:-1;font-size:12px;font-weight:600;background:rgba(255,255,255,.2);border-radius:999px;padding:2px 10px}
.lp-wa{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 18px;margin-inline:16px;text-align:center}
.lp-wa p{color:var(--ink-2);margin:0 0 16px;font-size:15px}
.lp-wabtn{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:999px;background:#1FAF5A;color:#fff;font-family:var(--f-display);font-weight:600;font-size:17px;text-decoration:none}
.lp-q{border-bottom:1px solid var(--line);padding:4px 0}
.lp-q summary{cursor:pointer;list-style:none;padding:12px 0;font-weight:500;font-size:15.5px;display:flex;justify-content:space-between;gap:12px}
.lp-q summary::-webkit-details-marker{display:none}
.lp-q summary::after{content:'+';color:var(--ink-3);font-size:20px;line-height:1}
.lp-q[open] summary::after{content:'−'}
.lp-q p{margin:0 0 12px;color:var(--ink-2);font-size:14.5px}
.lp-more{text-align:center;margin-top:28px}
@media (prefers-reduced-motion:reduce){.lp-ic i,.lp-sl.on,.lp-next>*{animation:none}}
/* ---- home v2: two doors ---- */
.lp-logo{width:28px;height:28px;margin-inline-end:8px;flex:none}
.lp-brand{display:inline-flex;align-items:center}
.lp2 .lp-hero h1 em{color:transparent;background:linear-gradient(90deg,#FF3EA5,#00D4FF);-webkit-background-clip:text;background-clip:text}
.lp-doors{display:grid;gap:12px;margin-top:22px}
.lp-door{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:start;border-radius:22px;padding:18px;color:#fff;text-decoration:none;width:100%;font:inherit}
.lp-door b{font-family:var(--f-display);font-weight:600;font-size:19px;grid-column:1}
.lp-door small{grid-column:1;font-size:13.5px;opacity:.85}
.lp-door .tag{grid-column:1;justify-self:start;font-size:11.5px;border-radius:99px;padding:2px 10px;background:rgba(255,255,255,.2)}
.lp-door .go{grid-row:1/4;grid-column:2;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.2)}
.lp-door.d1{background:linear-gradient(135deg,#FF3EA5,#a040ff)}
.lp-door.d2{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.lp-door.d2 .tag,.lp-door.d2 .go{background:rgba(0,212,255,.14);color:#00a8cc}
@media (prefers-color-scheme:dark){.lp-door.d2 .tag,.lp-door.d2 .go{color:#00D4FF}}
.lp-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lp-steps div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;font-size:13px;color:var(--ink-2);line-height:1.6}
.lp-steps i{font-style:normal;display:block;font-size:24px;margin-bottom:4px}
.lp-wa2{margin-top:26px}
/* ---- the 5-minute test result ---- */
.qt-res{padding-top:10px;padding-bottom:30px;text-align:center}
.qt-k{color:var(--ink-2);font-size:15px;margin:6px 0 0}
.qt-score{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:6px 0 0}
.qt-score b{font-family:var(--f-display);font-weight:600;font-size:96px;line-height:1;background:linear-gradient(135deg,#FF3EA5,#00D4FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.qt-score small{color:var(--ink-2);font-size:18px}
.qt-range{color:var(--ink-2);font-size:14px;margin:6px 0 18px}
.qt-parts{display:grid;gap:10px;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.qt-parts div{display:grid;grid-template-columns:64px 1fr 40px;gap:10px;align-items:center;font-weight:600}
.qt-parts i{height:10px;border-radius:6px;background:var(--bg-2);overflow:hidden}.qt-parts i b{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#FF3EA5,#00D4FF)}
.qt-parts em{font-style:normal;font-family:var(--f-display);text-align:end}
.qt-areas{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 4px}
.qt-areas span{font-size:13px;border-radius:99px;padding:4px 11px;border:1px solid var(--line)}
.qt-areas .ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.qt-areas .no{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.qt-tip{margin:12px 0 0;font-size:15px}
.qt-act{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.qt-act .textlink{align-self:center}
.qt-note{color:var(--ink-3);font-size:12px;margin-top:16px;line-height:1.7}
.qt-journey{text-align:start;margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.qt-journey h3{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0}
.qt-journey>p{color:var(--ink-2);font-size:13.5px;margin:4px 0 10px;line-height:1.6}
.qt-journey ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;position:relative}
.qt-journey li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--bg-2);cursor:pointer}
.qt-journey .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;color:#fff;background:linear-gradient(135deg,#FF3EA5,#00D4FF)}
.qt-journey li.strong .n{background:var(--line);color:var(--ink-2)}
.qt-journey .t b{display:block;font-weight:600;font-size:15px}.qt-journey .t small{color:var(--ink-2);font-size:12.5px}
.qt-journey .f{font-size:12px;color:var(--ok);font-weight:600}
.qt-journey .more{color:var(--ink-3);font-size:12.5px;margin:8px 2px 0}

/* landing v4: three Netflix-style posters, one per screen */
body:has(.lp4){background:#000}
body:has(.lp4) .hud{background:#000;color:#fff}
body:has(.lp4) .hud .title,body:has(.lp4) .hud .wordmark{color:#fff}
body:has(.lp4) footer,body:has(.lp4) .foot,body:has(.lp4) .site-foot{background:#000;color:rgba(255,255,255,.6)}
.lp4{background:#000;color:#fff}
.lp4-p{position:relative;min-height:calc(100svh - 60px);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;isolation:isolate}

/* ---------- PLAYER (lessons, practice, unit test, exam) ---------- */
function playLesson(d, lesson, direct) {
  if (lesson.paid || locked(d)) return showPaywall(d); // on the free site a paid lesson is a title only
  if (lesson.drill && typeof runDrill === 'function') return runDrill(d, lesson);
  if (lesson.ladder && typeof runLadder === 'function') return runLadder(d, lesson);
  if (!direct && !S.done[lesson.id] && dgState(lesson.id) === 'check') return dgGate(d, lesson);
  runPlayer({ d, mode: 'lesson', lesson, steps: lesson.steps.slice(), title: lesson.title }); }
function allQuestions(d, onlyDone) {
  const qs = [];
  for (const l of d.lessons || []) if (!onlyDone || S.done[l.id]) for (const s of l.steps) if (s.q) qs.push(s);
  return qs;
}
function playPractice(d) { runPlayer({ d, mode: 'practice', steps: shuffle(allQuestions(d, true)).slice(0, 8), title: 'أسئلة الدروس' }); }
function examPool(cmpOnly) {
  const qs = [];
  for (const d of DISTRICTS) { if (d.soon || d.exam) continue; for (const s of allQuestions(d, false).concat(d.boss || [], bankOf(d.id))) if (!cmpOnly || (cmpOnly === true ? s.choices === CMP : cmpOnly.includes(d.id))) qs.push(s); }
  return qs;
}
function playExam(d, t) { runPlayer({ d, mode: 'exam', test: t, steps: shuffle(examPool(t.cmpOnly)).slice(0, t.n), title: t.title, total: t.secs }); }
function genFor(dids, level) { const id = pickOne(dids); const B = bankOf(id); if (B.length && Math.random() < 0.3) return Object.assign({}, pickOne(B)); return genQuestion(id, level || S.level[id] || 1); }
function playEndless(d) {
  const ids = d ? [d.id] : Object.keys(GEN).filter(id => DISTRICTS.some(x => x.id === id && !x.soon && !locked(x)));
  runPlayer({ d, mode: 'endless', gen: ids, steps: [genFor(ids)], title: d ? 'تدريب مفتوح · ' + d.name : 'تدريب مفتوح · كل الوحدات' });
}
function playReview() { runPlayer({ d: null, mode: 'review', steps: dueMistakes().slice(0, 12), title: 'مراجعة الأخطاء' }); }
function playPlacement() { return dgIntro(); }
function playPlacementOld() {
  const steps = [];
  for (const id of Object.keys(WEIGHT)) { if (!GEN[id]) continue; const gi = shuffle(GEN[id].map((_, i) => i)); steps.push(genQuestion(id, 1, gi[0]), genQuestion(id, 2, gi[1])); }
  runPlayer({ d: null, mode: 'placement', steps: steps.filter(Boolean), title: 'اختبار تحديد المستوى' });
}
function playBoss(d) { runPlayer({ d, mode: 'boss', steps: shuffle(d.boss.concat(bankOf(d.id))).slice(0, 10), title: 'اختبار الوحدة', timer: 60 }); }

function runPlayer(P) {
  screen(P.d && P.d.color);
  const queue = P.steps.map(s => ({ s, again: false }));
  const exam = P.mode === 'exam' || P.mode === 'placement', endless = P.mode === 'endless';
  const back = () => P.d ? showDistrict(P.d) : showCity();
  let run = 0, miss = 0;
  let idx = 0, mistakes = 0, correct = 0, tick = null, combo = 0, gained = 0, rankUp = null;
  const log = []; // {s, chosen, ok}
  const wrap = h('div', 'player');
  const top = h('div', 'ptop gut');
  const x = h('button', 'xbtn', ic('close', 22)); x.setAttribute('aria-label', 'خروج');
  const LTL = P.lesson ? P.lesson.id : null; LT_LESSON = LTL || (P.d ? P.d.id : P.mode);
  LT(P.mode === 'lesson' ? 'lesson_start' : 'start', { lesson: LT_LESSON, val: P.mode });
  x.onclick = () => { FX.play('tap'); if (idx < queue.length) LT(P.mode === 'lesson' ? 'lesson_exit' : 'quit', { lesson: LT_LESSON, n: idx + 1, val: P.mode }); if (endless && log.length) { idx = queue.length; render(); } else back(); };
  const pbar = h('div', 'pbar', '<i style="width:0%"></i>');
  const comboEl = h('span', 'combo');
  const timerEl = h('span', 'ptimer'); timerEl.hidden = !(P.timer || P.total);
  let totalTick = null;
  if (P.total) {
    let left = P.total;
    const show = () => { timerEl.textContent = ar(Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0')); timerEl.classList.toggle('low', left <= 60); };
    show();
    totalTick = setInterval(() => { left--; show(); if (left <= 0) { clearInterval(totalTick); toast('انتهى الوقت'); idx = queue.length; render(); } }, 1000);
  }
  top.append(x, pbar, comboEl, timerEl);
  const ttl = h('div', 'ptitle gut', `<small>${P.d ? P.d.name : COURSE.section}</small><b>${fmt(P.title)}</b>`);
  /* lesson phases: intro → learn → worked example → solve together → practice → summary */
  const PHASES = [['intro', 'مقدمة'], ['learn', 'الشرح'], ['example', 'مثال محلول'], ['guided', 'نحل معًا'], ['practice', 'تدريب'], ['summary', 'الخلاصة']];
  const phaseOf = s => s.intro ? 'intro' : s.example ? 'example' : (s.guided || s.order || s.fixit) ? 'guided' : s.summary ? 'summary' : (s.q && !s.check) ? 'practice' : 'learn';
  const structured = P.mode === 'lesson' && P.steps.some(s => s.intro || s.explain || s.act || s.example || s.guided || s.summary || s.order || s.fixit);
  const present = structured ? PHASES.filter(([k]) => P.steps.some(s => phaseOf(s) === k)) : [];
  const strip = h('div', 'phases gut');
  function paintPhase(s) { if (!structured) { strip.innerHTML = `<span class="ph on">${fmt(P.title)}</span>`; return; } const cur = phaseOf(s), ci = present.findIndex(p => p[0] === cur);
    strip.innerHTML = `<span class="ph on">${present[ci] ? present[ci][1] : ''}</span>`; }
  const pane = h('div', 'pbody gut');
  let body = pane; // the page being written now (in a lesson every step gets its own page)
  /* lessons are one scroll of linked pages: finished steps stay above exactly as the student left them,
     and nothing below the current page exists yet, so he can look back but never peek ahead */
  const paged = P.mode === 'lesson';
  if (paged) pane.classList.add('paged');
  const edge = h('div', 'lock-edge', `${ic('lock', 14)}<span>أكمل هذه الخطوة لتظهر التالية</span>`);
  const dock = h('div', 'dock');
  const dockIn = h('div', 'dock-in gut');
  dock.appendChild(dockIn);
  wrap.append(top, strip, pane);
  app.append(wrap, dock);
  cleanupFns.push(() => { clearInterval(tick); clearInterval(totalTick); dock.remove(); });

  function progress() { pbar.firstChild.style.width = (endless ? 10 * (log.length % 10) : 100 * idx / queue.length) + '%'; }
  function setDock(state, title, why, label, onClick, enabled = true) {
    dock.className = 'dock' + (state ? ' ' + state : '');
    dockIn.innerHTML = ''; dockIn.classList.remove('withback');
    if (title) { const hd = h('div', 'fb-head'); hd.innerHTML = `<span class="fb-ic">${ic(state === 'ok' ? 'check' : 'cross', 20)}</span>`; hd.appendChild(h('p', 'fb-t', title)); dockIn.appendChild(hd); }
    if (why) { const w = h('p', 'fb-w', fmt(why)); dockIn.appendChild(w); }
    const b = h('button', 'cta', label); b.disabled = !enabled; b.onclick = () => { FX.play('tap'); onClick(); };
    dockIn.appendChild(b);
    return b;
  }
  let stepCleanup = [];
  function render() {
    progress();
    clearInterval(tick); FX.stop();
    stepCleanup.forEach(f => f()); stepCleanup = [];
    if (idx >= queue.length) return finish();
    const { s, again } = queue[idx];
    if (paged) {
      const prev = body !== pane ? body : null;
      if (prev) { prev.classList.add('past'); prev.setAttribute('inert', ''); }
      body = h('div', 'lpage' + (prev ? ' pin' : '')); pane.appendChild(body); pane.appendChild(edge);
      if (prev) requestAnimationFrame(() => { const y = body.getBoundingClientRect().top + window.scrollY - top.offsetHeight - 6; window.scrollTo({ top: y, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); });
      else window.scrollTo(0, 0);
    } else { body.innerHTML = ''; window.scrollTo(0, 0); }
    paintPhase(s);
    if (s.intro) renderIntro(s); else if (s.act) renderAct(s); else if (s.explain) renderExplain(s); else if (s.rule) renderRule(s); else if (s.example) renderExample(s); else if (s.guided) renderGuided(s); else if (s.order) renderOrder(s); else if (s.fixit) renderFixit(s); else if (s.summary) renderSummary(s);
    else if (s.check) renderCheck(s); else if (s.q) renderQuestion(s, again); else renderTeach(s);
  }

  const next = () => { idx++; render(); };
  /* intro: goals + why it matters + an exam question you will be able to solve */
  function renderIntro(s) {
    const I = s.intro, c = h('section', 'intro');
    const li = P.d && P.lesson ? P.d.lessons.indexOf(P.lesson) : -1;
    if (P.d) body.appendChild(poster('billboard lesson', P.d, `<div class="bb-body"><small class="eyebrow">${P.d.name}${li >= 0 ? ` · الدرس ${ar(li + 1)}` : ''}</small><h1>${fmt(P.title)}</h1>${I.why ? `<p>${fmt(I.why)}</p>` : ''}</div>`));
    c.innerHTML = `<small class="eyebrow">ستتعلم</small><ul class="goals">${I.goals.map(g => `<li><span>${fmt(g)}</span></li>`).join('')}</ul>`;
    body.appendChild(c);
    if (false) { const pv = h('div', 'preview'); pv.innerHTML = `<small class="eyebrow">بنهاية الدرس ستحل سؤالًا مثل هذا</small><p class="qtext">${fmt(I.preview.q)}</p>${I.preview.a != null ? `<div class="cmp"><div><small>القيمة الأولى</small><span>${fmt(I.preview.a)}</span></div><div><small>القيمة الثانية</small><span>${fmt(I.preview.b)}</span></div></div>` : ''}<div class="pv-opts">${I.preview.choices.map((x, k) => `<span><i>${LETTERS[k]}</i>${fmt(x)}</span>`).join('')}</div>`; body.appendChild(pv); }
    setDock('', '', '', 'لنبدأ', next);

      const sk = h('button', 'btn skipk', 'أعرف هذا؟ تخطَّه بسؤالين'); sk.onclick = () => { FX.play('tap'); dgSkipTest(P.d, P.lesson); };

  /* a hands-on step: one idea, the student acts first and the name comes after. The lesson file drives it through ctx. */
  function renderAct(s) {
    const A = s.act, c = h('section', 'act');
    c.innerHTML = `<small class="eyebrow">${A.kicker || ''}</small><p class="act-say"></p>`;
    const fig = h('div', 'bfig act-fig'), svg = sv('svg', { viewBox: `0 0 360 ${A.h || 240}`, style: 'direction:ltr' }); fig.appendChild(svg);
    if (A.h === 0) fig.hidden = true; // a step that is only a question has no picture box
    const pick = h('div', 'act-pick'), msg = h('p', 'act-msg');
    c.append(fig, pick, msg); body.appendChild(c);
    const btn = setDock('', '', '', A.cta || 'التالي', next, false);
    const pop = e => { e.classList.remove('pop-in'); void e.offsetWidth; e.classList.add('pop-in'); };
    let finished = false;
    const ctx = {
      svg,
      layer() { const g = sv('g', {}, svg); return buildKit(svg, g); },
      wipe() { svg.innerHTML = ''; },

      } else {
        const [a, b2, rel] = relAns;

    function answer(ci, timeout, conf) {

        else { miss++; run = 0; if (miss >= 2 && L > 1) { L--; miss = 0; } }

    }
  }

  function finish() {

        S.done[P.lesson.id] = true;
        S.stars[P.lesson.id] = Math.max(S.stars[P.lesson.id] || 0, stars);

/* step-by-step solution: one step at a time */
function solutionBox(steps, open) {
  const box = h('div', 'solbox'), ol = h('ol'), btn = h('button', 'tool', `${ic('steps', 15)}<span>الحل خطوة بخطوة</span>`);
  let k = 0;
  const more = () => { if (k >= steps.length) return; FX.play('tap'); ol.appendChild(h('li', 'pop-in', fmt(steps[k++]))); btn.innerHTML = k < steps.length ? `${ic('steps', 15)}<span>الخطوة التالية</span>` : `${ic('check', 15)}<span>اكتمل الحل</span>`; btn.disabled = k >= steps.length; };
  btn.onclick = more; box.append(ol, btn);

}
function weakestTopic() {
  let best = null, low = 2;
  for (const id of Object.keys(WEIGHT)) { const a = topicAcc(id), d = distById(id); if (a != null && d && !d.soon && a < low) { low = a; best = d; } }

    return `<div class="dz-orb${ring ? '' : ' bare'}"><svg width="140" height="140" viewBox="0 0 140 140" fill="none" aria-hidden="true"><g transform="rotate(-90 70 70)">${segs}<circle class="dz-tbg" cx="70" cy="70" r="49" pathLength="100" stroke-width="2"/><circle class="dz-tfg" cx="70" cy="70" r="49" pathLength="100" stroke-width="2" stroke-linecap="round" stroke-dasharray="100 0"/></g></svg><div class="dz-c"></div></div>`;
  }
  function ringPts(stage, pts, delta) {
    const segs = stage.querySelectorAll('.dz-seg');
    segs.forEach((c, i) => { c.classList.remove('dz-lit', 'dz-lost'); c.classList.toggle('on', i < pts); });
    if (delta > 0) for (let i = Math.max(0, pts - delta); i < pts; i++) segs[i] && segs[i].classList.add('dz-lit');
    if (delta < 0 && segs[pts]) { segs[pts].classList.add('dz-lost'); setTimeout(() => segs[pts] && segs[pts].classList.remove('dz-lost'), 700); }
    const c = stage.querySelector('.dz-c'); if (c && delta) { c.className = 'dz-c ' + (delta > 0 ? 'up' : 'down'); c.textContent = delta > 0 ? `+${ar(delta)}` : `−${ar(-delta)}`; }
  }

  /* one question in the middle of the screen. done(result) with result = 'fast' | 'ok' | 'miss' | 'time' */
  function ask(stage, g, secs, hints, done, onMiss, ring, pen) {
    window.__drQ = g; // automatic tests only
    stage.insertAdjacentHTML('beforeend', orbHTML(ring));
    const orb = stage.querySelector('.dz-orb'), cen = orb.querySelector('.dz-c'), fg = orb.querySelector('.dz-tfg');
    const fb = h('p', 'lad-fb dz-msg'); stage.appendChild(fb);
    stage.appendChild(h('h1', 'dz-q', fmt(g.q.replace(/` ، /g, ' ،` ').replace(/ ، /g, '، '))));   // the comma sticks to what's before it, never starts a line

    g.opts.forEach((o, ci) => {

        b.disabled = true; b.classList.add('bad'); FX.play('wrong');
        if (!missed) { missed = true; stopT(); orb.classList.add('off'); if (onMiss) onMiss(o.key, (performance.now() - t0) / 1000); LT('drill_miss', { lesson: id, val: o.key, n: mem().lv + 1 }); }
        fb.className = 'lad-fb dz-msg bad'; fb.innerHTML = fmt(hints[o.key] || 'لا، جرّب غيرها.');
        if (canPen && !penBtn) {
          if (pen.auto) { setTimeout(() => !gone && playPen('auto'), 700); penBtn = true; }
          else { penBtn = h('button', 'pen-btn', '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg>ورّني'); penBtn.onclick = () => playPen('tap'); fb.after(penBtn); }
        }
      };
      opts.appendChild(b);
    });
    stage.appendChild(opts);
    const paint = left => { cen.textContent = ar(Math.ceil(left)); fg.style.strokeDashoffset = String(100 - 100 * left / secs); orb.classList.toggle('low', left <= 5); };
    paint(secs);
    let pausedAt = null;
    curAsk = {   // the help sheet stops the clock and gives the time back
      pause: () => { if (timer && !over && !missed) { stopT(); pausedAt = performance.now(); } },
      resume: () => { if (pausedAt != null && !gone && !over && !missed) { t0 += performance.now() - pausedAt; pausedAt = null; run(); } else pausedAt = null; } };
    const run = () => { timer = setInterval(() => {
      if (gone) return stopT();
      const left = Math.max(0, secs - (performance.now() - t0) / 1000);
      paint(left);
      const whole = Math.ceil(left);
      if (whole < last) { last = whole; if (whole > 0 && whole <= 5) FX.play('tickHi'); }
      if (left <= 0) {      // time up: counts as a miss, the right answer lights up, next question
        stopT(); over = true; stage.classList.add('answered'); FX.play('wrong');
        opts.querySelectorAll('.opt').forEach((x, ci) => { x.disabled = true; if (g.opts[ci].key == null) x.classList.add('ok'); });
        cen.className = 'dz-c down'; cen.textContent = '⏰';

    run();
  }

  /* the first screen: what the lesson is and how long it takes. Nothing else. */
  function startScreen(resume) {
    paintTrack();
    const p = page('dz-start', true);
    p.innerHTML = `<p class="dz-eyebrow">${fmt(d.name || '')}</p><h1 class="dz-title">${fmt(lesson.title)}</h1><p class="dz-sub">${resume ? 'كمّل من المكان اللي وقفت فيه.' : 'أسئلة سريعة تبني عندك الحسّ، فكرة فكرة.'}</p>
      <div class="dz-chips"><span class="dz-chip"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7FE0B4" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>حوالي ${ar(D.minutes || 20)} دقيقة</span>
      <span class="dz-chip"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7FE0B4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v16l-5-3.5L7 20z"/></svg>وقّف وارجع متى ما تبغى</span></div>`;

  }

  /* a new idea: «فكرة جديدة» big in the middle, it fades, the explanation takes its place */
  function idea(i) {
    const lv = D.levels[i];
    paintTrack((pos(i) + (TRY ? (tr().cur === i ? (mem().pts || 0) / (lv.goal || DR_GOAL) : 0) : mem().lv === i ? (mem().pts || 0) / (lv.goal || DR_GOAL) : 0)) / NV);
    const p = page('dz-idea-page', true);
    p.innerHTML = '<h1 class="dz-big">فكرة<br>جديدة</h1><div class="dz-line"></div>';
    dockNone();
    let mo = null;
    const show = () => {
      if (gone) return;

      p.innerHTML = `<h1 class="dz-idea">${fmt(lv.idea)}</h1>${moving ? '<div class="dz-mo"></div>' : ''}${lv.ex ? `<div class="dz-ex${moving ? ' dz-ex-after' : ''}">${fmt(lv.ex)}</div>` : ''}`;

        mo = window.LeenaMotion.play(box, lv.motion);

        p.onclick = e => { if (e.target.closest('.dock')) return; if (mo.isDone()) { if (e.target.closest('.dz-mo')) { if (ex) ex.classList.remove('in'); mo.replay(); mo.then(() => ex && ex.classList.add('in')); } } else mo.skip(); };   // tap = skip; tap the example again = replay
      }
    };
    const t1 = setTimeout(() => { if (gone) return; const b = p.querySelector('.dz-big'); if (b) b.classList.add('out'); setTimeout(show, 450); }, 1500);
    p.onclick = () => { clearTimeout(t1); show(); };   // a tap skips the title
  }
  /* the «؟» sheet: the idea of level i again, its motion plays; closing it gives the question its time back */
  function openHelp(i) {
    const lv = D.levels[i]; if (!lv || document.querySelector('.dz-help')) return;
    if (curAsk) curAsk.pause();
    LT('help_open', { lesson: id, n: i + 1 });
    const moving = lv.motion && lv.motion.length && window.LeenaMotion;
    const sh = h('div', 'dz-help', `<div class="dz-help-in" role="dialog" aria-label="مساعدة"><h2 class="dz-idea">${fmt(lv.idea)}</h2>${moving ? '<div class="dz-mo"></div>' : ''}${lv.ex ? `<div class="dz-ex${moving ? ' dz-ex-after' : ''}">${fmt(lv.ex)}</div>` : ''}<button class="cta dz-help-x">رجوع</button></div>`);
    document.body.appendChild(sh);
    requestAnimationFrame(() => sh.classList.add('on'));
    let m2 = null;
    if (moving) { const ex = sh.querySelector('.dz-ex-after'); m2 = window.LeenaMotion.play(sh.querySelector('.dz-mo'), lv.motion); m2.then(() => ex && ex.classList.add('in')); }
    const close = () => { if (sh.classList.contains('bye')) return; sh.classList.add('bye'); sh.classList.remove('on'); setTimeout(() => sh.remove(), 300); if (curAsk && !gone) curAsk.resume(); };
    sh.onclick = e => { if (e.target === sh || e.target.closest('.dz-help-x')) { FX.play('tap'); close(); } else if (m2 && !m2.isDone()) m2.skip(); };
    cleanupFns.push(() => sh.remove());

  /* the drill of one level. It adapts while he answers:
     - right and fast → the notch climbs faster and the level ends sooner; struggling → the notch holds
     - two misses in a row → one small step easier (never more)
     - a wrong pick in a blink, twice → the idea again, calmly
     - the same mistake twice → that mistake explained, then questions that carry the same trap
     - three misses in a row → the longer explanation */
  /* ---------- the guide (docs/PART_ONE_PLAN.md §2): the academy logo and one short line, only from what he really did ----------
     at most one line per question, never on two questions in a row, never while the pen draws. Never a promise of a score. */
  const GLOGO = '<svg viewBox="-110 -110 220 220" aria-hidden="true"><rect x="-110" y="-110" width="220" height="220" rx="110" fill="#16201B"/><path d="M-62 10 C-62 72 62 72 62 10" fill="none" stroke="#F6F4EE" stroke-width="22" stroke-linecap="round"/><circle cx="-30" cy="-42" r="16" fill="#F6F4EE"/><circle cx="30" cy="-42" r="16" fill="#F6F4EE"/></svg>';
  const GD = { q: 0, last: -9, pending: null, here: false };   // q: questions shown in this sitting; last: the one the guide spoke on
  const COMMON = new Set(D.common || []);
  function guideOff() { heroOff('yes'); document.querySelectorAll('.dz-guide').forEach(g => { g.classList.remove('in'); g.classList.add('out'); setTimeout(() => g.remove(), 300); }); }
  function guide(stage, html, free) {   // free: not tied to a question (the level-done page)
    if (!stage || gone) return false;
    if (!free && (GD.here || GD.last === GD.q - 1)) return false;
    document.querySelectorAll('.dz-guide').forEach(g => g.remove());
    const g = h('div', 'dz-guide', `<i>${GLOGO}</i><p>${html}</p>`);
    g.setAttribute('role', 'status');
    stage.appendChild(g);
    /* it must never cover the answers: without the logo if needed, or not at all */
    const clash = () => { const o = stage.querySelector('.dz-opts'), f = stage.querySelector('.dz-msg'); const top = g.getBoundingClientRect().top - (g.classList.contains('in') ? 0 : (new DOMMatrix(getComputedStyle(g).transform).m42 || 0));   // where it will rest, not where it rises from
      return [o, f].some(x => x && x.getBoundingClientRect().height && x.getBoundingClientRect().bottom > top - 8); };
    if (clash()) { g.classList.add('nologo'); if (clash()) { g.remove(); return false; } }
    requestAnimationFrame(() => g.classList.add('in'));
    if (!free) { GD.here = true; GD.last = GD.q; }
    LT('guide', { lesson: id, val: g.textContent.slice(0, 40) });
    return true;
  }
  function guideAsk(stage, i, first) {   // called when a question appears
    GD.q++; GD.here = false;
    let line = null;
    if (first && !TRY && i === 0 && !mem().pts) line = 'خذ وقتك. الغلط هنا يعلّم.';
    else if (first && TRY && tr() && tr().path) { const t = tr(), L = t.path.length, left = L - t.at;
      if (t.at === L - 1) line = 'آخر فكرة. بعدها نرجع لسؤال البداية.'; else if (t.at === Math.floor(L / 2)) line = `نص الطريق. باقي لك ${left === 2 ? 'فكرتين' : ar(left) + ' أفكار'}.`; }
    else if (first && VIS && i === 3 && NV === 6) line = 'نص الطريق. باقي لك ٣ أفكار.';
    else if (first && VIS && i === NV - 1) line = 'آخر فكرة في الجزء الأول.';
    if (!line && GD.pending) line = GD.pending;
    GD.pending = null;
    if (line && guide(stage, line) && /^<b>٣ صح ورا بعض/.test(line)) setTimeout(() => !gone && hero('yes'), 120);   // the hero peeks with the guide's streak line
  }

  let lvStat = null;
  function level(i) {
    const lv = D.levels[i], m = mem(), goal = lv.goal || DR_GOAL, s = sk(id, i);
    if (TRY) { if (m.try.cur !== i) { m.try.cur = i; m.pts = 0; m.k = 0; } } else if (m.lv !== i) { m.lv = i; m.pts = 0; m.k = 0; }
    persist();
    s.miss = s.miss || {};
    let pts = m.pts || 0, k = m.k || 0, streak = 0, missRow = 0, guessRow = 0, aim = null, aimLeft = 0, firstKey = null, firstAt = 0;
    const st = lvStat = { q: 0, miss: 0, t: 0, bone: 0, down: 0, again: 0, focus: 0 }, aimed = {};
    const tone = lv.tone || (i < N / 2 ? 'strict' : 'warm');
    let firstQ = true;
    const next = () => {
      if (gone) return;
      paintTrack((pos(i) + pts / goal) / NV);
      const p = page('dz-drill');
      firstKey = null; firstAt = 0;
      const g = make(lv, k, aim);
      if (aim && --aimLeft <= 0) aim = null;
      dockNone();
      helpLv = i; helpB.hidden = false;
      ask(p, g, lv.t, lv.hints || {}, (res, fb, used) => {
        st.q++; st.t += used || 0; learn(s, res);
        guideOff();
        /* the first answer on this phone: a deliberate act (a tap on «جرّب الدرس» can be an accident). TikTok learns from this one (site.html) */
        firstAnswer(res); countVis(res, used);
        const delta = res === 'fast' ? 2 : res === 'ok' ? 1 : -1;
        if (res !== 'miss') {   // a wrong pick already took its point off the ring the moment he picked it
          pts = Math.max(0, Math.min(goal, pts + delta));
          if (delta > 0) { const r = rate(); k += r >= 0.9 && res === 'fast' ? 2 : r < 0.7 && res !== 'fast' ? 0 : 1; }
          m.pts = pts; m.k = k; persist();
          ringPts(p, pts, delta); paintTrack((pos(i) + pts / goal) / NV);
        }
        if (delta > 0) {
          streak++; missRow = 0; guessRow = 0;
          if (streak === 3 || streak === 5) GD.pending = `<b>${ar(streak)} صح ورا بعض.</b> ${streak === 3 ? 'كمّل كذا.' : 'ما شاء الله.'}`;   // the streak speaks through the guide now
          const line = streak === 8 ? drT('streak_8') : res === 'fast' && streak !== 3 && streak !== 5 ? drT('fast') : '';
          fb.className = 'lad-fb dz-msg ok'; fb.textContent = line || drT('right');
          if (pts >= goal) return setTimeout(() => !gone && levelDone(i), 900);
          setTimeout(next, 900);
          return;
        }
        st.miss++; streak = 0; missRow++;
        const key = res === 'miss' ? firstKey : null;
        const guess = res === 'miss' && firstAt < Math.min(3, lv.t * 0.12);
        guessRow = guess ? guessRow + 1 : 0;
        if (key) s.miss[key] = (s.miss[key] || 0) + 1;
        if (missRow === 2 && k > 0) { k--; m.k = k; st.down++; }
        persist();
        if (g._pen) { if (res === 'miss') guide(p, COMMON.has(key) ? 'عادي. هذي غلطة معروفة.' : 'عادي. جرّب اللي بعدها.'); if (res === 'miss' && !st.oops) { st.oops = 1; setTimeout(() => !gone && hero('oops'), 60); } }   // the hero makes the face once per level   // the pen showed the way: the guide says one calm line
        else if (guess) fb.innerHTML += `<br><span class="dz-coach">${drT('slow')}</span>`;
        else if (res === 'miss' && Math.random() < 0.5) fb.innerHTML += `<br><span class="dz-coach">${drT('miss_' + tone)}</span>`;
        if (missRow >= 3) {
          missRow = 0; guessRow = 0; st.bone++; s.w = 1; s.p = Math.min(s.p, 0.35); LT('drill_bone', { lesson: id, n: i + 1 });
          if (res === 'time') setTimeout(() => !gone && bone(i, next), 1600); else dockBtn(drT('stuck_button'), () => bone(i, next));
          return;
        }
        if (guessRow >= 2) { guessRow = 0; st.again++; return dockBtn('التالي', () => again(i, next)); }
        if (key && s.miss[key] >= 2 && !aimed[key] && (lv.hints || {})[key]) { aimed[key] = 1; aim = key; aimLeft = 2; st.focus++; return dockBtn('التالي', () => focus(i, key, next)); }
        if (res === 'time') setTimeout(next, 1600);
        else dockBtn(g._pen ? 'فهمت' : 'التالي', next);
      }, (key, at) => { guideOff(); firstKey = key; firstAt = at; pts = Math.max(0, pts - 1); m.pts = pts; persist(); ringPts(pane, pts, -1); paintTrack((pos(i) + pts / goal) / NV); }, { pts, goal }, { auto: true });   // the pen plays by itself on every wrong pick (owner, 12 Nov 2026)
      guideAsk(p, i, firstQ); firstQ = false;
    };
    next();
  }

  /* he answered wrong in a blink, twice: the idea once more, calmly */
  function again(i, back) {
    const lv = D.levels[i];
    const p = page('dz-bone-page dz-again', true);
    p.innerHTML = `<h1 class="dz-h">${drT('again_title')}</h1><div class="dz-bone">${fmt(lv.idea + (lv.ex ? '<br>' + lv.ex : ''))}</div>`;
    dockBtn('فهمت', back);
  }
  /* the same mistake twice: that one mistake, spelled out, with the worked example */
  function focus(i, key, back) {
    const lv = D.levels[i];
    const p = page('dz-bone-page dz-focus', true);
    p.innerHTML = `<h1 class="dz-h">${drT('focus_title')}</h1><div class="dz-bone">${fmt(lv.hints[key] + (lv.ex ? '<br>' + lv.ex : ''))}</div>`;
    dockBtn('فهمت', back);
  }

  /* a few questions from ideas he met before (no points): a warm-up at the door, or an older idea coming back between levels */
  function quiz(items, label, done) {
    let n = 0, got = 0;
    const step = () => {
      if (gone) return;
      if (n >= items.length) return done(got);
      const [L2, j] = items[n++], lv = L2.drill.levels[j], s = sk(L2.id, j);
      const p = page('dz-drill dz-rev'); dockNone();
      ask(p, make(lv, 2 + Math.floor(Math.random() * 3)), lv.t, lv.hints || {}, (res, fb) => {
        const ok = res === 'fast' || res === 'ok';
        learn(s, res); s.d = 1;
        if (ok) { got++; s.w = 0; s.iv = Math.min(60, (s.iv || 1) * 2.5); } else { s.w = 1; s.iv = 1; }
        s.due = Date.now() + s.iv * DAY; persist();
        if (ok) { fb.className = 'lad-fb dz-msg ok'; fb.textContent = res === 'fast' ? drT('fast') : drT('right'); setTimeout(step, 800); }
        else if (res === 'time') setTimeout(step, 1600);
        else dockBtn('التالي', step);
      });
      const fb = p.querySelector('.dz-msg'); if (fb && label) { fb.className = 'lad-fb dz-msg dz-tag'; fb.textContent = drT(label); }
    };
    step();
  }
  /* between two levels: an idea that was hard for him comes back (up to two), or every third level an old one, so nothing fades */
  const cameBack = {};
  function between(i) {
    const go = () => {
      if (VIS && i >= NV) return partDone();
      if (VIS && i === 3 && TUN.wantSave && TUN.wantSave()) { cleanup(); lesson._resumed = true; return TUN.save(lesson); }   // «احفظ مكانك», then back to level 4
      return i >= N ? finalIntro() : idea(i);
    };
    if (VIS && i >= NV) return go();
    const can = j => (cameBack[j] || 0) < 3;
    let list = [];
    for (let j = 0; j < i; j++) { const s = sk(id, j); if ((s.w || s.p < 0.55) && can(j)) list.push(j); }
    list = list.sort((a, b) => sk(id, a).p - sk(id, b).p).slice(0, 2);
    /* every third level: one idea from an EARLIER lesson that is due (spaced: 1 day, then about 3, 7, 18…), weakest first.
       This replaced the warm-up at the door (owner, 12 Nov 2026: a review before the lesson kills the momentum). */
    let other = null;
    if (!list.length && i % 3 === 0 && i < N && i > 0 && (cameBack.other || 0) < 3) {
      const now = Date.now(), pool = [];
      for (const L2 of d.lessons || []) {
        if (!L2.drill || L2 === lesson) continue;
        const mm = S.drill[L2.id]; if (!mm || !mm.finished || mm.v !== (L2.drill.v || 1)) continue;
        for (let j = 0; j < L2.drill.levels.length; j++) { const had = B.sk[L2.id + ':' + j], s2 = sk(L2.id, j); if (!had) { s2.p = 0.6; s2.d = 1; } if ((s2.due || 0) <= now) pool.push({ L2, j, p: s2.p }); }
      }
      if (pool.length) { other = drShuffle(pool).sort((a, b) => a.p - b.p)[0]; cameBack.other = (cameBack.other || 0) + 1; }
    }
    if (other) { LT('drill_back', { lesson: id, n: i, val: other.L2.id + ':' + (other.j + 1) }); return quiz([[other.L2, other.j]], 'back', go); }
    if (!list.length && i % 3 === 0 && i < N) { let best = -1; for (let j = 0; j < i; j++) if (can(j) && (best < 0 || (sk(id, j).at || 0) < (sk(id, best).at || 0))) best = j; if (best >= 0) list = [best]; }
    if (!list.length) return go();
    list.forEach(j => { cameBack[j] = (cameBack[j] || 0) + 1; });
    LT('drill_back', { lesson: id, n: i, val: list.map(j => j + 1).join(',') });
    quiz(list.map(j => [lesson, j]), 'back', go);
  }
  /* at the door: a short warm-up from what he learned before (earlier lessons, and this one if he comes back another day).
     What is due comes first (1 day, then about 3, 7, 18…), then what he is weakest at. */
  function warm(then) {
    const now = Date.now(), fresh = !m0.lv && !m0.pts;
    if (B.warm && now - B.warm < 6 * 3600e3) return then();
    const pool = [];
    for (const L2 of d.lessons || []) {
      if (!L2.drill) continue;
      const mm = S.drill[L2.id]; if (!mm || mm.v !== (L2.drill.v || 1)) continue;
      const upto = L2 === lesson ? Math.min(mm.lv || 0, N) : mm.finished ? L2.drill.levels.length : 0;
      for (let j = 0; j < upto; j++) { const had = B.sk[L2.id + ':' + j], s = sk(L2.id, j); if (!had) { s.p = 0.6; s.d = 1; } pool.push({ L2, j, p: s.p, due: (s.due || 0) <= now, own: L2 === lesson }); }
    }
    const order = drShuffle(pool).sort((a, b) => a.p - b.p);
    let list = order.filter(x => x.due && (!x.own || (sk(id, x.j).due || 0) > 0));   // this lesson's own ideas only once a day has passed
    if (fresh && list.length < 3) list = list.concat(order.filter(x => !x.own && !list.includes(x))).slice(0, 3);
    if (list.length < 2) return then();
    list = list.slice(0, list.filter(x => x.p < 0.6).length > 3 ? 5 : 3);
    B.warm = now; persist();
    paintTrack();
    const p = page('dz-idea-page dz-warm', true);
    p.innerHTML = `<h1 class="dz-big">${drT('warm_title')}</h1><div class="dz-line"></div>`;
    dockNone();
    const start = () => { if (gone || start.done) return; start.done = true; quiz(list.map(x => [x.L2, x.j]), 'warm', got => { LT('drill_warm', { lesson: id, n: got, val: String(list.length) }); then(); }); };
    const t1 = setTimeout(start, 1300); p.onclick = () => { clearTimeout(t1); start(); };
  }

  /* stuck: a slightly longer explanation with one worked example, then the questions go on */
  function bone(i, back) {
    const lv = D.levels[i];
    const p = page('dz-bone-page', true);
    p.innerHTML = `<h1 class="dz-h">${drT('stuck_title')}</h1><div class="dz-bone">${fmt(lv.bone || lv.idea + '<br>' + (lv.ex || ''))}</div>`;
    dockBtn(drT('stuck_done_button'), back);
  }

  /* level done: the ring closes into one glowing circle, a coach line, then the next idea */
  function levelDone(i) {
    const lv = D.levels[i], m = mem();
    FX.play('task');
    LT('drill_level', { lesson: id, n: i + 1 });
    const s = sk(id, i), st = lvStat || { q: 0, miss: 0, t: 0, bone: 0, down: 0, again: 0, focus: 0 };
    s.d = 1; s.iv = 1; s.due = Date.now() + DAY; if (st.miss >= 3 || st.bone) s.w = 1;
    /* anonymous numbers for this level (no names): questions | misses | average seconds | long explanations | steps down | look-agains | mistake notes */
    LT('drill_stat', { lesson: id, n: i + 1, val: [st.q, st.miss, st.q ? Math.round(st.t / st.q) : 0, st.bone, st.down, st.again, st.focus].join('|') });
    lvStat = null;
    if (TRY) { m.try.at = (m.try.at || 0) + 1; m.try.cur = null; } else m.lv = i + 1;
    m.pts = 0; m.k = 0; persist();
    paintTrack(TRY ? m.try.at / NV : (i + 1) / NV);
    const tone = lv.tone || (i < N / 2 ? 'strict' : 'warm');
    const p = page('dz-done', true);
    p.innerHTML = `<div class="dz-ring">${SVG_OK}</div><h1 class="dz-h">${drT('up_' + tone)}</h1><p class="dz-p">ضبطت «${lv.name}»</p>`;
    dockBtn('كمّل', () => TRY ? tryNext() : between(i + 1));
    const secs = Math.round(st.t);
    if (st.q && secs > 0 && secs < 40) guide(p, `خلّصتها في ${secAr(secs)}.`, true);
  }

  /* ---------- small shared pieces ---------- */
  function firstAnswer(res) {   // the first answer on this phone: a deliberate act (a tap on «جرّب الدرس» can be an accident). TikTok learns from this one (site.html)
    try { if (localStorage.getItem('leena-ans1') !== '1') { localStorage.setItem('leena-ans1', '1'); LT('first_answer', { lesson: id, val: res }); } } catch (e) {}
  }
  function countVis(res, used) { if (!VIS) return; const m = mem(); m.n = (m.n || 0) + 1; m.s = (m.s || 0) + (used || 0); if (res === 'fast' || res === 'ok') m.r = (m.r || 0) + 1; }

  /* ---------- the hero of the films (docs/TRY_FIRST_PLAN.md): a classmate who only reacts. The guide (the smile) teaches. ----------
     Pictures: site/land/hero-*.webp (made by video/hero_export.js). He never covers an answer, the hint, the question or a button: smaller, or not at all. */
  const HERO = {};
  function heroClash(e) {
    const dy = e.classList.contains('in') ? 0 : (new DOMMatrix(getComputedStyle(e).transform).m42 || 0);   // measured where he WILL stand, not where he rises from
    const mine = [e.querySelector('img'), e.querySelector('.dz-hero-say')].filter(Boolean).map(x => { const r = x.getBoundingClientRect(); return { left: r.left, right: r.right, top: r.top - dy, bottom: r.bottom - dy }; });
    const behind = e.classList.contains('dz-hero-oops');   // he stands behind the dock: the dock covers him, not the other way round
    const others = [...document.querySelectorAll('.dz-opts .opt, .dz-msg, .dz-q, .pen-btn, .dz-guide p, .dz-guide i' + (behind ? '' : ', .dock .cta, .dock .btn'))]
      .filter(x => x.getBoundingClientRect().height && (!x.classList.contains('dz-msg') || x.textContent.trim())).map(x => x.getBoundingClientRect());
    return mine.some(a => others.some(b => a.left < b.right - 2 && a.right > b.left + 2 && a.top < b.bottom - 2 && a.bottom > b.top + 2));
  }
  function hero(name, say) {
    if (gone) return null;
    heroOff(name);
    const e = h('div', 'dz-hero dz-hero-' + name, `<img src="land/hero-${name}.webp" alt="">${say ? `<p class="dz-hero-say">${say}</p>` : ''}`);
    e.setAttribute('aria-hidden', 'true'); document.body.appendChild(e); HERO[name] = e;
    const img = e.querySelector('img');
    const place = () => { if (gone || !e.isConnected) return; if (heroClash(e)) { e.classList.add('small'); if (heroClash(e)) { e.remove(); if (HERO[name] === e) delete HERO[name]; return; } } requestAnimationFrame(() => e.classList.add('in')); };
    if (img.complete && img.naturalWidth) place(); else { img.onload = place; img.onerror = () => e.remove(); }
    cleanupFns.push(() => e.remove());
    return e;
  }
  function heroOff(name) { Object.keys(HERO).forEach(k => { if (name && k !== name) return; const e = HERO[k]; delete HERO[k]; e.classList.remove('in'); e.classList.add('out'); setTimeout(() => e.remove(), 320); }); }

  /* ---------- «جرّبه أول» ---------- */
  const doorLv = T => T.door === 'mix' ? { gen: TRY.mix, hints: D.levels[0].hints, t: T.t } : D.levels[byName(T.door)];
  function tryStart() {
    const m = mem();
    if (m.part && !m.again) return partDone();
    if (!m.try) {   // first time (or «أعد الجزء الأول»): a visitor in the middle of the old part one starts again at the door
      if (m.lv || m.pts) ['n', 'r', 's'].forEach(k => delete m[k]);
      m.lv = 0; m.pts = 0; m.k = 0; m.started = true; persist();
      return door(0);
    }
    const t = m.try;
    if (!t.path) return door(t.step || 0);
    setTrack(t.path.length + 1);
    if (t.at >= t.path.length) return boss();
    idea(t.path[t.at]);
  }
  /* one question before anything is explained. step 0: the hero says «جرّب أنت». */
  function door(step) {
    const T = TRY.steps[step], m = mem();
    m.try = { step, doors: (m.try && m.try.doors) || [] }; persist();
    setTrack(1); trLabel = step === 0 ? 'قبل ما نبدأ: جرّب هذا السؤال' : 'طيب، وهذا؟'; paintTrack(0);
    const p = page('dz-drill dz-door'); dockNone();
    const lv = doorLv(T), g = make(lv, T.k || 0);
    ask(p, g, T.t || 30, lv.hints || {}, (res, fb, used) => {
      heroOff(); firstAnswer(res); countVis(res, used);
      const t = mem().try, right = res === 'fast' || res === 'ok', fast = right && used <= TRY.fastSecs, secs = Math.max(1, Math.round(used));
      t.doors.push(right ? secs : null);
      LT(right ? (fast ? 'door_fast' : 'door_slow') : 'door_miss', { lesson: id, n: step + 1 });
      if (fast) { persist(); fb.className = 'lad-fb dz-msg ok'; fb.textContent = drT('right'); return setTimeout(() => !gone && tooEasy(step, secs), 900); }
      const path = (right ? T.short : T.long).map(byName).filter(x => x >= 0);
      Object.assign(t, { kind: right ? 'short' : 'long', a: right ? secs : null, path, at: 0, cur: null, tries: 0, doorStep: step }); persist();
      if (right) { fb.className = 'lad-fb dz-msg ok'; fb.innerHTML = `حلّيته في ${secAr(secs)}.<br>الهدف أقل من ١٠.`; }
      dockBtn('يلا', () => { trLabel = null; setTrack(path.length + 1); idea(path[0]); });
      if (!right) dockIn.insertBefore(h('p', 'dz-next', `${ar(path.length)} أفكار سريعة، ونرجع له.`), dockIn.firstChild);   // under the pen's work, above the button
    }, () => heroOff(), null, { auto: true });
    if (step === 0) hero('hi', 'أنا غلطت فيه أول مرة.<br><b>جرّب أنت.</b>');
    ['oops', 'yes', 'win', 'easy'].forEach(n => { const im = new Image(); im.src = `land/hero-${n}.webp`; });   // after the question is on screen
  }
  function tooEasy(step, secs) {
    const last = step >= TRY.steps.length - 1;
    const p = page('dz-easy', true);
    p.innerHTML = `<img class="dz-easy-hero" src="land/hero-easy.webp" alt=""><h1 class="dz-h">هذا سهل عليك.</h1><p class="dz-p">حلّيته في ${secAr(secs)}.</p>`;
    if (last) { mem().try.kind = 'strong'; persist(); dockBtn('كمّل', partDone); }
    else dockBtn('عطني أصعب', () => door(step + 1));
  }
  function tryNext() {
    const t = mem().try;
    if (t.at === 2 && t.at < t.path.length && TUN.wantSave && TUN.wantSave()) { cleanup(); lesson._resumed = true; return TUN.save(lesson); }   // «احفظ مكانك» after the 2nd level of a path
    if (t.at >= t.path.length) return boss();
    idea(t.path[t.at]);
  }
  /* the door question again, new numbers. Wrong: the pen, then one more (the last). */
  function boss() {
    const t = mem().try, T = TRY.steps[t.doorStep || 0];
    trLabel = 'نرجع لسؤال البداية'; paintTrack(t.path.length / NV);
    const p = page('dz-drill dz-boss'); dockNone();
    const lv = doorLv(T), g = make(lv, T.k || 0);
    ask(p, g, T.t || 30, lv.hints || {}, (res, fb, used) => {
      firstAnswer(res); countVis(res, used);
      if (res === 'fast' || res === 'ok') {
        t.b = Math.max(1, Math.round(used)); persist(); LT('boss_ok', { lesson: id, n: t.b });
        fb.className = 'lad-fb dz-msg ok'; fb.textContent = drT('right');
        return setTimeout(() => !gone && partDone(), 1100);
      }
      t.tries = (t.tries || 0) + 1;
      if (t.tries >= 2) { t.b = null; persist(); LT('boss_miss', { lesson: id, n: Math.round(used) }); return dockBtn('كمّل', partDone); }
      persist(); dockBtn('جرّب سؤال ثاني', boss);
    }, null, null, { auto: true });
    const fb = p.querySelector('.dz-msg'); fb.className = 'lad-fb dz-msg dz-tag'; fb.textContent = t.tries ? 'آخر محاولة، بأرقام جديدة.' : 'نفس النوع، بأرقام جديدة.';
  }

  /* a visitor finished «الجزء الأول»: no final test, the tunnel's win screen (with the price) */
  function partDone() {
    const m = mem(); m.part = true; delete m.again; if (!TRY) m.lv = NV; persist();
    LT('part_done', { lesson: id, n: Math.round(m.s || 0), val: (m.r || 0) + '/' + (m.n || 0) });
    FX.play('finish');
    cleanup(); TUN.win(lesson);
  }

  /* the final test: real exam level, mixed skills, more time per question */
  function finalIntro() {
    paintTrack(1);
    const p = page('dz-final-intro', true);
    p.innerHTML = `<h1 class="dz-big">الاختبار<br>النهائي</h1><div class="dz-line"></div><p class="dz-p">${drT('final_intro')}. ${ar(D.final.length)} أسئلة بمستوى القدرات، ومحاولة وحدة لكل سؤال.</p>`;
    dockBtn('ابدأ الاختبار', () => final(0, 0));
  }
  function final(i, got) {
    if (i >= D.final.length) return finished(got);
    const p = page('dz-drill dz-final');
    const s = D.final[i];
    const g = { q: s.q, a: s.a, b: s.b, fig: s.fig, opts: s.choices.map((c, ci) => ({ v: c, key: ci === s.answer ? null : 'final' })) };
    dockNone();
    ask(p, g, D.finalT || 40, { final: '' }, (res, fb) => {
      const ok = res === 'fast' || res === 'ok';
      LT('drill_final', { lesson: id, n: i + 1, val: ok ? 'ok' : res });
      if (ok) { fb.className = 'lad-fb dz-msg ok'; fb.textContent = drT('right'); }
      else fb.innerHTML += s.why ? `<br><span class="dz-why">${fmt(s.why)}</span>` : '';
      dockBtn(i + 1 < D.final.length ? 'السؤال التالي' : 'النتيجة', () => final(i + 1, got + (ok ? 1 : 0)));
    });
    // in the final the first wrong pick ends the question: lock the rest and show the right one
    p.querySelectorAll('.opt').forEach((b, ci) => b.addEventListener('click', () => {
      if (g.opts[ci].key == null) return;
      stopT(); p.classList.add('answered'); p.querySelectorAll('.opt').forEach((x, cj) => { x.disabled = true; if (g.opts[cj].key == null) x.classList.add('ok'); });
      const fb = p.querySelector('.dz-msg'); fb.className = 'lad-fb dz-msg bad'; fb.innerHTML = s.why ? fmt(s.why) : '';
      LT('drill_final', { lesson: id, n: i + 1, val: 'wrong' });
      dockBtn(i + 1 < D.final.length ? 'السؤال التالي' : 'النتيجة', () => final(i + 1, got));
    }));
  }
  function finished(got) {
    const n = D.final.length, stars = got === n ? 3 : got >= n - 2 ? 2 : 1;
    const first = !S.done[id];
    mem().finished = true; mem().lv = N; S.done[id] = true; S.stars[id] = Math.max(S.stars[id] || 0, stars);
    const rank = addXP(first ? 20 : 5); bumpStreak(); persist();
    LT('lesson_done', { lesson: id, n: stars, val: 'drill' });
    paintTrack(1);
    const p = page('dz-done lad-end', true);
    p.innerHTML = `<div class="dz-ring">${SVG_OK}</div><h1 class="dz-h">${got === n ? drT('final_all_right') : `حلّيت ${ar(got)} من ${ar(n)}`}</h1><p class="dz-p">${got === n ? 'هذي أسئلة بمستوى القدرات، وحلّيتها في الوقت.' : drT('final_some_wrong')}</p>`;
    if (stars === 3) { FX.play('finish'); FX.confetti(60); } else FX.play('task');
    dockBtn(TUN && TUN.next && !TUN.next(lesson) ? 'رجوع إلى الدروس' : 'الدرس التالي', toGate, ['تدريب مفتوح', () => open(0)]);   // the button says where it goes (owner, 14 Nov 2026)
    void rank;   // no rank pop-up here: the next door is the reward
  }

  /* open training / quick review: mixed questions from every level, no end (or `limit` questions) */
  function open(k, limit, got = 0) {
    if (limit && k >= limit) return reviewed(got, limit);
    const c = [0, 1, 2].map(() => Math.floor(Math.random() * NV)), i = c.reduce((a, b) => sk(id, b).p < sk(id, a).p ? b : a), lv = D.levels[i];   // of three ideas picked at random, the one he is weakest at
    paintTrack(1);
    const p = page('dz-drill');
    dockNone();
    /* open training has no end of its own: a quiet button says how to stop, so nobody wonders */
    const stop = ['إنهاء التدريب', () => { LT('open_end', { lesson: id, n: k }); toDoor(); }];
    if (!limit) { dock.className = 'dock'; const e = h('button', 'btn lad-alt', stop[0]); e.onclick = () => { FX.play('tap'); stop[1](); }; dockIn.appendChild(e); }
    ask(p, make(lv, 2 + Math.floor(Math.random() * 4)), lv.t, lv.hints || {}, (res, fb) => {
      const ok = res !== 'miss' && res !== 'time';
      learn(sk(id, i), res); persist();
      if (ok) { fb.className = 'lad-fb dz-msg ok'; fb.textContent = res === 'fast' ? drT('fast') : drT('right'); setTimeout(() => !gone && open(k + 1, limit, got + 1), 800); }
      else if (res === 'time') setTimeout(() => !gone && open(k + 1, limit, got), 1600);
      else dockBtn('التالي', () => open(k + 1, limit, got), limit ? null : stop);
    });
  }
  function reviewed(got, n) {
    const p = page('dz-done', true);
    p.innerHTML = `<div class="dz-ring">${SVG_OK}</div><h1 class="dz-h">${got === n ? drT('review_all_right') : drT('review_some_wrong')}</h1><p class="dz-p">${ar(got)} من ${ar(n)}</p>`;
    dockBtn('تدريب مفتوح', () => open(0), [TUN ? 'رجوع إلى الدروس' : 'الدرس التالي', TUN ? toDoor : toGate]);   // «back» goes back (it used to open the next lesson's door)
  }

  /* where to start */
  const m = mem(), m0 = m;
  if (lesson._drillMode === 'open') { lesson._drillMode = null; open(0); }   // the gate's "open training"
  else if (m.finished) {   // finished THIS lesson before (an old version's "done" doesn't count): he chooses
    paintTrack();
    const p = page('dz-done', true);
    p.innerHTML = `<div class="dz-ring">${SVG_OK}</div><h1 class="dz-h">خلّصت هذا الدرس قبل</h1><p class="dz-p">راجع بخمسة أسئلة سريعة، أو ابدأه من أوله.</p>`;
    dockBtn('مراجعة سريعة', () => open(0, 5), ['ابدأ الدرس من أوله', () => { S.drill[id] = { lv: 0, pts: 0, k: 0, started: true, finished: true, v: D.v || 1 }; persist(); idea(0); }]);
  }
  else if (TRY) tryStart();
  else if (VIS && m.lv >= NV) partDone();
  else if (m.lv >= N) finalIntro();
  else if (TUN) { m.started = true; persist(); idea(m.lv); }   // the tunnel's door already said everything: straight to the first idea (no warm-up: reviews come between levels)
  else startScreen(!!(m.started && (m.lv || m.pts)));
}

/* The teacher's pen: after a wrong pick, a green pen circles, underlines and writes the working on the student's own question.
   A question may carry g.show = [['circle', text, nth?], ['under', text, nth?], ['strike', text, nth?], ['arrow', fromText, toText], ['write', text]].
   Texts are written as in the question source (2, ³, ×…); they are matched against what is on screen (Arabic digits, superscripts).
   LeenaPen.play(stage, g, { onTick, onSkip }) → Promise, resolves when the drawing is done (or skipped). Plan: docs/PEN_PLAN.md
   For a show-piece (the landing page): { free: true } a tap does not skip it; { after: promise } the lines take their place at once,
   and the first stroke waits for the promise (then everything is measured again, in case the font arrived late). */
(() => {
  const NS = 'http://www.w3.org/2000/svg', AR = '٠١٢٣٤٥٦٧٨٩', SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  const MOVE = 0.5, WRITE = 0.75, GAP = 0.15, ARROW = 0.4;
  const quiet = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };

  /* ---- finding a text in the question ---- */
  // what the student sees, one character per entry, with where it lives in the page; digits inside <sup> become ⁰¹²…
  function chars(root) {
    const out = [], w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let part = null;
    while (w.nextNode()) {
      const n = w.currentNode, sup = !!(n.parentNode && n.parentNode.closest('sup')), v = n.nodeValue;
      // the top and the bottom of a stacked fraction are two numbers, not one: keep a gap between them
      const fp = n.parentNode && n.parentNode.closest('.fr > span');
      if (fp !== part && (fp || part) && out.length) out.push({ c: '|', n, i: 0 });
      part = fp;
      for (let i = 0; i < v.length; i++) {
        let c = v[i];
        if (/[\s⁦-⁩‎‏]/.test(c)) continue;
        const d = AR.indexOf(c); if (d >= 0 && sup) c = SUP[d];
        out.push({ c, n, i });
      }
    }
    return out;
  }
  // the script's text in the same form: Arabic digits, superscripts kept, no spaces, − for minus
  const norm = t => String(t).replace(/(\d)\.(?=\d)/g, '$1٫').replace(/[\s`]/g, '').replace(/-/g, '−').replace(/\*/g, '×').replace(/[0-9]/g, d => AR[d]);
  const isDig = c => c != null && (AR.includes(c) || SUP.includes(c));
  const sameKind = (a, b) => isDig(a) && isDig(b) && SUP.includes(a) === SUP.includes(b);
  function find(roots, text, nth = 1) {
    const t = norm(text); if (!t) return null;
    let seen = 0;
    for (const root of roots) {

  /* ---- play ---- */
  function play(stage, g, o = {}) {
    const steps = (g.show || []).filter(s => Array.isArray(s) && s.length);
    if (!steps.length) return Promise.resolve(false);

    // the working lines go in first (hidden), so nothing moves once the pen starts

    let work = null;
    if (writes.length) {
      work = document.createElement('div'); work.className = 'pen-work';
      work.innerHTML = writes.map(s => `<div class="pen-w"><span>${typeof fmt === 'function' ? fmt('`' + s[1] + '`') : s[1]}</span></div>`).join('');

/* Idea slides in motion (docs/MOTION_PLAN.md). A level may carry `motion`: 2 to 4 frames, each one line of maths.
   In a frame, {name:text} is a piece that keeps its identity between frames: it MOVES to its new place. Text outside braces
   fades out and in. {name:^text} = written as an exponent. {name:text!} = green. {r<a,b:text} = a new piece that grows from
   where a and b were in the frame before.
   LeenaMotion.play(el, frames) → a Promise (resolves at the end) with .skip() and .replay(). LeenaMotion.still(el, frames) = last frame.
   Lives inside the course bundle (after core.js), so fmt() is in scope. */
(() => {
  const HOLD = 0.6, MOVE = 0.6, IN = 0.3;
  const quiet = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
  const ease = x => { x = Math.max(0, Math.min(1, x)); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  const mix = (a, b, k) => a + (b - a) * k;
  const html = t => typeof fmt === 'function' ? (/[ء-ي]/.test(t) && !/\d/.test(t) ? fmt(t) : fmt('`' + t + '`')) : t;

  /* '{a:2}{x:^3} × {b:2}' → [{name:'a', text:'2'}, {name:'x', sup:true, text:'3'}, {text:' × '}, {name:'b', text:'2'}] */
  function parse(f) {
    const out = [], re = /\{([a-z0-9]+)(?:<([a-z0-9,]+))?:(\^)?([^}]*?)(!)?\}/g;
    let at = 0, m;
    const plain = s => { if (s.trim()) out.push({ text: s.trim() }); };
    while ((m = re.exec(f))) { plain(f.slice(at, m.index)); out.push({ name: m[1], from: m[2] ? m[2].split(',') : null, sup: !!m[3], text: m[4], green: !!m[5] }); at = re.lastIndex; }
    plain(f.slice(at));
    return out;
  }
  // an exponent piece is drawn as a real superscript on the LEFT of its base, the Arabic way (any sign works: + − ×); everything else through the site's own maths
  const pieceHTML = p => p.sup ? `<span class="m"><sup>${typeof ar === 'function' ? ar(String(p.text).replace(/-/g, '−')) : p.text}</sup></span>` : html(p.text);

  /* lay every frame out invisibly with the site's own maths, read where each piece sits */
  function measure(el, frames) {
    const box = el.getBoundingClientRect(), meas = document.createElement('div');
    meas.className = 'mo-meas'; el.appendChild(meas);
    const rows = frames.map(items => {
      const row = document.createElement('div'); row.className = 'mo-row'; row.dir = 'rtl';
      // a number and the exponents right after it stay together, left to right (٢³), like everywhere on the site; the line itself reads right to left
      const groups = [];
      items.forEach((p, k) => { const span = `<span class="mo-p" data-k="${k}">${pieceHTML(p)}</span>`; if (p.sup && groups.length && !groups[groups.length - 1].paren) groups[groups.length - 1].push(span); else { const g = [span]; g.paren = !p.name && /^[()]$/.test(p.text) ? p.text : null; groups.push(g); } });
      // brackets hug what is inside them; everything else gets a space
      row.innerHTML = groups.map((g, gi) => (gi && !(groups[gi - 1].paren === '(' || g.paren === ')') ? ' ' : '') + (g.length > 1 ? `<span class="mo-pw" dir="rtl">${g.join('')}</span>` : g[0])).join('');
      meas.appendChild(row); return row;
    });
    const maxW = Math.max(...rows.map(r => r.scrollWidth)), avail = Math.max(120, box.width - 8);
    const scale = maxW > avail ? avail / maxW : 1;
    if (scale < 1) meas.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * scale) + 'px';
    const H = Math.max(...rows.map(r => r.getBoundingClientRect().height));
    const out = rows.map((row, f) => {

      return frames[f].map((p, k) => { const b = row.querySelector(`[data-k="${k}"]`).getBoundingClientRect();

      } else {
        const a = { html: pieceHTML(p), h0: p.h, w0: p.w, kf: [] }; actors.push(a);
        const t0 = f ? T(f) - MOVE_ * 0.5 : 0, sc = s;
        a.kf.push([t0, p.cx, p.cy, 0, sc, p.green ? 1 : 0], [T(f), p.cx, p.cy, 1, sc, p.green ? 1 : 0], [T(f) + HOLD_, p.cx, p.cy, 1, sc, p.green ? 1 : 0]);
        if (f < n - 1) a.kf.push([T(f) + HOLD_ + MOVE_ * 0.5, p.cx, p.cy, 0, sc, p.green ? 1 : 0]);

  }

  }

  function play(el, frames, o = {}) {
    const parsed = (frames || []).map(parse).filter(x => x.length);

    el.classList.add('mo-box');
    let P, layer, raf = 0, t0 = null, done = false, resolve, t = 0;
    const build = () => {

      P = plan(L);

      P.actors.forEach(a => { const s = document.createElement('span'); s.className = 'mo-a'; s.innerHTML = a.html; layer.appendChild(s); a.el = s; });
    };
    const paint = tt => P.actors.forEach(a => { const [, cx, cy, op, sc, g] = state(a.kf, tt);
      a.el.style.opacity = op.toFixed(3); a.el.style.transform = `translate(${(cx - a.w0 / 2).toFixed(1)}px,${(cy - a.h0 / 2).toFixed(1)}px) scale(${sc.toFixed(3)})`;
      a.el.style.color = g > 0.5 ? 'var(--mo-green, #1F7A5A)' : ''; });
    const finish = () => { if (done) return; done = true; cancelAnimationFrame(raf); t = P.end; paint(t); el.classList.add('mo-done'); resolve && resolve(true); };
    const frame = now => { if (done) return; if (t0 == null) t0 = now; t = (now - t0) / 1000; paint(t);
      if (t >= P.end) return finish(); raf = requestAnimationFrame(frame); };

  window.LeenaMotion = { play, still, parse };
})();

/* ================= unit 1 · lesson 1 «قوانين الأسس» as a drill (learning by doing) =================
   Every new idea is its own level with its own explanation card. Inside a level the numbers only get bigger:
   gen(k) gets k = how many he answered right in this level (a miss keeps the same k, with a new question).
   Every wrong choice is a real mistake with its own hint. */
(() => {
  const L = BUILT.fast.lessons.find(l => l.id === 'fs1'); if (!L) return;
  const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const T = (k, list) => list[Math.min(k, list.length - 1)];          // the notch for k right answers
  const sp = n => String(n).split('').map(c => c === '-' ? '⁻' : c === '+' ? '⁺' : '⁰¹²³⁴⁵⁶⁷⁸⁹'[c]).join('');
  const P = (b, e) => `${b}${sp(e)}`;
  const m_ = s => '`' + s + '`';
  const rep = (b, e, op = ' × ') => Array(e).fill(b).join(op);
  const near = a => [[a + 1, 'count'], [a + 2, 'count'], [a > 2 ? a - 1 : a + 3, 'count']];
  const CMP3 = ['الأولى أكبر', 'الثانية أكبر', 'متساويتان'];
  const cmpQ = (a, b, x, y, hint) => {
    const ans = Math.abs(x - y) < 1e-12 * Math.max(x, y) ? CMP3[2] : x > y ? CMP3[0] : CMP3[1];
    return { q: 'قارن بين:', a: m_(a), b: m_(b), ans, fixed: CMP3, wr: CMP3.filter(c => c !== ans).map(c => [c, ans === CMP3[2] ? 'neq' : c === CMP3[2] ? 'eq' : hint]) };
  };

  /* the three ways to ask about one power: its value, how many times we multiply, what it means */
  const times = e => e === 2 ? 'مرتين' : e + ' مرات';
  /* the teacher's pen (docs/PEN_PLAN.md): circle each text, counting repeats so the 2nd «³» gets nth 2 */

(function () {

  const toast = msg => { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = el('div', 'toast', esc(msg)); document.body.appendChild(t); setTimeout(() => t.remove(), 3000); };
  const fmtDate = d => { const [y, m, dd] = String(d).split('-'); return ar(`${+dd}/${+m}/${y}`); };

      const u = box.querySelector('#lg-user').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, ''), p = box.querySelector('#lg-pass').value;
      const { error } = await sb.auth.signInWithPassword({ email: u + '@leena.academy', password: p });
      LT(error ? 'login_fail' : 'login_ok');
      if (error) { err.textContent = /invalid/i.test(error.message) ? 'اسم المستخدم أو كلمة المرور غير صحيحة.' : 'ما قدرنا ندخّلك الحين. تأكد من الإنترنت، وجرّب مرة ثانية.'; err.hidden = false; go.disabled = false; go.querySelector('span').textContent = 'دخول'; return; }
      go.querySelector('span').textContent = 'نفتح دروسك…';
      try { await load(); } catch (e2) { console.warn(e2); }
      m.remove(); toast(A.access.some(a => a.expires >= today()) ? `أهلًا ${A.user.name || A.user.username}، دروسك مفتوحة` : 'دخلت، بس ما فيه اشتراك فعّال في حسابك');
      window.Academy.home();
    };
  }
  function showAccount() {
    if (!A.user) return openLogin();
    const names = { 'qudurat-quant': 'القدرات: الكمّي' };
    const rows = A.access.length ? A.access.map(a => { const on = a.expires >= today(); return `<li class="${on ? 'on' : 'off'}"><b>${esc(names[a.course] || a.course)}</b><small>${on ? 'مفتوحة حتى ' : 'انتهت في '}${fmtDate(a.expires)}</small></li>`; }).join('') : '<li class="off"><b>ما فيه اشتراك في حسابك</b></li>';
    const ending = A.access.find(a => a.course === 'qudurat-quant'), soon = !ending || ending.expires < new Date(Date.now() + 14 * 864e5).toISOString().slice(0, 10);
    const who = A.user.phone ? `<bdi dir="ltr">+${esc(A.user.phone)}</bdi>` : `<bdi dir="ltr">${esc(A.user.username)}</bdi>`;
    const { m, box } = modal(`<h2>حسابي</h2><p class="acct-sub">${esc(A.user.name || '')} · ${who}</p><ul class="acct-list">${rows}</ul>
      <div class="acct-acts">${A.payOn && soon ? `<button class="play-btn acct-renew"><span>${ending ? 'جدّد الاشتراك' : 'اشترك'}</span></button>` : ''}
      ${WA ? `<a class="ghost-btn acct-wa" target="_blank" rel="noopener" href="${wa('السلام عليكم، حسابي في أكاديمية لينا: ' + A.user.username + '\nعندي سؤال.')}"><span>مساعدة على واتساب</span></a>` : ''}
      <button class="ghost-btn acct-out"><span>تسجيل الخروج</span></button></div>`);
    box.querySelector('.acct-out').onclick = () => { m.remove(); logout(); };
    const rb = box.querySelector('.acct-renew'); if (rb) rb.onclick = () => { m.remove(); A.join('renew'); };
  }
  async function logout() { await sb.auth.signOut(); location.reload(); }

  if (document.querySelector('#app .tun:not(.tun-wait)')) window.Academy.home();   // the door was drawn before this file ran: draw it again with its login link
  start();
})();
