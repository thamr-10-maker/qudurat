<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أكاديمية لينا | قدرات</title>
<meta name="description" content="تحضير لاختبار القدرات، القسم الكمّي. تتدرّب بالحل، وتعرف سبب كل خطأ فورًا. اشتراك شهر، وتسترجع مبلغك خلال ٣ أيام بدون سبب.">
<meta name="theme-color" content="#0D5A4A">
<meta property="og:type" content="website">
<meta property="og:title" content="أكاديمية لينا | قدرات">
<meta property="og:description" content="تدرّب على كمّي القدرات بالحل، واعرف سبب كل خطأ فورًا. وإن لم يعجبك، استرجع مبلغك خلال ٣ أيام.">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@200;300;400;500;600;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
/* Layout: a calm, serious exam-prep app for 17–18 year olds. Phone first.
   Home = dashboard (predicted score → continue → today → units). Unit page = ordered lesson list.
   Lessons: explanation card → interactive figure → tasks; questions styled like the answer sheet (bubbles أ ب ج د). */
:root{
  /* Layout: a premium study library. Home = billboard for the one next lesson, then horizontal rails
     (the current unit, every unit as a poster, practice). Posters are deep jewel tones with a large engraved glyph. */
  --brand-base:#0E5E4E;
  --bg:#F1F2EF; --bg-2:#E5E8E4; --card:#FFFFFF; --ink:#0E1513; --ink-2:#55605B; --ink-3:#8A938F; --line:#DCE0DB;
  --brand:var(--brand-base); --brand-soft:color-mix(in srgb,var(--brand) 9%,var(--card)); --on-brand:#FFFFFF;
  --accent:#2F5D8A; --accent-ink:#0E2238; --accent-soft:#E6EDF4; --flame:#B5532A;
  --ok:#14805A; --ok-soft:#E2F2EA; --bad:#B83A3A; --bad-soft:#F8E6E4;
  --d1:#2E5BAE; --d2:#B05A2C; --d3:#6648AE; --d4:#167A61; --d5:#AA3F45; --d6:#4E7E2C;
  --d7:#3F5A8C; --d8:#17788F; --d9:#94457A; --d10:#A34560; --d11:#0E5E4E;
  /* poster jewels: identical in both themes, they are images */
  --p1:#1D3C80; --p2:#83391E; --p3:#47297D; --p4:#0D5A4A; --p5:#74202B; --p6:#30521E;
  --p7:#283D63; --p8:#0C5061; --p9:#5B1E52; --p10:#69213D; --p11:#11342D;
  --poster-ink:#FFFFFF; --poster-btn:#FFFFFF; --poster-btn-ink:#0E1513;
  --theme:var(--brand);
  --shape:var(--theme); --shape-soft:color-mix(in srgb,var(--theme) 22%,transparent);
  --shape-2:#B05A2C; --shape-2-soft:color-mix(in srgb,#B05A2C 26%,transparent);
  --c1:#2F5D8A; --c2:var(--brand); --c3:#14805A; --c4:#2E5BAE; --c5:#A34560;
  --win:#DCE6F2; --roof:#2A3140;
  --r-lg:18px; --r-md:14px; --r-sm:10px;
  --f-display:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Alexandria",Tahoma,"Segoe UI",sans-serif;
  --shadow:0 1px 1px rgba(14,21,19,.04),0 8px 24px -12px rgba(14,21,19,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#090E0D; --bg-2:#141B19; --card:#101715; --ink:#ECEFEC; --ink-2:#A1ABA7; --ink-3:#6B7571; --line:#212A27;
  --brand:color-mix(in srgb,var(--brand-base) 50%,#DDF7EE); --brand-soft:color-mix(in srgb,var(--brand) 14%,var(--card)); --on-brand:#08100E;
  --accent:#8DB2DA; --accent-ink:#0B1826; --accent-soft:#16202B; --flame:#E07B4E;
  --ok:#3BBE88; --ok-soft:#10261D; --bad:#EA6B66; --bad-soft:#311918;
  --d1:#7EA2E6; --d2:#E0946A; --d3:#A890E6; --d4:#4FC3A0; --d5:#E37C80; --d6:#9BC46E;
  --d7:#8EA6D6; --d8:#5BB8CF; --d9:#D686BC; --d10:#E38AA4; --d11:#4FC3A0;
  --win:#2A3442; --roof:#0A0D12; --shadow:none;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090E0D; --bg-2:#141B19; --card:#101715; --ink:#ECEFEC; --ink-2:#A1ABA7; --ink-3:#6B7571; --line:#212A27;
  --brand:color-mix(in srgb,var(--brand-base) 50%,#DDF7EE); --brand-soft:color-mix(in srgb,var(--brand) 14%,var(--card)); --on-brand:#08100E;
  --accent:#8DB2DA; --accent-ink:#0B1826; --accent-soft:#16202B; --flame:#E07B4E;
  --ok:#3BBE88; --ok-soft:#10261D; --bad:#EA6B66; --bad-soft:#311918;
  --d1:#7EA2E6; --d2:#E0946A; --d3:#A890E6; --d4:#4FC3A0; --d5:#E37C80; --d6:#9BC46E;
  --d7:#8EA6D6; --d8:#5BB8CF; --d9:#D686BC; --d10:#E38AA4; --d11:#4FC3A0;
  --win:#2A3442; --roof:#0A0D12; --shadow:none;
  color-scheme:dark}

html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.35;text-wrap:balance;font-weight:600}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
.ic{flex:none;display:inline-block;vertical-align:middle}
.eyebrow{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);letter-spacing:.2px}
.dim{color:var(--ink-2)}.small{font-size:13px;margin-top:14px}

/* math */
.m{direction:rtl;unicode-bidi:isolate;display:inline-block;white-space:nowrap;font-variant-numeric:tabular-nums;font-family:var(--f-display);font-weight:500;letter-spacing:.2px}
.m .mo{color:var(--theme);font-weight:400;margin:0 .12em}
.sq{position:relative;display:inline-flex;align-items:stretch;direction:rtl;unicode-bidi:isolate;vertical-align:-.15em}
.sq .rad{display:block;width:.55em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;overflow:visible}
.sq .rc{border-top:2px solid currentColor;padding:.08em 3px 0;line-height:1.2;margin-right:-1px}
sup{font-size:.62em;line-height:0;direction:rtl;unicode-bidi:isolate;margin-inline-start:.06em}   /* Arabic maths: the power sits up on the LEFT of its base (owner, 14 Nov 2026). Isolated, so a digit power does not join a digit base into one number read the other way */
.pw{direction:rtl;unicode-bidi:isolate;display:inline-block;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.12;font-size:.95em;margin:0 3px;font-variant-numeric:tabular-nums;font-family:var(--f-display);font-weight:600}
.fr>span{padding:0 4px}
.fr>span:first-child{border-bottom:2.5px solid currentColor;border-radius:1px;padding-bottom:1px}
.fr>span:last-child{padding-top:1px}
.mx{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;font-family:var(--f-display);font-weight:600;font-size:1.08em}
.mx .fr{font-size:.88em}

/* ---------- top bar ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:8px;padding-block:10px;border-bottom:1px solid transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.hud .title{font-family:var(--f-display);font-weight:600;font-size:18px;flex:1;min-width:0;line-height:1.25;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .sec{display:block}
.rank{font-size:12px;color:var(--ink-2);display:block;line-height:1.3;font-family:var(--f-body);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink-2)}
.pill.flame.on{color:var(--flame)}
.pill.gem{color:var(--accent)}
.pill span{color:var(--ink)}
.ibtn{width:36px;height:36px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.ibtn.off{opacity:.5}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--brand);color:var(--on-brand);font-family:var(--f-display);font-weight:600;font-size:17px}
.xbtn{width:38px;height:38px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--ink-2);flex:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:var(--r-md);padding:11px 14px;font-weight:600;font-size:15.5px;
  background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn small{font-weight:500;opacity:.8;font-size:12.5px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled){transform:translateY(1px)}

/* ---------- home ---------- */
.home{padding-block:4px 40px;display:flex;flex-direction:column;gap:12px}
.hello{margin:2px 0 0;color:var(--ink-2);font-size:15px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.scorepanel{display:flex;align-items:center;gap:16px}
.scorepanel.start{display:block;border-color:color-mix(in srgb,var(--brand) 35%,var(--line));background:linear-gradient(var(--brand-soft),var(--card))}
.scorepanel h2{font-size:21px;margin:2px 0 4px}
.sp-body{flex:1;min-width:0}
.sp-line{margin:2px 0 10px;font-size:14.5px;color:var(--ink-2);line-height:1.6}
.sp-line b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:500;border-radius:999px;padding:3px 10px;background:var(--bg-2);color:var(--ink)}
.mchip.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2)}
.ring{--p:0;width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-content:center;text-align:center;
  background:radial-gradient(closest-side,var(--card) 82%,transparent 84% 100%),conic-gradient(var(--brand) calc(var(--p)*1%),var(--bg-2) 0)}
.ring b{font-family:var(--f-display);font-size:21px;font-weight:600;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.ring small{font-size:11px;color:var(--ink-2);line-height:1.2}
.ring.big{width:108px;height:108px}.ring.big b{font-size:32px}
.continue{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;box-shadow:var(--shadow)}
.continue .cbody{flex:1;min-width:0}
.continue small{display:block;color:var(--ink-2);font-size:12.5px}
.continue b{display:block;font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.4}
.gobtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--on-brand);flex:none}
.uic{white-space:nowrap;width:46px;height:46px;border-radius:var(--r-md);display:grid;place-items:center;flex:none;font-family:var(--f-display);font-weight:600;font-size:17px;
  color:var(--theme);background:color-mix(in srgb,var(--theme) 11%,var(--card));border:1px solid color-mix(in srgb,var(--theme) 22%,var(--line))}
.uic.big{width:60px;height:60px;font-size:22px;border-radius:var(--r-lg)}
.today .goal{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 14px}
.gtop{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2)}
.gtop b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--bg-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;color:var(--brand)}
.act b{font-size:13.5px;line-height:1.35;color:var(--ink);font-weight:600}.act small{font-size:11.5px;color:var(--ink-2);line-height:1.35}
.act.hot{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.act.hot small{color:var(--bad);font-weight:600}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:8px}
.sechead h3{font-size:17px}
.sechead small{color:var(--ink-2);font-size:12.5px}
.units{display:flex;flex-direction:column;gap:8px}
.unit{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px}
.unit:active,.continue:active,.act:active,.lrow:active:not(.locked){background:var(--bg-2)}
.ubody{flex:1;min-width:0;display:block}
.ubody b{display:block;font-family:var(--f-display);font-weight:600;font-size:16.5px;line-height:1.4}
.umeta{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.ubar{display:block;height:4px;border-radius:2px;background:var(--bg-2);overflow:hidden;margin-top:6px}
.ubar i{display:block;height:100%;background:var(--theme);border-radius:2px}
.okc{color:var(--ok);display:inline-flex;align-items:center;gap:2px}
.chev{color:var(--ink-3);flex:none}
.unit.exam .uic{color:var(--brand);background:var(--brand-soft)}

/* ---------- unit page ---------- */
.unitpage{padding-block:4px 40px;display:flex;flex-direction:column;gap:12px}
.uhead{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--theme);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.uh-body{flex:1;min-width:0}
.uhead h2{font-size:22px;margin:2px 0}
.uhead p{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink-2)}
.uhead .ubar{height:6px;margin-top:12px}
.ustats{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:13px;color:var(--ink-2)}
.ustats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.dbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note-box{display:flex;gap:10px;align-items:flex-start;background:var(--brand-soft);border-radius:var(--r-md);padding:12px 14px;font-size:14.5px;line-height:1.65;color:var(--ink)}
.note-box .ic{color:var(--brand);margin-top:3px}
.lessons{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:12px 14px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .num{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:15px;
  border:1.5px solid var(--line);color:var(--ink-2);font-variant-numeric:tabular-nums}
.lrow.done .num{background:var(--theme);border-color:var(--theme);color:var(--card)}
.lrow.current .num{border-color:var(--theme);color:var(--theme);box-shadow:0 0 0 3px color-mix(in srgb,var(--theme) 18%,transparent)}
.lrow.locked{cursor:default}.lrow.locked .lbody{opacity:.55}.lrow.locked .num{color:var(--ink-3)}
.lbody{flex:1;min-width:0}
.lbody b{display:block;font-weight:600;font-size:15.5px;line-height:1.45}
.lbody small{display:block;color:var(--ink-2);font-size:12.5px;line-height:1.45}
.lrow.test .num{border-radius:var(--r-sm)}
.lrow.test{background:color-mix(in srgb,var(--theme) 5%,var(--card))}
.lscore{font-family:var(--f-display);font-weight:600;color:var(--theme);font-variant-numeric:tabular-nums}
.startc{font-size:12.5px;font-weight:600;color:var(--on-brand);background:var(--theme);border-radius:999px;padding:2px 12px;flex:none}
.dots{display:inline-flex;gap:4px;flex:none}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots.big{gap:8px;margin:6px 0 2px}.dots.big i{width:11px;height:11px}

/* ---------- lesson player ---------- */
.player{min-height:100vh;display:flex;flex-direction:column}
.ptop{display:flex;align-items:center;gap:10px;padding-block:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:4}
.pbar{flex:1;height:6px;background:var(--bg-2);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--theme);border-radius:3px;transition:width .35s}
.ptimer{font-weight:600;font-variant-numeric:tabular-nums;min-width:52px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:1px 8px;font-size:14px}
.ptimer.low{color:var(--bad);border-color:var(--bad)}
.combo{display:inline-flex;align-items:center;gap:2px;font-weight:600;color:var(--flame);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ptitle{padding-block:0 6px}
.ptitle small{display:block;color:var(--ink-2);font-size:12px}
.ptitle b{font-family:var(--f-display);font-weight:600;font-size:16px}
.pbody{flex:1;padding-block:4px 260px}
.lead{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;margin:4px 0 10px}
.lead .say{font-size:17px;line-height:1.85}
.say b{color:var(--ink);font-weight:600}
.listen{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--bg-2);border-radius:999px;padding:3px 10px;margin-top:8px}
.listen.on{background:var(--brand);color:var(--on-brand)}
.hl{background:var(--accent-soft);border-radius:6px;padding:0 4px}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r-md);padding:12px 14px;margin:10px 0;font-size:15px;line-height:1.7}
.tip .ic{color:var(--accent);margin-top:3px}
.stage{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--theme);border-radius:var(--r-lg);margin:8px 0 10px;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.readout{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px;border-top:1px solid var(--line);font-size:15px;background:color-mix(in srgb,var(--theme) 5%,var(--card))}
.readout .r{background:var(--card);border-radius:var(--r-sm);padding:3px 10px;border:1px solid var(--line)}
.readout b{font-variant-numeric:tabular-nums;font-size:17px;direction:rtl;unicode-bidi:isolate;display:inline-block;color:var(--theme)}

.slider{display:grid;grid-template-columns:auto 1fr auto auto;grid-template-areas:"lab lab lab lab" "minus range plus out";align-items:center;gap:4px 8px;padding:8px 12px;border-top:1px solid var(--line)}
.slider label{grid-area:lab;font-size:13px;color:var(--ink-2);font-weight:500}

.slider .nb{width:34px;height:34px;border-radius:var(--r-sm);background:var(--bg-2);border:1px solid var(--line);font-size:18px;font-weight:600;line-height:1}
.slider .nb.minus{grid-area:minus} .slider .nb.plus{grid-area:plus}

/* svg shapes */

.s-ok{fill:var(--ok)} .s-unit{fill:var(--shape-soft);stroke:var(--shape);stroke-width:1.5}
.s-face1{fill:var(--shape-soft);stroke:var(--shape);stroke-width:2}

@media (prefers-reduced-motion:no-preference){
  .pulse{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}

}

/* questions: options look like the bubbles of the real answer sheet */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;margin:4px 0 12px;position:relative}

.opt .ot{flex:1;min-width:0}

.opt.sel .k{background:var(--theme);border-color:var(--theme);color:var(--card)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)} .opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}

.again-tag{display:inline-block;font-size:12px;background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:1px 10px;margin-bottom:6px;font-weight:600}

.hintbox{background:var(--accent-soft);border-radius:var(--r-md);padding:10px 12px;margin:8px 0 0;font-size:15px;line-height:1.7}

/* bottom dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);border-top:1px solid var(--line)}

/* finish */

.finish .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;width:100%}
.review{text-align:start;margin-top:14px;width:100%}
.review h3,.bdown h3{font-size:17px;margin-bottom:6px}
.rv{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;margin:8px 0;font-size:14px}

  background:var(--ink);color:var(--bg);border-radius:var(--r-md);padding:8px 16px;font-weight:500;font-size:14.5px;max-width:90vw;text-align:center}

/* number town widgets */
.digs{display:flex;justify-content:center;gap:10px;padding:16px 10px;direction:ltr}

@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.note{text-align:center;padding:0 12px 12px;color:var(--ink-2);font-size:15px;min-height:1.8em}
.sieve{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:10px;direction:ltr}

.list{padding:6px 12px;font-size:14px;line-height:2;border-top:2px solid var(--line)}

.divtab{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;padding:10px}

.field{display:block;margin:10px 0}

.switch{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:var(--bg-2);border:1px solid var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}

.rrow{display:grid;grid-template-columns:minmax(76px,auto) 1fr;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);font-size:15.5px;line-height:1.7}

.rnote{display:flex;gap:8px;align-items:flex-start;margin:10px 0 0;font-size:14.5px;color:var(--ink-2)}
.rnote .ic{color:var(--accent);margin-top:3px}
.qcard.check{border-color:color-mix(in srgb,var(--theme) 35%,var(--line))}
.qcard.check .kick{display:inline-flex;align-items:center;gap:4px;color:var(--theme)}
.checkfb{display:flex;gap:8px;align-items:flex-start;border-radius:var(--r-md);padding:10px 12px;margin-top:10px;font-size:15px;line-height:1.7}
.checkfb.ok{background:var(--ok-soft);color:var(--ink)} .checkfb.ok .ic{color:var(--ok);margin-top:3px}
.checkfb.bad{background:var(--bad-soft);color:var(--ink)} .checkfb.bad .ic{color:var(--bad);margin-top:3px}
.worked .eyebrow{display:inline-flex;align-items:center;gap:5px;color:var(--theme)}
.timeline{list-style:none;counter-reset:st;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:0}
.timeline li{counter-increment:st;position:relative;padding:4px 40px 12px 0;font-size:16px;line-height:1.75}
.timeline li::before{content:counter(st,arabic-indic);position:absolute;inset-inline-start:0;top:4px;width:28px;height:28px;border-radius:50%;background:var(--theme);color:var(--card);display:grid;place-items:center;font-size:14px;font-weight:600}
.timeline li::after{content:"";position:absolute;inset-inline-start:13px;top:34px;bottom:0;width:2px;background:color-mix(in srgb,var(--theme) 25%,var(--line))}
.timeline li:last-child::after{display:none}
.answerbox{background:var(--ok-soft);border-radius:var(--r-md);padding:12px 14px;margin:8px 0}
.answerbox b{font-family:var(--f-display);font-weight:600;font-size:17px;color:var(--ok)}
.answerbox p{display:flex;gap:8px;align-items:flex-start;margin:6px 0 0;font-size:14.5px}
.answerbox p .ic{color:var(--accent);margin-top:3px}
.gsteps{display:flex;flex-direction:column;gap:8px}
.gstep{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px}
.gstep.solved{border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.gq{margin:0 0 8px;font-size:15.5px;line-height:1.7;display:flex;gap:8px;align-items:flex-start}
.gn{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--bg-2);color:var(--ink-2);margin-top:2px}
.gstep.solved .gn{background:var(--ok);color:#fff}
.gopts{display:flex;flex-wrap:wrap;gap:6px}
.gopts .chip{font-weight:500;font-size:15px}
.gopts .chip.nope{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.gdone{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ok)}
.gfb{margin:6px 0 0;font-size:14px;line-height:1.65}.gfb.ok{color:var(--ink-2)}.gfb.bad{color:var(--bad)}
.summary{border-top:3px solid var(--theme)}
.summary h3{font-size:18px;margin:2px 0 4px}

/* ===== write-your-answer pad, confidence, order, fix-it ===== */
.padbox{background:var(--card);border:1px solid color-mix(in srgb,var(--theme) 35%,var(--line));border-radius:var(--r-lg);padding:12px 14px;margin:0 0 10px}
.padbox .eyebrow{display:inline-flex;align-items:center;gap:5px;color:var(--theme)}
.paddisp{margin:10px 0;min-height:52px;border-radius:var(--r-md);background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--f-display);font-size:28px;font-weight:600;direction:ltr;font-variant-numeric:tabular-nums}
.paddisp .ph0{font-size:15px;color:var(--ink-3);font-family:var(--f-body);font-weight:400}
.paddisp small{font-size:18px;color:var(--ink-2)}
.keys{display:grid;grid-template-columns:repeat(3,1fr) 1fr 1fr;gap:6px;direction:ltr}
.keys{grid-template-columns:repeat(4,1fr)}
.key.zero{grid-column:span 2}.key.sym{font-size:14px;font-family:var(--f-body);color:var(--ink-2)}
.key{height:46px;border-radius:var(--r-md);background:var(--bg-2);border:1px solid var(--line);font-family:var(--f-display);font-size:20px;font-weight:600}
.key:active{background:var(--line)}
.key.del{color:var(--bad)}
.padact{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.padmsg{margin:8px 0 0;font-size:14.5px;line-height:1.7;display:flex;gap:6px;align-items:flex-start}
.padmsg:empty{display:none}
.padbox.collapsed .keys,.padbox.collapsed .padact,.padbox.collapsed .paddisp,.padbox.collapsed .gopts{display:none}
.padbox .gopts{margin-top:8px}
.padbox .chip.nope{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.conf-lab{margin:0 0 8px;font-size:13.5px;color:var(--ink-2);text-align:center}
.confrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cta.conf{font-size:16px;padding:12px 6px}
.confnote{display:block;font-weight:600;margin-bottom:4px}
.confstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.confstats small{font-size:11.5px;line-height:1.4;display:block}
.oslots{list-style:none;counter-reset:os;margin:8px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.oslot{counter-increment:os;display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:9px 12px;font-size:15.5px;line-height:1.7}
.oslot::before{content:counter(os,arabic-indic);width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--theme);color:var(--card);margin-top:2px}
.oslot.empty{border-style:dashed;background:transparent}
.oslot.empty::before{background:var(--bg-2);color:var(--ink-3)}
.opool{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.otile{text-align:start;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-md);padding:9px 12px;font-size:15.5px;line-height:1.7}
@media (prefers-reduced-motion:no-preference){.shake{animation:shake .3s}}
.timeline.fix li.tap{cursor:pointer;border-radius:var(--r-sm)}
.timeline.fix li.bad{background:var(--bad-soft)}
.timeline.fix li.ok-step{background:var(--ok-soft)}
.timeline.fix li.fixed s{color:var(--bad);opacity:.7}

/* theory card: shown before any exercise */
.explain{background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--theme);border-radius:var(--r-lg);padding:14px 16px;margin:4px 0 10px;display:flex;flex-direction:column;gap:10px}
.explain .eyebrow{display:inline-flex;align-items:center;gap:5px;color:var(--theme)}
.explain h3{font-size:19px;margin-top:-4px}
.explain .idea{margin:0;font-size:17px;line-height:1.85}
.explain .idea b{color:var(--theme);font-weight:600}
.exbox,.whybox,.uses{border-radius:var(--r-md);padding:10px 12px;font-size:15.5px;line-height:1.8}
.exbox{background:color-mix(in srgb,var(--theme) 7%,var(--card));border:1px solid color-mix(in srgb,var(--theme) 20%,var(--line))}
.whybox{background:var(--bg)}
.uses{background:var(--accent-soft)}
.exbox small,.whybox small,.uses small{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:2px}
.uses ul{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.uses li{display:flex;gap:8px;align-items:flex-start}
.uses li .ic{color:var(--accent);margin-top:4px}
.explain .listen{align-self:flex-start;margin-top:0}

/* ================= calm layout: one focus, clear groups ================= */
.home{gap:8px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px}
.hero h2{font-size:22px;margin:0}.hero p{margin:-8px 0 0;color:var(--ink-2)}
.hero-top{display:flex;align-items:center;gap:14px}
.hero-top .h-line{display:block;font-family:var(--f-display);font-weight:600;font-size:18px;color:var(--ink)}
.hero-top small{display:block;color:var(--ink-2);font-size:13.5px;margin-top:2px}
.hero .next{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--brand);color:var(--on-brand);border-radius:var(--r-md);padding:12px 14px}
.hero .next span:first-child{flex:1;min-width:0}
.hero .next small{display:block;font-size:12.5px;opacity:.85}
.hero .next b{display:block;font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.4}
.hero .next .gobtn{background:color-mix(in srgb,var(--on-brand) 18%,transparent);color:var(--on-brand)}
.ghead{font-size:14px;font-weight:600;color:var(--ink-2);margin:18px 4px 2px}
.group{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.grow{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:13px 14px;border-top:1px solid var(--line);min-height:54px}
.grow:first-child{border-top:0}
.grow:active{background:var(--bg-2)}.grow:disabled{opacity:.45}
.grow b{flex:1;min-width:0;font-weight:600;font-size:15.5px;color:var(--ink)}
.grow small{color:var(--ink-2);font-size:13px;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center}
.grow small .ic{color:var(--ok)}
.grow .hot{background:var(--bad);color:#fff;border-radius:999px;padding:1px 9px;font-weight:600}
.gic{width:32px;height:32px;flex:none;display:grid;place-items:center;color:var(--ink-2)}
.gic.sym{color:var(--theme);font-family:var(--f-display);font-weight:600;font-size:15px;white-space:nowrap}
.uhead2{padding:6px 4px 10px}.uhead2 h2{font-size:24px;margin:0}.uhead2 p{margin:2px 0 0;color:var(--ink-2)}
.group .lrow .lbody b{font-weight:600}
.lrow.locked .num{opacity:.6}
.unitpage{display:flex;flex-direction:column;gap:6px;padding-bottom:40px}
/* player: one small label instead of a tab strip + title */
.phases{display:block;padding-block:0 6px}
.phases .ph{border:0;padding:0;font-size:13px;color:var(--ink-2);text-align:start}
.phases .ph.on{color:var(--ink-2);border:0}
.ptitle{display:none}
.intro .ltitle{font-size:24px;margin:0 0 6px}
.intro .why{margin:0 0 14px;padding:0;border:0;font-size:15.5px;color:var(--ink-2)}
.intro .goals li{padding-inline-start:14px;position:relative}
.intro .goals li::before{content:"";position:absolute;inset-inline-start:0;top:.75em;width:5px;height:5px;border-radius:50%;background:var(--theme)}
.explain{border-inline-start-width:1px;gap:8px;min-height:240px}
.explain .xdots{display:flex;gap:5px}.explain .xdots i{width:18px;height:4px;border-radius:2px;background:var(--line)}.explain .xdots i.on{background:var(--theme)}
.explain .xlab{color:var(--theme);margin-top:6px}
.explain .xpart .idea{font-size:17px;line-height:1.9;margin:0}
.explain .exbox,.explain .whybox{background:none;border:0;padding:0;font-size:17px;line-height:1.9}
.explain ul.uses{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;background:none}
.explain ul.uses li{font-size:16px;line-height:1.75;padding-inline-start:14px;position:relative}
.explain ul.uses li::before{content:"";position:absolute;inset-inline-start:0;top:.8em;width:5px;height:5px;border-radius:50%;background:var(--theme)}
.summary ul li{padding-inline-start:14px;position:relative}
.summary ul li::before{content:"";position:absolute;inset-inline-start:0;top:.8em;width:5px;height:5px;border-radius:50%;background:var(--theme)}
.tip{display:block;background:var(--bg-2)}
.lead{background:none;border:0;padding:4px 2px}
.dock.empty{display:none}
.qcard .qtools:empty{display:none}
.listen{display:none!important}
.finish .fline{color:var(--ink-2);margin:4px 0 0;font-variant-numeric:tabular-nums}
.gic.sym{width:auto;min-width:32px;font-size:14px}
.gic.sym sup{font-size:.7em;vertical-align:super;line-height:0}

/* ================= premium library: billboard, rails, posters ================= */
body{font-size:16px;letter-spacing:0}
h1,h2,h3{font-weight:500}
.hud.over{position:relative;background:transparent;backdrop-filter:none;border:0}
.hud .wordmark{font-family:var(--f-display);font-weight:600;font-size:21px;letter-spacing:-.01em;color:var(--ink)}
.hud .wordmark + .sec{display:inline;font-family:var(--f-body);font-weight:500;font-size:14px;color:var(--ink-2);margin-inline-start:10px;padding-inline-start:10px;border-inline-start:1px solid var(--line)}
.home{display:flex;flex-direction:column;gap:0;padding-block:2px 48px}
.poster{position:relative;overflow:hidden;isolation:isolate;color:var(--poster-ink);border-radius:22px;
  background:radial-gradient(110% 70% at 90% -10%,color-mix(in srgb,var(--pc) 72%,#FFFFFF) 0%,transparent 55%),
             linear-gradient(165deg,color-mix(in srgb,var(--pc) 94%,#FFFFFF),color-mix(in srgb,var(--pc) 58%,#000000));}
.poster::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.55;
  background:repeating-radial-gradient(circle at 12% 112%,rgba(255,255,255,.09) 0 1px,transparent 1px 8px)}
.poster::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(0,0,0,.5),rgba(0,0,0,0) 62%)}
.poster .glyph{position:absolute;z-index:-1;top:-.08em;inset-inline-end:-.06em;font-family:var(--f-display);font-weight:300;line-height:1;white-space:nowrap;
  color:rgba(255,255,255,.13);letter-spacing:-.03em;pointer-events:none}
.billboard{min-height:430px;display:flex;flex-direction:column;justify-content:flex-end;padding:24px 22px 22px;box-shadow:0 30px 60px -30px color-mix(in srgb,var(--pc) 70%,transparent)}
.billboard.short{min-height:330px}
.billboard .glyph{font-size:250px}.billboard.short .glyph{font-size:200px}
.bb-body{display:flex;flex-direction:column;gap:8px;max-width:34ch}
.bb-body .eyebrow{color:rgba(255,255,255,.72);font-weight:500;letter-spacing:.3px;font-size:13px}
.bb-body h1{font-family:var(--f-display);font-weight:500;font-size:34px;line-height:1.25;color:var(--poster-ink);letter-spacing:-.01em}
.bb-body p{margin:0;font-size:15.5px;line-height:1.75;color:rgba(255,255,255,.82);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bb-act{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.bb-act:empty{display:none}
.play-btn{display:inline-flex;align-items:center;gap:10px;height:50px;padding:0 24px;border-radius:999px;background:var(--poster-btn);color:var(--poster-btn-ink);font-weight:600;font-size:16px;max-width:100%}
.play-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghost-btn{display:inline-flex;align-items:center;height:50px;padding:0 20px;border-radius:999px;color:var(--poster-ink);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);font-weight:500}
.play-btn:active,.ghost-btn:active,.tile:active,.cover-btn:active,.ptile:active{transform:scale(.98)}
.standing{display:flex;align-items:center;gap:16px;width:100%;text-align:start;margin-top:22px;padding-block:6px}
.standing .big-n{font-family:var(--f-display);font-weight:300;font-size:52px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.standing .st-body{flex:1;min-width:0;padding-inline-start:16px;border-inline-start:1px solid var(--line)}
.standing b{display:block;font-family:var(--f-display);font-weight:500;font-size:16px}
.standing small{display:block;color:var(--ink-2);font-size:13.5px;line-height:1.6}
.rail{margin-top:30px}
.rail-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.rail-h h3{font-family:var(--f-display);font-weight:500;font-size:19px;letter-spacing:-.01em}
.rail-h small{color:var(--ink-3);font-size:13px;font-variant-numeric:tabular-nums}
.rail-row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-block:2px 10px;
  scroll-padding-inline:max(16px,env(safe-area-inset-left,0px))}
.rail-row::-webkit-scrollbar{display:none}
.rail-row>*{scroll-snap-align:start;flex:none}
.tile{width:min(64vw,236px);min-height:136px;border-radius:18px;padding:14px 16px;text-align:start;color:var(--poster-ink);display:flex;flex-direction:column;justify-content:space-between;gap:10px;
  background:linear-gradient(155deg,color-mix(in srgb,var(--pc) 88%,#FFFFFF),color-mix(in srgb,var(--pc) 62%,#000000))}
.tile .t-num{font-family:var(--f-display);font-weight:300;font-size:40px;line-height:1;opacity:.9;font-variant-numeric:tabular-nums}
.tile small{display:block;font-size:12.5px;color:rgba(255,255,255,.7)}
.tile b{display:block;font-family:var(--f-display);font-weight:500;font-size:16px;line-height:1.4}
.tile.done{opacity:.62}
.tile.locked{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.tile.locked .t-num{color:var(--ink-3)}.tile.locked small{color:var(--ink-3)}
.tile.now{box-shadow:0 0 0 2px var(--bg),0 0 0 4px color-mix(in srgb,var(--pc) 70%,var(--ink))}
.cover-btn{width:min(40vw,152px);text-align:start;padding:0}
.poster.cover{aspect-ratio:2/3;max-width:100%;border-radius:16px;display:flex;align-items:flex-end}
.poster.cover .glyph{font-size:120px;top:.05em}
.cv-body{display:flex;flex-direction:column;gap:4px;padding:12px;width:100%}
.cv-body small{font-family:var(--f-display);font-weight:300;font-size:22px;line-height:1;color:rgba(255,255,255,.7)}
.cv-body b{font-family:var(--f-display);font-weight:500;font-size:15.5px;line-height:1.35;color:var(--poster-ink)}
.cv-meta{font-style:normal;font-size:12px;color:rgba(255,255,255,.72)}
.cv-bar{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.22);margin-top:6px;overflow:hidden}
.cv-bar i{display:block;height:100%;background:var(--poster-ink)}
.ptile{width:min(44vw,172px);min-height:132px;border-radius:18px;padding:16px;text-align:start;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.ptile .pt-ic{color:var(--brand);margin-bottom:auto}
.ptile b{font-family:var(--f-display);font-weight:500;font-size:15.5px;margin-top:14px}
.ptile small{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.ptile.hot .pt-ic,.ptile.hot b{color:var(--bad)}
.ptile:disabled{opacity:.45}
/* unit page */
.unitpage{gap:0;padding-bottom:48px}
.lessons2{display:flex;flex-direction:column;margin-top:22px}
.lessons2 .lrow{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:8px;padding:15px 0;border-top:1px solid var(--line);background:none;border-radius:0}
.lessons2 .lrow:first-child{border-top:0}
.lessons2 .lrow .num{width:auto;height:auto;border:0;background:none;box-shadow:none;border-radius:0;justify-content:start;display:flex;
  font-family:var(--f-display);font-weight:300;font-size:30px;line-height:1;color:color-mix(in srgb,var(--pc) 70%,var(--ink));font-variant-numeric:tabular-nums}
.lessons2 .lrow .lbody b{font-family:var(--f-display);font-weight:500;font-size:16.5px;line-height:1.45}
.lessons2 .lrow .lbody small{display:inline-block;margin-top:4px;font-size:12px;font-weight:600;color:var(--poster-ink);background:color-mix(in srgb,var(--pc) 85%,var(--ink));border-radius:999px;padding:1px 10px}
.lessons2 .lrow.test .lbody small{background:none;color:var(--ink-2);padding:0;font-weight:400}
.lessons2 .lrow.done .num,.lessons2 .lrow.done .lbody{opacity:.5}
.lessons2 .lrow.locked .lbody,.lessons2 .lrow.locked .num{opacity:.38}
.lessons2 .lstate{color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:14px}
.lessons2 .lrow.done .lstate{color:var(--ok)}
.lessons2 .lrow.test{background:none}
/* player: refined surfaces */
.cta{background:var(--ink);color:var(--bg);border-radius:999px;font-weight:600}
.dock.ok .cta{background:var(--ok);color:#FFFFFF}.dock.bad .cta{background:var(--bad);color:#FFFFFF}
.cta:disabled{background:var(--bg-2);color:var(--ink-3)}
.qtext{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.7}
.explain{border:0;background:transparent;padding:6px 2px;box-shadow:none}
.explain h3{font-family:var(--f-display);font-weight:500;font-size:26px;letter-spacing:-.01em}
.explain .xpart .idea,.explain .exbox,.explain .whybox{font-size:18px}
.intro{border:0;background:transparent;padding:6px 2px}
.intro .ltitle{font-family:var(--f-display);font-weight:500;font-size:30px;letter-spacing:-.01em}
.opt{border-radius:16px}
.phases .ph{font-family:var(--f-display);font-weight:400;letter-spacing:.2px}

/* ===== smart placement test + personal plan ===== */
:root{--warn:#A8650F;--warn-soft:#F7EBDA;--chk:#2F5D8A;--chk-soft:#E4ECF5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--warn:#E2A54F;--warn-soft:#2B2113;--chk:#7FA8D6;--chk-soft:#15202C}}
:root[data-theme="dark"]{--warn:#E2A54F;--warn-soft:#2B2113;--chk:#7FA8D6;--chk-soft:#15202C}
.dgq{padding-top:16px;padding-inline-end:84px;min-height:92px}
.dtimer{position:absolute;inset-inline-end:12px;top:12px;width:62px;height:62px;display:grid;place-items:center;text-align:center}

.dtimer .tr-bg{fill:none;stroke:var(--line);stroke-width:4}
.dtimer .tr-fg{fill:none;stroke:var(--theme);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .2s linear,stroke .3s}
.dtimer b{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1;margin-top:-6px;color:var(--ink)}

.dtimer.low .tr-fg{stroke:var(--bad)} .dtimer.low b{color:var(--bad)}
.dtimer.out .tr-fg{stroke:var(--bad)} .dtimer.out b{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.dtimer.low b{animation:dgpulse 1s ease-in-out infinite}@keyframes dgpulse{50%{opacity:.45}}}
.dgrow{display:flex;gap:10px}

.dg-out{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0;font-weight:600;color:var(--bad);font-size:17px}
.dg-rules ul{list-style:none;margin:6px 0 0;padding:0}
.dg-rules li{display:flex;flex-direction:column;gap:2px;padding:14px 0;border-top:1px solid var(--line)}
.dg-rules li b{font-family:var(--f-display);font-weight:500;font-size:16.5px}
.dg-rules li span{color:var(--ink-2);font-size:14.5px;line-height:1.7}
.dg-note{color:var(--ink-2);font-size:14px;margin:6px 0 0}
.dg-counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}

.dg-gaps .gap{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.dg-gaps .gap b{display:block;font-weight:600} .dg-gaps .gap small{color:var(--ink-2);line-height:1.7}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:8px} .dot.red{background:var(--bad)}

.dg-map i.red,.mkey i.red{background:var(--bad)} .dg-map i.check,.mkey i.check{background:var(--chk)}
.mkey{display:flex;flex-wrap:wrap;gap:14px;margin:12px 0 24px;font-size:13px;color:var(--ink-2)} .mkey span{display:inline-flex;align-items:center;gap:6px}

.tile.dgt.confirm{background:var(--card);color:var(--ink);border:1px solid var(--line)} .tile.dgt.confirm small{color:var(--ink-2)} .tile.dgt.confirm .t-num{color:var(--chk)}

@media (max-width:360px){.dg-counts{grid-template-columns:repeat(2,1fr)}}
.dtimer.out .tr-fg{opacity:0} .dtimer.out b{animation:none}
.dg .opt:disabled{opacity:.55}
.dgfig{margin:0 0 12px}
.dg-red{fill:var(--bad)} .dg-blue{fill:var(--chk)}

/* ===== hands-on lesson steps ===== */

b.cn{color:var(--c-num)!important} b.cd{color:var(--c-den)!important}
.act-fnum.n{fill:var(--c-num)} .act-fnum.d{fill:var(--c-den)}

/* equation board: a teacher writing one line at a time */
.eqb{display:flex;flex-direction:column;align-items:center;gap:8px;margin:10px auto 4px;padding:14px 18px;border-radius:18px;background:var(--card);border:1px solid var(--line);width:fit-content;max-width:100%}

.eqb .n{color:var(--c-num)} .eqb .d{color:var(--c-den)} .eqb .res{background:var(--brand-soft);border-radius:10px;padding:2px 10px}
@media (prefers-reduced-motion:no-preference){.eqb .t{animation:eqin .4s ease both}@keyframes eqin{from{opacity:0;transform:translateY(12px)}}
  .eqb .res{animation:eqin .4s ease both,eqglow 1.2s ease .2s both}@keyframes eqglow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--theme) 45%,transparent)}100%{box-shadow:0 0 0 14px transparent}}}
.eqb .row{color:var(--ink)}
.st{fill:#F7E6BE;stroke:#B9783A;stroke-width:2;transition:fill .15s} .st.on{fill:var(--c-num)} .st.nope{fill:var(--bad-soft)}

.st-edge{fill:none;stroke:var(--c-den);stroke-width:3}
.act-card{fill:var(--card);stroke:var(--line);stroke-width:2;transition:fill .15s,stroke .15s} .act-card.on{fill:var(--ok-soft);stroke:var(--ok);stroke-width:3}
.act-hit.nope{fill:color-mix(in srgb,var(--bad) 18%,transparent)}

.eqb .t .fr{font-size:.8em}
.eqb .row.long{font-size:21px;gap:6px}
.pen{fill:#3F6FB0} .band{fill:var(--c-num)}
.eqb .row{flex-wrap:wrap;justify-content:center;row-gap:6px}
.eqb .t{white-space:nowrap}
.eqb .grp{display:inline-flex;align-items:center;gap:inherit;white-space:nowrap}
.road{fill:#5B6470} .lane{fill:#F2F2F2} .car{fill:#3F6FB0;stroke:#24426B;stroke-width:1.5} .car.on{fill:var(--c-num);stroke:var(--c-den)} .wheel{fill:#1E2328}
.pan{fill:var(--bg-2);stroke:var(--ink-2);stroke-width:2} .box{fill:#F3D9A4;stroke:var(--c-den);stroke-width:2.5}
.hole{fill:var(--card);stroke:var(--c-num);stroke-width:3} .apple{fill:#D94B3D;stroke:#8F2A21;stroke-width:1.5} .banana{fill:#F2C94C;stroke:#B08A1E;stroke-width:1.5}
.act-word{font-size:17px;font-weight:700;fill:var(--ink)}
.act-quote{display:block;background:var(--bg-2);border-inline-start:4px solid var(--c-num);padding:8px 12px;border-radius:8px;margin:4px 0 8px;font-size:.92em;font-weight:500;color:var(--ink)}
.arcseg{fill:none;stroke:var(--ink-2);stroke-width:2.5;stroke-dasharray:5 5;opacity:.6}
.arcseg.on{stroke:var(--c-num);stroke-dasharray:none;stroke-width:4.5;opacity:1}
.arc-hit{fill:none;stroke:transparent;stroke-width:22;pointer-events:stroke;cursor:pointer}
/* lessons: one scroll of linked pages */
.pbody.paged{padding-block:4px 120px}
.lpage{min-height:calc(100vh - 210px);min-height:calc(100dvh - 210px);display:flex;flex-direction:column;gap:12px}
.lpage>*{margin-block:0}
.lpage+.lpage{margin-top:26px;padding-top:22px;border-top:1px dashed var(--line);position:relative}
.lpage+.lpage::before{content:"";position:absolute;top:-5px;inset-inline-start:50%;width:9px;height:9px;border-radius:50%;background:var(--theme);transform:translateX(50%)}
.lpage.past{min-height:0;opacity:.78;transition:opacity .3s}
.lpage.past .act-chip,.lpage.past .cta{display:none}
@media (prefers-reduced-motion:no-preference){.lpage.pin{animation:pagein .45s cubic-bezier(.2,.8,.2,1) both}@keyframes pagein{from{opacity:0;transform:translateY(46px)}}}
.lock-edge{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:18px;padding:10px;font-size:12.5px;color:var(--ink-3);border-top:1px dashed var(--line)}

/* ===== ladder lessons ===== */
.ladder .ptop{gap:10px}

.lad-name span{color:var(--ink-3);white-space:nowrap}
.lad-steps{display:flex;gap:4px}

.lad-snd{font-size:18px}
.lad-body{padding-top:14px;padding-bottom:140px}
.lad-kick{display:block;margin:4px 0 10px}

.lad-weight span{color:var(--ink-2);font-size:14px}
.lad-h{font-size:16px;margin:18px 0 8px}
.lad-prev{margin:0;padding-inline-start:22px;display:grid;gap:10px}

.lad-how{color:var(--ink-2);font-size:14px;line-height:1.8;margin-top:16px}
.lad-q{position:relative}
.lad-q .qtext{font-size:19px;padding-inline-end:64px;min-height:56px}
.lad-timer{position:absolute;inset-inline-end:0;top:-4px;width:56px;height:56px;display:grid;place-items:center}

.lad-timer .tr-bg{stroke:var(--line)}

.lad-timer b{font-family:var(--f-display);font-size:19px;position:relative}
.lad-timer.low .tr-fg{stroke:var(--bad)}
.lad-timer.low b{color:var(--bad);animation:ladpulse .5s ease-in-out infinite alternate}
.lad-timer.up b{color:var(--bad)}
@keyframes ladpulse{to{transform:scale(1.18)}}
.lad-fb{margin:14px 0 0;font-size:15px;line-height:1.8;min-height:1em}
.lad-fb.ok{color:var(--ok);font-weight:600}
.lad-fb.bad{color:var(--bad)}
.lad-why{color:var(--ink-2)}

.lad-alt{margin-top:8px;width:100%}
.lad-exp{font-weight:700}
.lad-x{stroke:var(--bad);stroke-width:4;stroke-linecap:round}
.act-card.gone{opacity:.35}
@media (prefers-reduced-motion:reduce){.lad-timer.low b{animation:none}}

.lad-fo{width:100%;height:100%;display:flex;align-items:center;justify-content:center;direction:rtl;color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:30px}
.lad-fo.s-txt{font-size:18px}
.sq .idx{position:absolute;right:-.05em;top:-.42em;font-size:.48em;line-height:1}

/* drill lessons: a bar out of 5 per level, fast questions, wrong picks crossed out */
.dr-bar{display:flex;align-items:center;gap:10px;margin:2px 0 16px;position:relative}
.dr-track{flex:1;display:flex;gap:6px}

.dr-rule{margin-top:14px!important;font-size:13px;color:var(--ink-3)!important;line-height:1.8}
.dr-back{color:var(--ok)!important;font-weight:600;margin-bottom:6px!important}
.dr-bonetxt{font-size:18px;line-height:2.1;color:var(--ink);margin-top:10px}
/* the lesson bar: one piece per level, the current level wide with its point boxes */
.dr-rail{display:flex;align-items:center;gap:3px;direction:rtl;position:relative}
.dr-seg{flex:1;min-width:3px;height:8px;border-radius:3px;background:var(--line)}

@keyframes drhit{50%{box-shadow:0 0 0 4px var(--ok)}}

/* ===== drill lessons: one quiet dark room, everything in the middle (approved design, Nov 2026) ===== */
body.dz{background:#0B0C0C;color:#F2F3F1}

.dz-track{flex:1;position:relative;height:12px;display:flex;align-items:center;gap:2px;direction:rtl}
.dz-track i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.12);transition:background .5s}

.dz-dot{position:absolute;top:0;right:0;width:12px;height:12px;margin-right:-6px;border-radius:6px;background:#F6F7F5;box-shadow:0 0 0 4px rgba(95,211,160,.25),0 0 16px #5FD3A0;transition:right .7s cubic-bezier(.2,.7,.2,1)}
.dz-glow{position:fixed;left:50%;top:45%;width:540px;height:540px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(95,211,160,.12),rgba(95,211,160,0));pointer-events:none;opacity:0;transition:opacity .8s;z-index:0}

.dz-body{position:relative;z-index:1;width:100%;padding:0!important}

.dz-c{position:absolute;inset:0;direction:ltr;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:200;font-size:34px;color:#F6F7F5}

@keyframes dzPop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.dz-msg{min-height:28px;margin:-8px 0 0!important;font-size:17px;line-height:1.8;max-width:340px;color:#A9ADA8;background:none!important;border:0!important;padding:0!important}
.dz-msg.ok{color:#7FE0B4;font-family:var(--f-display);font-size:21px}
.dz-msg.bad{color:#E9C2BC}
.dz-coach{display:inline-block;margin-top:2px;color:#F6F7F5;font-weight:500}
.dz-why{display:inline-block;margin-top:4px;color:#DADDD9}
.dz-q{margin:0;font-family:var(--f-display);font-weight:300;font-size:34px;line-height:1.55;color:#F6F7F5;transition:color .3s}
.dz-stage.answered .dz-q{color:rgba(246,247,245,.45)}
.dz-cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-self:stretch;margin-top:-8px}
.dz-cmp div{border-radius:18px;background:rgba(255,255,255,.04);padding:12px;display:flex;flex-direction:column;gap:4px}

.dz-opts.one{grid-template-columns:1fr}
body.dz .opt.dz-o{min-height:76px;height:auto;border-radius:22px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);color:#F2F3F1;font-family:var(--f-display);font-size:26px;font-weight:300;display:flex;align-items:center;justify-content:center;padding:8px 12px;box-shadow:none;transition:background .25s,border-color .25s,opacity .3s,transform .15s;cursor:pointer}

body.dz .opt.dz-o{min-width:0;overflow-wrap:anywhere}
body.dz .opt.dz-o .m{white-space:normal;max-width:100%}   /* a long answer («س² + ١٨س + ٨١») wraps inside its button instead of spilling out */
body.dz .opt.dz-o:active{transform:scale(.98)}
body.dz .opt.dz-o.ok{border-color:rgba(95,211,160,.7);background:rgba(95,211,160,.14);box-shadow:0 0 28px rgba(95,211,160,.18);color:#F6F7F5;opacity:1}
body.dz .dz-stage.answered .opt.dz-o:not(.ok){opacity:.3}
body.dz .opt.dz-o.bad{border-style:dashed;border-color:rgba(240,138,126,.45);background:rgba(240,138,126,.05);color:#8C5952;text-decoration:line-through;text-decoration-thickness:2px}
body.dz .opt.dz-o .mo,body.dz .dz-q .mo,body.dz .dz-ex .mo{color:#5FD3A0}
.dz-big{margin:0;font-family:var(--f-display);font-weight:300;font-size:60px;line-height:1.3;color:#F6F7F5;animation:dzIn 1.1s cubic-bezier(.2,.7,.2,1) both}
.dz-big.out{animation:dzOut .45s ease forwards}
@keyframes dzIn{0%{opacity:0;transform:scale(.92);letter-spacing:6px;filter:blur(8px)}100%{opacity:1;transform:none;letter-spacing:0;filter:none}}
@keyframes dzOut{to{opacity:0;transform:scale(1.04);filter:blur(6px)}}
.dz-line{height:2px;width:0;border-radius:1px;background:#5FD3A0;box-shadow:0 0 12px #5FD3A0;animation:dzLine .9s ease .5s forwards}
@keyframes dzLine{to{width:56px}}
.dz-idea{margin:0;font-family:var(--f-display);font-weight:300;font-size:32px;line-height:1.6;color:#F6F7F5;animation:dzRise .8s cubic-bezier(.2,.7,.2,1) both}
.dz-idea b{font-weight:500;color:#7FE0B4}

@keyframes dzRise{0%{opacity:0;transform:translateY(14px);filter:blur(6px)}100%{opacity:1;transform:none;filter:none}}
.dz-start{align-items:flex-start;text-align:right;gap:22px}
.dz-eyebrow{margin:0;font-size:13px;color:#8E938E}
.dz-title{margin:0;font-family:var(--f-display);font-weight:500;font-size:44px;line-height:1.25;color:#F6F7F5}

.dz-ring{width:170px;height:170px;border-radius:50%;box-shadow:inset 0 0 0 6px #5FD3A0,0 0 44px rgba(95,211,160,.32);display:flex;align-items:center;justify-content:center;animation:dzRise .6s both}
.dz-h{margin:0;font-family:var(--f-display);font-weight:300;font-size:34px;line-height:1.45;color:#F6F7F5;animation:dzRise .7s .15s both}
.dz-p{margin:0;font-size:16px;line-height:1.8;color:#8E938E;animation:dzRise .7s .3s both}
.dz-bone{font-size:20px;line-height:2.1;color:#DADDD9;animation:dzRise .7s .2s both}
body.dz .dock{background:linear-gradient(to top,#0B0C0C 72%,rgba(11,12,12,0));border:0;box-shadow:none}
body.dz .dock .dock-in{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:10px}

.dz-msg::before,.dz-msg::after{display:none!important;content:none!important}

/* ===== the tunnel: its door and its gate (same dark room as the drill) ===== */
.tun{position:relative;min-height:100svh;max-width:460px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:80px 22px 40px;box-sizing:border-box;color:#F2F3F1;font-family:var(--f-body);text-align:center;overflow:hidden}
.tun-x{position:absolute;top:14px;right:18px}
.tun-hole{position:relative;width:220px;height:220px;flex:none}
.tun-hole i{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(95,211,160,.5);animation:tunIn 4s linear infinite;opacity:0}
.tun-hole i:nth-child(2){animation-delay:-1s}.tun-hole i:nth-child(3){animation-delay:-2s}.tun-hole i:nth-child(4){animation-delay:-3s}
.tun-hole b{position:absolute;inset:38%;border-radius:50%;background:radial-gradient(closest-side,#F6F7F5,rgba(127,224,180,.55) 45%,rgba(95,211,160,0));filter:blur(2px);animation:tunBreath 3.2s ease-in-out infinite}
@keyframes tunIn{0%{transform:scale(1.25);opacity:0}15%{opacity:.7}100%{transform:scale(.12);opacity:0}}
@keyframes tunBreath{50%{transform:scale(1.25);opacity:.8}}
.tun-txt{display:flex;flex-direction:column;align-items:center;gap:14px;animation:dzRise .9s .2s both}
.tun-eyebrow{margin:0;font-size:13px;letter-spacing:.3px;color:#8E938E}
.tun-h{margin:0;font-family:var(--f-display);font-weight:300;font-size:42px;line-height:1.35;color:#F6F7F5}
.tun-p{margin:0;font-size:17px;line-height:1.9;color:#B4B8B3;max-width:320px}
.tun-go{display:flex;align-items:center;justify-content:center;width:100%;max-width:416px;height:58px;border-radius:29px;border:0;background:#F2F3F1;color:#0B0C0C!important;font-family:var(--f-display);font-weight:500;font-size:18px;text-decoration:none;cursor:pointer;animation:dzRise .9s .5s both;box-shadow:0 0 40px rgba(95,211,160,.18)}
.tun-act{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
.tun-ghost{width:100%;max-width:416px;height:52px;border-radius:26px;background:transparent;color:#DADDD9;border:1px solid rgba(255,255,255,.14);font-family:var(--f-body);font-size:16px;cursor:pointer;animation:dzRise .9s .6s both}
.tun-link{background:none;border:0;color:#8E938E;font-family:var(--f-body);font-size:14px;text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:8px;animation:dzRise .9s .7s both}
.tun-gate .dz-ring{margin-bottom:4px}
.tun-h.big{font-size:64px;font-weight:300;letter-spacing:.5px}
.tun-time{margin:0;font-family:var(--f-display);font-weight:300;font-size:22px;color:#7FE0B4}
.tun-gate .tun-h{font-size:40px}
.tun-list{justify-content:flex-start;padding-top:90px;gap:26px}
.tun-hole.sm{width:150px;height:150px}
.tun-st{list-style:none;margin:0;padding:0;width:100%;max-width:300px;display:flex;flex-direction:column;position:relative;animation:dzRise .9s .25s both}
.tun-st::before{content:"";position:absolute;right:13px;top:20px;bottom:20px;width:1.5px;background:linear-gradient(rgba(95,211,160,.5),rgba(255,255,255,.08))}
.tun-st li{position:relative;display:flex;align-items:center;gap:16px;min-height:52px;font-family:var(--f-display);font-weight:300;font-size:20px;color:#6E736E;text-align:right}
.tun-st .dot{flex:none;width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#121413;border:1.5px solid rgba(255,255,255,.12);color:#6E736E;position:relative;z-index:1}
.tun-st li.here{color:#F6F7F5;font-size:24px;font-weight:400}
.tun-st li.here .dot{border-color:#7FE0B4;background:#0B0C0C;box-shadow:0 0 0 5px rgba(95,211,160,.14),0 0 18px rgba(95,211,160,.5)}
.tun-st li.here .dot::after{content:"";width:10px;height:10px;border-radius:5px;background:#F6F7F5}
.tun-st li.done{color:#B4B8B3}
.tun-st li.done .dot{background:#5FD3A0;border-color:#5FD3A0;color:#0B0C0C}
.tun-list .tun-go{position:sticky;bottom:24px;margin-top:auto}
.tun-hole.shut i{animation:none;opacity:.22}.tun-hole.shut i:nth-child(2){transform:scale(.75)}.tun-hole.shut i:nth-child(3){transform:scale(.5)}.tun-hole.shut i:nth-child(4){transform:scale(.25)}
.tun-hole.shut b{opacity:.25;animation:none}
.tun-lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#F6F7F5}
.tun-lock svg{width:34px;height:34px}
.tun-done{margin:0;display:flex;align-items:center;gap:8px;font-size:16px;color:#7FE0B4}
.tun-msg{margin:0;font-family:var(--f-display);font-weight:300;font-size:22px;color:#B4B8B3}
.tun-list{overflow:visible;padding-bottom:110px}
.tun-list .tun-go{position:fixed;bottom:24px;left:0;right:0;margin:0 auto;width:calc(100% - 44px);max-width:416px;z-index:3}
.tun-list::after{content:"";position:fixed;left:0;right:0;bottom:0;height:120px;background:linear-gradient(to top,#0B0C0C 55%,rgba(11,12,12,0));pointer-events:none;z-index:2}
.tun-st li{min-height:44px;font-size:18px}
.tun-st li.here{font-size:22px}

/* a station that is open to tap (a finished one, the mock exams, a second course) */
.tun-st li.open{color:#DADDD9}
.tun-st li.open .dot{border-color:rgba(255,255,255,.4)}
.tun-st li.done,.tun-st li.open{cursor:pointer}
.tun-list .tun-link{position:relative;z-index:3}
/* the road: one long list of lessons */
.tun-road .tun-st{max-width:320px}
.tun-st li.soon{color:#4E534F}
.tun-st li.soon .dot{border-style:dashed}
.tun-st li small{margin-inline-start:auto;font-family:var(--f-body);font-size:12px;color:#5C615C;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:2px 9px}
.tun-st li.here{cursor:pointer}
.tun-door .tun-act .tun-link{margin-top:2px}
.dz-msg.dz-tag{color:#6E736E;font-size:14px;letter-spacing:.3px}
.dz-fig{display:flex;justify-content:center;margin:-6px 0 -4px}.dz-fig svg{max-width:100%;height:auto}
/* ---------- joining: phone, code, plan, payment, booking ---------- */
.jn{gap:26px}
.jn .tun-h{font-size:44px}
.jn-form{width:100%;max-width:416px;display:flex;flex-direction:column;align-items:center;gap:14px;animation:dzRise .9s .35s both}
.jn-phone{display:flex;align-items:center;width:100%;height:64px;border-radius:20px;background:#121413;border:1px solid rgba(255,255,255,.14);overflow:hidden;direction:ltr}
.jn-phone span{padding:0 14px 0 20px;font:500 20px/1 var(--f-body);color:#8E938E;border-right:1px solid rgba(255,255,255,.1);height:100%;display:flex;align-items:center}
.jn-phone input,.jn-in,.jn-code{flex:1;min-width:0;height:100%;background:transparent;border:0;outline:0;color:#F6F7F5;font:500 22px/1 var(--f-body);padding:0 16px;letter-spacing:1px}
.jn-in,.jn-code{width:100%;height:64px;border-radius:20px;background:#121413;border:1px solid rgba(255,255,255,.14);text-align:center}
.jn-code{font-size:34px;letter-spacing:14px;padding-left:28px}
.jn-phone:focus-within,.jn-in:focus,.jn-code:focus{border-color:#7FE0B4;box-shadow:0 0 0 4px rgba(95,211,160,.14)}
.jn-err{margin:0;color:#FF8A80;font-size:15px;text-align:center}
.jn-small{margin:0;color:#8E938E;font-size:13px;line-height:1.9;text-align:center}
.jn-small a{color:#B4B8B3}
.tun-link:disabled{opacity:.6;text-decoration:none;cursor:default}
.jn-get{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;animation:dzRise .9s .35s both}
.jn-get li{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:300;font-size:22px;color:#DADDD9}
.jn-get svg{width:22px;height:22px;color:#7FE0B4;flex:none}
.jn-price{margin:0;display:flex;align-items:baseline;gap:10px;color:#F6F7F5;animation:dzRise .9s .5s both}
.jn-price b{font-family:var(--f-display);font-weight:300;font-size:72px;line-height:1}
.jn-price span{font-size:20px;color:#B4B8B3}
.jn-ok{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0B0C0C;background:#7FE0B4;box-shadow:0 0 0 10px rgba(95,211,160,.14),0 0 60px rgba(95,211,160,.45);animation:dzRise .7s both}
.jn-ok svg{width:44px;height:44px}
.jn-spin{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.12);border-top-color:#7FE0B4;animation:jnSpin .9s linear infinite}
@keyframes jnSpin{to{transform:rotate(360deg)}}
.jn-a{display:flex;align-items:center;justify-content:center;text-decoration:none}
.acct-acts{display:flex;flex-direction:column;gap:10px}.acct-acts .play-btn,.acct-acts .ghost-btn{justify-content:center}
.jn .tun-p bdi{white-space:nowrap}
/* the account window, dark like the rest of the site */
body.dz .modal.acct{background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
body.dz .acct-box{background:#141615;color:#F2F3F1;border:1px solid rgba(255,255,255,.08);box-shadow:0 30px 80px rgba(0,0,0,.6)}

body.dz .acct-list li{border-color:rgba(255,255,255,.1);background:#0F1110}
body.dz .acct-list li.on b::before{color:#7FE0B4}

body.dz .acct-box .play-btn{background:#F2F3F1;color:#0B0C0C;height:52px}
body.dz .acct-box .ghost-btn{background:transparent;color:#DADDD9;border:1px solid rgba(255,255,255,.16);height:52px}
body.dz .acct-form input{background:#0F1110;color:#F2F3F1;border-color:rgba(255,255,255,.14)}
