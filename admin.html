<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<style>
/* the admin's pocket tool: one column, big touch targets, works on a phone during a live */
:root{--bg:#F3F5F2;--card:#fff;--ink:#1C2420;--ink2:#5A665F;--line:#DCE3DE;--accent:#1F7A5A;--accent-soft:#E2F1EA;--bad:#B3261E;--warn:#9A6400}
@media (prefers-color-scheme:dark){:root{--bg:#111613;--card:#18201C;--ink:#E7EEE9;--ink2:#9DABA3;--line:#2A3530;--accent:#5FC59C;--accent-soft:#1D3229;--bad:#F2B8B5;--warn:#E9B562;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,"Segoe UI",Tahoma,sans-serif;padding:16px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:22px;margin:0} h2{font-size:18px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600;color:var(--ink2)}
input{font:500 17px/1.2 system-ui,sans-serif;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
input[dir=ltr]{text-align:left}
.row{display:flex;gap:8px;align-items:end}.row>*{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
button{font:600 15px/1 system-ui,sans-serif;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 14px;cursor:pointer}
button.main{background:var(--accent);border-color:var(--accent);color:#fff;padding:14px}
@media (prefers-color-scheme:dark){button.main{color:#0E1A15}}
button.small{padding:7px 10px;font-size:13px}
button:disabled{opacity:.55}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link{background:none;border:0;color:var(--accent);padding:4px;text-decoration:underline}
.course{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.course.on{border-color:var(--accent);background:var(--accent-soft)}
.course .top{display:flex;align-items:center;gap:10px;font-weight:600}
.course .top input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.course .when{display:none;gap:6px;flex-wrap:wrap;align-items:center}.course.on .when{display:flex}
.course .when input[type=date]{flex:1 1 150px;width:auto}
.err{color:var(--bad);font-size:14px;margin:0}
.ok{background:var(--accent-soft);border-color:var(--accent)}
pre{white-space:pre-wrap;font:15px/1.7 system-ui,sans-serif;margin:0 0 12px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px}
.list{display:flex;flex-direction:column;gap:8px}
.stu{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;background:var(--card);text-align:start;width:100%}
.stu b{display:block}.stu small{color:var(--ink2);display:block}
.pill{font-size:12px;font-weight:600;border-radius:99px;padding:2px 8px;white-space:nowrap}
.pill.on{background:var(--accent-soft);color:var(--accent)}.pill.end{background:transparent;color:var(--ink2);border:1px solid var(--line)}.pill.soon{color:var(--warn);border:1px solid currentColor}
.muted{color:var(--ink2);font-size:14px;margin:0}
.tabs{display:flex;gap:6px}.tabs button{flex:1}.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px}
.bar i{grid-column:1/-1;height:10px;border-radius:6px;background:var(--line);overflow:hidden;display:block}
.bar i b{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar span:last-of-type{color:var(--ink2);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:13px}
.big3{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.big3 div{border:1px solid var(--line);border-radius:12px;padding:10px}.big3 b{font-size:24px;display:block}
.cols{display:flex;align-items:flex-end;gap:4px;height:90px}.cols div{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th,.tbl td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:start}.tbl th{color:var(--ink2);font-weight:600}
.tbl td.n{text-align:center;font-variant-numeric:tabular-nums}
.tip{font-size:13px;color:var(--ink2);margin:6px 0 0}
[hidden]{display:none!important}
.mebtn{display:inline-block;margin-top:10px;padding:10px 16px;border-radius:12px;background:var(--ink,#eee);color:var(--bg,#111);text-decoration:none;font-weight:600}
.path{font-size:15px;margin:14px 0 6px}.rg{flex-wrap:wrap}.rg button{flex:1 0 30%}
</style>
</head>

const app = document.getElementById('app');
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const rand = (n, set) => Array.from(crypto.getRandomValues(new Uint32Array(n)), x => set[x % set.length]).join('');

/* ---------- login / first-time setup ---------- */
function loginScreen(msg, setup) {
  app.innerHTML = `<header><h1>لوحة لينا</h1></header>

/* ---------- the tool ---------- */
function shell() {
  app.innerHTML = `<header><h1>لوحة لينا</h1><button class="small" id="out">خروج</button></header>

let statsDays = 'd0';
const PATHS = [
  ['🎓 دورة القدرات', [['course_door', 'ضغطوا «ادخل الدورة»'], ['course_section', 'اختاروا قسم'], ['lesson_start', 'بدأوا درسًا'], ['lesson_done', 'أنهوا درسًا كاملًا'], ['paywall', 'وصلوا لرسالة الاشتراك']]],

];

  ['login_open', 'فتحوا نافذة الدخول'], ['login_fail', 'فشل دخولهم'], ['move_hint', 'ضغطوا «⚡ لا تحسب»']];
const SRC = { tiktok: 'تيك توك', direct: 'مباشر', whatsapp: 'واتساب', instagram: 'إنستقرام', snapchat: 'سناب', google: 'قوقل', x: 'إكس' };
const DEV = { ios: 'آيفون', android: 'أندرويد', desktop: 'كمبيوتر' };
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const chips = (o, names) => { const e = Object.entries(o || {}).sort((a, b) => b[1] - a[1]); return e.length ? `<div class="chips">${e.map(([k, v]) => `<span>${esc((names && names[k]) || k || '؟')} · <b>${ar(v)}</b></span>`).join('')}</div>` : '<p class="muted">لا يوجد بعد</p>'; };
const when = t => { const d = new Date(t), m = Math.round((Date.now() - d) / 60000); return m < 60 ? `قبل ${ar(m)} دقيقة` : m < 1440 ? `قبل ${ar(Math.round(m / 60))} ساعة` : fmt(iso(d)); };
async function stats() {
  const view = document.getElementById('view');
  const ranges = [['d0', 'اليوم'], ['d1', 'أمس'], ['d2', 'قبل أمس'], ['w', 'آخر ٧ أيام'], ['m', 'آخر ٣٠ يومًا'], ['all', 'الكل']];
  view.innerHTML = `<div class="tabs rg" id="rg">${ranges.map(([d, t]) => `<button class="small${d === statsDays ? ' on' : ''}" data-d="${d}">${t}</button>`).join('')}</div><div id="sv" class="stack" style="margin-top:12px"><div class="card"><p class="muted">جارٍ التحميل…</p></div></div>`;
  view.querySelectorAll('#rg button').forEach(b => b.onclick = () => { statsDays = b.dataset.d; stats(); });
  /* days follow Saudi time (UTC+3), whatever the phone's clock is set to */
  const DAY = 864e5, KSA = 3 * 36e5, midnight = Math.floor((Date.now() + KSA) / DAY) * DAY - KSA;
  const span = { d0: [midnight, Date.now() + 6e4], d1: [midnight - DAY, midnight], d2: [midnight - 2 * DAY, midnight - DAY], w: [midnight - 6 * DAY, Date.now() + 6e4], m: [midnight - 29 * DAY, Date.now() + 6e4], all: [Date.UTC(2024, 0, 1), Date.now() + 6e4] }[statsDays] || [midnight, Date.now() + 6e4];
  const from = new Date(span[0]), to = new Date(span[1]);
  const dayLabel = /^d/.test(statsDays) ? new Date(span[0] + KSA).toLocaleDateString('ar-SA-u-ca-gregory', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }) : '';
  const { data: S, error } = await sb.rpc('admin_stats', { p_from: from.toISOString(), p_to: to.toISOString() });
  const sv = view.querySelector('#sv');
  if (error) { sv.innerHTML = `<div class="card"><p class="err">${/admin_stats|function/i.test(error.message) ? 'الإحصاءات غير مفعّلة بعد: شغّل ملف الإحصاءات في Supabase مرة واحدة.' : esc(errText(error))}</p></div>`; return; }
  const F = Object.assign({}, S.funnel || {}, { wa_door: (S.wa_from || {}).course_door || 0 }), C = S.counts || {}, V = S.visitors || 0;
  if (!V) { sv.innerHTML = '<div class="card"><p class="muted">لا زيارات في هذه الفترة.</p></div>' + meCard(); return; }
  const top = F.visit || V;
  const days = S.days || [], maxD = Math.max(1, ...days.map(d => d.v));
  const hours = Object.entries(S.hours || {}).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const lessons = (S.lessons || []).filter(l => l.started || l.done);
  sv.innerHTML = `${dayLabel ? `<p class="muted" style="margin:0 4px">${dayLabel}</p>` : ''}
    <div class="card"><div class="big3">
      <div><b>${ar(V)}</b><span class="muted">زائر</span></div><div><b>${ar(S.new || 0)}</b><span class="muted">زائر جديد لأول مرة</span></div>
      <div><b>${ar(S.minutes || 0)}</b><span class="muted">دقيقة متوسط الزيارة</span></div><div><b>${ar(F.wa_click || 0)}</b><span class="muted">ضغطوا واتساب</span></div></div>
      <p class="tip">${ar(S.visits || 0)} زيارة. الزائر = جوال واحد، حتى لو فتح الموقع أكثر من مرة.</p></div>
    <div class="card"><h2>وش سووا بعد ما فتحوا الموقع؟</h2>${PATHS.map(([name, steps]) => `<h3 class="path">${name}</h3><div class="bars">${steps.map(([k, t]) => { const v = F[k] || 0; return `<div class="bar"><span>${t}</span><span>${ar(v)} · ${ar(pct(v, top))}٪</span><i><b style="width:${pct(v, top)}%"></b></i></div>`; }).join('')}</div>`).join('')}
      <p class="tip">من ${ar(top)} فتحوا الموقع. النسبة من الكل. أكبر نزول بين خطوتين هو المكان اللي نخسر فيه الناس.</p></div>
    <div class="card"><h2>من أين جاؤوا</h2>${chips(S.sources, SRC)}<h2 style="margin-top:12px">أجهزتهم</h2>${chips(S.devices, DEV)}</div>
    ${days.length > 1 ? `<div class="card"><h2>الزوار كل يوم</h2><div class="cols">${days.map(d => `<div title="${d.d}: ${d.v}" style="height:${100 * d.v / maxD}%"></div>`).join('')}</div>
      <p class="tip">من ${fmt(days[0].d)} إلى ${fmt(days[days.length - 1].d)} · أعلى يوم ${ar(maxD)} زائر</p></div>` : ''}
    ${hours.length ? `<div class="card"><h2>أكثر الساعات زيارة</h2>${chips(Object.fromEntries(hours.map(([h, c]) => [`${ar(h)}:٠٠`, c])))}<p class="tip">بتوقيت السعودية. انشر قبلها بساعة تقريبًا.</p></div>` : ''}
    <div class="card"><h2>الدروس</h2>${lessons.length ? `<table class="tbl"><tr><th>الدرس</th><th>بدأ</th><th>أنهى</th><th>يخرجون عند</th><th>صح</th></tr>${lessons.map(l => `<tr><td>${esc(TITLES[l.lesson] || l.lesson)}</td><td class="n">${ar(l.started)}</td><td class="n">${ar(l.done)}${l.started ? ` <small>(${ar(pct(l.done, l.started))}٪)</small>` : ''}</td><td class="n">${l.exit_step ? 'الخطوة ' + ar(l.exit_step) : '—'}</td><td class="n">${l.right + l.wrong ? ar(pct(l.right, l.right + l.wrong)) + '٪' : '—'}</td></tr>`).join('')}</table>
      <p class="tip">«يخرجون عند»: أكثر خطوة يقفل عندها الطلاب الدرس قبل ما يكملونه. «صح»: نسبة الإجابات الصحيحة في الدرس.</p>` : '<p class="muted">لم يبدأ أحد درسًا بعد</p>'}</div>
    <div class="card"><h2>رسالة الاشتراك</h2><p class="muted">ظهرت لهم عند:</p>${chips(S.paywall)}<h2 style="margin-top:12px">ضغطوا واتساب من</h2>${chips(S.wa_from, { landing: 'الصفحة الرئيسية (قديم)', paywall: 'رسالة الاشتراك', course_door: '«أرسل مقررك»', quick_test: 'نتيجة الاختبار' })}</div>
    <div class="card"><h2>الأسئلة الشائعة اللي فتحوها</h2>${chips(S.faq)}</div>
    <div class="card"><h2>أشياء أخرى</h2><div class="bars">${OTHER.map(([k, t]) => `<div class="bar"><span>${t}</span><span>${ar(F[k] || 0)}</span></div>`).join('')}</div></div>
    <div class="card"><h2>نشاط المشتركين</h2>${(S.students || []).length ? `<table class="tbl"><tr><th>الطالب</th><th>آخر دخول</th><th>زيارات</th><th>دروس أنهاها</th></tr>${S.students.map(s => `<tr><td>${esc(s.name || s.username)}</td><td>${when(s.last)}</td><td class="n">${ar(s.visits)}</td><td class="n">${ar(s.lessons)}</td></tr>`).join('')}</table>` : '<p class="muted">لم يدخل مشترك في هذه الفترة</p>'}</div>` + meCard();
  bindMe();
}
/* don't count my own phone: the flag lives on the site's address, so the site sets it via #me */
function meCard() {
  const site = (window.ACADEMY_SITE || 'https://leena.syyad.net/') + '#me';
  return `<div class="card" id="me"><h2>لا تحسب جوالي</h2><p class="muted">افتح الرابط من كل جوال تستخدمه، وزياراته الجاية ما تنحسب في الإحصاءات.</p>
    <a class="mebtn" href="${site}" target="_blank" rel="noopener">لا تحسب هذا الجوال</a></div>`;
}
function bindMe() { try { localStorage.setItem('leena-me', '1'); } catch (e) {} }
function coursePicker(access) {
  const box = document.createElement('div'); box.className = 'stack';
  box.innerHTML = '<label style="margin:0">الدورات وتاريخ الانتهاء</label>' + COURSES.map(c => { const a = (access || []).find(x => x.course === c.id);
    return `<div class="course${a ? ' on' : ''}" data-c="${c.id}"><label class="top" style="flex-direction:row;color:var(--ink)"><input type="checkbox" ${a ? 'checked' : ''}>${esc(c.name)}</label>
    <div class="when"><input type="date" value="${a ? a.expires : ''}" aria-label="تاريخ انتهاء ${esc(c.name)}"><button type="button" class="small" data-m="1">+شهر</button><button type="button" class="small" data-m="3">+٣ أشهر</button><button type="button" class="small" data-m="6">+٦ أشهر</button></div></div>`; }).join('');
  box.querySelectorAll('.course').forEach(row => {
    const cb = row.querySelector('input[type=checkbox]'), dt = row.querySelector('input[type=date]');
    cb.onchange = () => { row.classList.toggle('on', cb.checked); if (cb.checked && !dt.value) dt.value = plusMonths(1); };
    row.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const base = dt.value && dt.value > today() ? dt.value : null; dt.value = plusMonths(+b.dataset.m, base); });
  });
  box.read = () => [...box.querySelectorAll('.course')].filter(r => r.querySelector('input[type=checkbox]').checked).map(r => ({ course: r.dataset.c, expires: r.querySelector('input[type=date]').value }));
  return box;
}
function message(name, username, password, access) {
  const lines = access.map(a => `• ${nameOf(a.course)}: حتى ${fmt(a.expires)}`).join('\n');
  return `أهلًا ${name} 👋\nحسابك في أكاديمية لينا جاهز:\n\nالرابط: ${SITE}\nاسم المستخدم: ${username}\nكلمة المرور: ${password}\n\nدوراتك:\n${lines}\n\nادخل من زر «دخول المشتركين» أعلى الصفحة.`;
}
function result(view, title, text) {
  const c = document.createElement('div'); c.className = 'card ok';
  c.innerHTML = `<h2>${esc(title)}</h2><pre>${esc(text)}</pre><button class="main" style="width:100%">انسخ الرسالة</button>`;
  c.querySelector('button').onclick = async e => { try { await navigator.clipboard.writeText(text); e.target.textContent = 'تم النسخ ✓'; } catch (err) { const r = document.createRange(); r.selectNodeContents(c.querySelector('pre')); getSelection().removeAllRanges(); getSelection().addRange(r); e.target.textContent = 'حدّدتُ النص: انسخه'; } };
  view.prepend(c); c.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function newStudent() {
  const view = document.getElementById('view'); view.innerHTML = '';
  const f = document.createElement('form'); f.className = 'card stack';
  f.innerHTML = `<h2>طالب جديد</h2><label>اسم الطالب<input id="nm" required placeholder="مثل: سارة"></label>
    <div class="row"><label>اسم المستخدم<input id="u" dir="ltr" autocapitalize="none" spellcheck="false" value="${newUsername()}" required></label>
    <label>كلمة المرور<input id="p" dir="ltr" autocapitalize="none" spellcheck="false" value="${newPassword()}" required minlength="6"></label></div>`;
  const picker = coursePicker([]); f.appendChild(picker);
  f.insertAdjacentHTML('beforeend', `<div class="row"><label>المبلغ المدفوع (ريال)<input id="amt" type="number" inputmode="decimal" min="0" step="any" placeholder="مثل: ٣٩"></label>
    <label>ملاحظة<input id="note" placeholder="مثل: بث ١"></label></div><p class="muted" style="margin-top:-6px">للمدير فقط، ولا تظهر للطالب.</p>
    <p class="err" id="e" hidden></p><button class="main" id="go">إنشاء الحساب</button>`);
  view.appendChild(f);
  f.onsubmit = async ev => {
    ev.preventDefault(); const go = f.querySelector('#go'), e = f.querySelector('#e'); e.hidden = true;
    const access = picker.read(), name = f.querySelector('#nm').value.trim(), u = f.querySelector('#u').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, ''), p = f.querySelector('#p').value.trim();
    if (!access.length) { e.textContent = 'اختر دورة واحدة على الأقل.'; e.hidden = false; return; }
    if (access.some(a => !a.expires)) { e.textContent = 'حدّد تاريخ الانتهاء لكل دورة مختارة.'; e.hidden = false; return; }
    go.disabled = true; go.textContent = 'جارٍ الإنشاء…';
    const amt = f.querySelector('#amt').value.trim();
    const { error } = await sb.rpc('admin_create_student', { p_username: u, p_password: p, p_name: name, p_access: access, p_amount: amt === '' ? null : +amt, p_note: f.querySelector('#note').value.trim() });
    go.disabled = false; go.textContent = 'إنشاء الحساب';
    if (error) { e.textContent = errText(error); e.hidden = false; return; }
    newStudent(); result(document.getElementById('view'), `تم إنشاء حساب ${name}`, message(name, u, p, access));
  };
}
async function listStudents() {
  const view = document.getElementById('view'); view.innerHTML = '<div class="card"><p class="muted">جارٍ التحميل…</p></div>';
  const { data, error } = await sb.rpc('admin_list');
  if (error) { view.innerHTML = `<div class="card"><p class="err">${esc(errText(error))}</p></div>`; return; }
  students = data || [];
  const pays = students.flatMap(s => s.payments || []), total = pays.reduce((n, x) => n + +x.amount, 0);
  const byPrice = {}; students.forEach(s => { const first = (s.payments || [])[0]; if (first) byPrice[+first.amount] = (byPrice[+first.amount] || 0) + 1; });
  const since = d => pays.filter(x => new Date(x.at) >= d).reduce((n, x) => n + +x.amount, 0), d7 = new Date(Date.now() - 7 * 864e5);
  view.innerHTML = `<div class="card"><h2>الدخل</h2><div class="row" style="align-items:stretch">
      <div><b style="font-size:24px">${ar(money(total))}</b><p class="muted">ريال · الكل</p></div>
      <div><b style="font-size:24px">${ar(money(since(d7)))}</b><p class="muted">ريال · آخر ٧ أيام</p></div>
      <div><b style="font-size:24px">${ar(students.length)}</b><p class="muted">طالب</p></div></div>
      ${Object.keys(byPrice).length ? `<p class="muted" style="margin-top:8px">أول دفعة لكل طالب: ${Object.entries(byPrice).sort((a, b) => b[1] - a[1]).map(([pr, n]) => `${ar(money(pr))} ريال × ${ar(n)}`).join(' · ')}</p>` : ''}</div>
    <div class="card stack"><label>ابحث بالاسم أو اسم المستخدم<input id="q" placeholder="اكتب للبحث"></label><p class="muted" id="n"></p><div class="list" id="l"></div></div>`;
  const paint = () => {
    const q = view.querySelector('#q').value.trim().toLowerCase();
    const rows = students.filter(s => !q || (s.name || '').toLowerCase().includes(q) || s.username.includes(q));
    view.querySelector('#n').textContent = `${ar(rows.length)} من ${ar(students.length)} طالب`;
    view.querySelector('#l').innerHTML = rows.map(s => `<button class="stu" data-id="${s.user_id}"><span><b>${esc(s.name || s.username)}</b><small dir="ltr" style="text-align:right">${esc(s.username)}</small>${(s.payments || []).length ? `<small>دفع ${ar(money((s.payments || []).reduce((n, x) => n + +x.amount, 0)))} ريال</small>` : ''}</span><span style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">${(s.access || []).map(a => { const left = (new Date(a.expires) - new Date(today())) / 864e5; return `<span class="pill ${left < 0 ? 'end' : left <= 7 ? 'soon' : 'on'}">${esc(nameOf(a.course).replace('القدرات: ', ''))} · ${fmt(a.expires)}</span>`; }).join('') || '<span class="pill end">بدون دورات</span>'}</span></button>`).join('') || '<p class="muted">لا يوجد طلاب بعد.</p>';
    view.querySelectorAll('.stu').forEach(b => b.onclick = () => editStudent(students.find(s => s.user_id === b.dataset.id)));
  };
  view.querySelector('#q').oninput = paint; paint();
}
function editStudent(s) {
  const view = document.getElementById('view'); view.innerHTML = '';
  const f = document.createElement('form'); f.className = 'card stack';
  f.innerHTML = `<h2>${esc(s.name || s.username)}</h2><p class="muted" dir="ltr" style="text-align:right;margin-top:-8px">${esc(s.username)}</p><label>اسم الطالب<input id="nm" value="${esc(s.name)}"></label>`;
  const picker = coursePicker(s.access); f.appendChild(picker);
  f.insertAdjacentHTML('beforeend', `<div class="course" style="gap:6px"><b>الدفعات</b><div id="pl">${(s.payments || []).map(x => `<p class="muted" style="margin:0">${ar(money(x.amount))} ريال · ${esc(x.note || 'بدون ملاحظة')} · ${fmt(String(x.at).slice(0, 10))}</p>`).join('') || '<p class="muted" style="margin:0">لا توجد دفعات مسجلة.</p>'}</div>
    <div class="row"><label>دفعة جديدة (ريال)<input id="amt" type="number" inputmode="decimal" min="0" step="any"></label><label>ملاحظة<input id="note" placeholder="مثل: تجديد"></label></div>
    <button type="button" id="addpay">سجّل الدفعة</button></div>
    <p class="err" id="e" hidden></p><button class="main" id="go">حفظ</button>
    <div class="row"><button type="button" id="pw">كلمة مرور جديدة</button><button type="button" id="msg">رسالة الدورات</button></div>
    <button type="button" class="link" id="back">رجوع إلى القائمة</button><button type="button" class="link" id="del" style="color:var(--bad)">حذف الحساب</button>`);
  view.appendChild(f);
  const e = f.querySelector('#e'), fail = err => { e.textContent = errText(err); e.hidden = false; };
  f.querySelector('#back').onclick = () => listStudents();
  f.querySelector('#addpay').onclick = async () => {
    e.hidden = true; const v = f.querySelector('#amt').value.trim(); if (v === '') return fail('اكتب المبلغ أولًا.');
    const note = f.querySelector('#note').value.trim();
    const { error } = await sb.rpc('admin_add_payment', { p_user: s.user_id, p_amount: +v, p_note: note }); if (error) return fail(error);
    (s.payments = s.payments || []).push({ amount: +v, note, at: new Date().toISOString() }); editStudent(s);
  };
  f.onsubmit = async ev => {
    ev.preventDefault(); e.hidden = true; const access = picker.read();
    if (access.some(a => !a.expires)) return fail('حدّد تاريخ الانتهاء لكل دورة مختارة.');
    const { error } = await sb.rpc('admin_update_student', { p_user: s.user_id, p_name: f.querySelector('#nm').value.trim(), p_access: access });
    if (error) return fail(error);
    s.access = access; s.name = f.querySelector('#nm').value.trim();
    const done = document.createElement('div'); done.className = 'card ok'; done.innerHTML = '<p style="margin:0">تم الحفظ ✓</p>'; view.prepend(done); setTimeout(() => done.remove(), 2500);
  };
  f.querySelector('#pw').onclick = async () => {
    e.hidden = true; const p = newPassword();
    const { error } = await sb.rpc('admin_set_password', { p_user: s.user_id, p_password: p }); if (error) return fail(error);
    result(view, 'كلمة مرور جديدة', `أهلًا ${s.name} 👋\nكلمة مرورك الجديدة في أكاديمية لينا:\n\nاسم المستخدم: ${s.username}\nكلمة المرور: ${p}\n\nالرابط: ${SITE}`);
  };
  f.querySelector('#msg').onclick = () => { const a = picker.read(); result(view, 'رسالة الدورات', `أهلًا ${s.name} 👋\nدوراتك في أكاديمية لينا:\n${a.map(x => `• ${nameOf(x.course)}: حتى ${fmt(x.expires)}`).join('\n') || '• لا توجد دورات حاليًا'}\n\nاسم المستخدم: ${s.username}\nالرابط: ${SITE}`); };
  let sure = false;
  f.querySelector('#del').onclick = async ev => {
    if (!sure) { sure = true; ev.target.textContent = 'اضغط مرة ثانية للتأكيد: سيُحذف الحساب نهائيًا'; return; }
    const { error } = await sb.rpc('admin_delete_student', { p_user: s.user_id }); if (error) return fail(error);
    listStudents();
  };
}
boot().catch(e => loginScreen(errText(e)));
</script>
</body>
